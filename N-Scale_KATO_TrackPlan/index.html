<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b5cab">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="軌道模擬">
<title>N規 KATO Unitrack 模擬器</title>
<link rel="manifest" id="mf">
<link rel="apple-touch-icon" id="ati">
<style>
:root{--bl:#0b5cab;--bg:#eef2f7;--tx:#1b2735;--mut:#6b7a8d;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;overscroll-behavior:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;cursor:pointer}
.b{border:0;border-radius:12px;padding:8px 11px;background:#e3ebf5;color:var(--tx);font-weight:600;font-size:13px;white-space:nowrap;transition:transform .08s}
.b:active{transform:scale(.94)}.b.pri{background:var(--bl);color:#fff}.b.dan{background:#fde8e8;color:#b42318}.b.on{background:var(--bl);color:#fff}
#top{position:absolute;left:0;right:0;top:0;z-index:20;padding:calc(var(--sat) + 6px) 10px 6px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);box-shadow:0 2px 12px rgba(20,40,80,.12)}
.seg{display:flex;background:#e3ebf5;border-radius:12px;padding:3px;gap:2px}.seg button{border:0;background:transparent;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:var(--mut)}.seg button.on{background:var(--bl);color:#fff}
.sp{flex:1}
#verBtn{font-size:11px;padding:5px 8px;background:#dbe7f6;color:var(--bl);font-variant-numeric:tabular-nums}
#edit{position:absolute;left:0;right:0;bottom:0;z-index:15;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(20,40,80,.15);padding:8px 10px calc(var(--sab) + 8px)}
#status{font-size:12px;color:var(--mut);padding:0 4px 5px;display:flex;justify-content:space-between;gap:8px}
.ok{color:#15803d}.no{color:#b45309}
#cats,#pal,#acts{display:flex;gap:6px;overflow-x:auto;touch-action:pan-x}
#cats{padding-bottom:6px}#pal{gap:8px;padding:2px 2px 8px}#cats button,#acts .b{flex:none}
.card{flex:none;width:84px;border:2px solid transparent;border-radius:14px;background:#f3f6fb;padding:4px 4px 5px;text-align:center;font-size:11px;font-weight:600}
.card svg{width:100%;height:38px;display:block}.card.on{border-color:var(--bl);background:#e5f0fd}
#v3d{position:absolute;inset:0;display:none}
.ov{position:absolute;z-index:12;pointer-events:none}.ov>*{pointer-events:auto}
#camBar{left:8px;right:8px;top:calc(var(--sat) + 58px);display:flex;gap:6px;flex-wrap:wrap}
#camBar .b,#trainBtn .b{background:rgba(255,255,255,.92);box-shadow:0 2px 8px rgba(0,0,0,.15)}
#camBar .b.on{background:var(--bl);color:#fff}
#trainBtn{right:8px;top:calc(var(--sat) + 104px)}

/* ---- 控制器（中下，兩台並排）---- */
#ctl{left:0;right:0;bottom:0;padding:0 6px calc(var(--sab) + 6px);display:flex;justify-content:center}
#dock{transform-origin:50% 100%;display:flex;flex-direction:column;align-items:center;gap:6px}
.tools{display:flex;gap:5px;background:rgba(15,27,46,.85);padding:5px;border-radius:14px}
.tools .b{background:#35527f;color:#fff;font-size:12px;padding:7px 9px}.tools .b.on{background:#15803d}.tools .b.dan{background:#b42318}
.crow{display:flex;align-items:flex-end;gap:6px}
.cbody{border-radius:16px;padding:8px 10px 10px;color:#fff;box-shadow:0 6px 24px rgba(0,0,0,.45);position:relative;z-index:2;min-width:236px;transition:opacity .2s}
.cbody.act{outline:3px solid #f59e0b;outline-offset:1px}
.cbody.none{opacity:.55}
.c-sx{background:#202327;border:2px solid #3a3f45}
.c-blue{background:#2f93da;border:2px solid #1d6fae}
.c-teal{background:#1f9a8c;border:2px solid #167467}
.c-mini{background:#2f5b34;border:2px solid #1f4024}
.c-master{background:#5d6d7c;border:2px solid #3f4c58}
.hdr{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:6px}
.hdr .brand{font-weight:900;letter-spacing:1px;background:#f4f4f4;color:#222;border-radius:3px;padding:0 5px}
.hdr .tn{background:#f59e0b;color:#1b2735;border-radius:50%;width:18px;height:18px;text-align:center;line-height:18px;font-weight:900;font-size:12px}
.hdr .mdl{opacity:.85;font-size:10px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .spd{font-weight:800;font-size:13px;background:rgba(0,0,0,.4);padding:2px 6px;border-radius:6px;font-variant-numeric:tabular-nums;min-width:68px;text-align:right}
.led{width:10px;height:10px;border-radius:50%;background:#334;box-shadow:inset 0 0 2px #000}.led.on{background:#4ade80;box-shadow:0 0 8px #4ade80}
.mrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.rev{display:flex;align-items:center;gap:3px}
.rev svg{width:62px;height:62px}
.rl{display:flex;flex-direction:column;gap:3px}
.rl button,.mdir button{border:0;background:rgba(0,0,0,.3);color:#fff;font-weight:800;font-size:11px;padding:5px 8px;border-radius:6px;text-align:left}
[data-d].on{background:#f59e0b!important;color:#1b2735!important}
svg.rot{width:112px;height:112px;touch-action:none;cursor:grab}
[data-rot],[data-slide]{touch-action:none}
.mdir{display:flex;flex-direction:column;gap:4px}
.mscaleBox{position:relative;width:104px;height:164px;touch-action:none;cursor:ns-resize;background:#10151b;border-radius:8px;border:2px solid #2b343d}
.mscaleBox i{position:absolute;left:6px;transform:translateY(-50%);font-style:normal;font-size:10px;font-weight:800;color:#dfe6ec}
.mscaleBox i.eb{color:#ff5a5a}.mscaleBox i.bk{color:#ffb34d}.mscaleBox i.pw{color:#6ee087}.mscaleBox i.nt{color:#fff}
.mscaleBox .slit{position:absolute;left:48px;top:6px;bottom:6px;width:10px;background:#000;border-radius:5px}
.mh{position:absolute;left:42px;width:56px;height:24px;transform:translateY(-50%);background:linear-gradient(#aab1b8,#868d94);border-radius:6px;border:2px solid #444;box-shadow:0 3px 6px rgba(0,0,0,.5);transition:top .08s}
.mh::after{content:"";position:absolute;left:14px;right:14px;top:-12px;height:14px;background:#111;border-radius:4px 4px 0 0}
.ebtn{width:58px;height:58px;border-radius:50%;border:4px solid #7b1f1f;background:radial-gradient(#ff5050,#c01818);color:#fff;font-weight:900;font-size:11px;box-shadow:0 4px 8px rgba(0,0,0,.5)}
.ebtn:active{transform:scale(.92)}
.ebl{font-size:9px;text-align:center;margin-top:4px;opacity:.9}

/* 道岔控制器 (KATO 20-500)：推桿上下推動，上=直進、下=轉彎 */
#tpack{display:flex;align-items:flex-end;margin-left:2px;max-width:200px;overflow-x:auto;overflow-y:hidden;touch-action:pan-x;z-index:1;padding-bottom:2px}
.tbox{flex:none;width:48px;display:flex;flex-direction:column;align-items:center;gap:2px;margin-left:3px;cursor:pointer;color:#fff;font-size:10px;font-weight:800;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.tbox:first-child{margin-left:0}
.tbox svg{width:44px;height:110px;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4))}
.tbn{width:22px;height:22px;background:#000;color:#fff;border-radius:3px;font-size:14px;line-height:22px;text-align:center;font-weight:900;text-shadow:none}
.tbox .tl{line-height:1}

.sheet{position:absolute;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(var(--sab) + 14px);width:min(92vw,380px);background:#fff;border-radius:18px;box-shadow:0 10px 40px rgba(0,0,0,.3);padding:14px;display:none}
.sheet h3{margin:0 0 8px}.sheet label{display:block;font-size:13px;margin:8px 0 3px;color:var(--mut)}.sheet select,.sheet input{width:100%}.sheet select{padding:9px;border-radius:10px;border:1px solid #ccd6e4}
#modal{position:absolute;inset:0;z-index:40;background:rgba(10,20,40,.5);display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:#fff;border-radius:20px;padding:16px;width:min(100%,440px);max-height:84vh;overflow:auto;-webkit-user-select:text;user-select:text}
#modal .it{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 12px;border-radius:12px;border:0;background:#f1f5fa;font-weight:700}
#modal .it small{display:block;color:var(--mut);font-weight:400;margin-top:2px}
.ver{border-left:3px solid #c7d6ea;padding:2px 0 2px 10px;margin:12px 0}
.ver.cur{border-color:var(--bl)}
.ver h4{margin:0 0 4px;font-size:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ver h4 em{font-style:normal;font-weight:500;font-size:11px;color:var(--mut)}
.ver h4 .tag{background:var(--bl);color:#fff;border-radius:6px;padding:1px 6px;font-size:10px}
.ver ul{margin:0;padding:0;list-style:none;font-size:13px;line-height:1.55}
.ver li{margin:3px 0}
.pt{display:inline-block;background:#e5f0fd;color:var(--bl);border-radius:6px;padding:0 6px;margin-right:6px;font-size:11px;font-weight:700}
#toast{position:absolute;z-index:60;left:50%;top:calc(var(--sat) + 64px);transform:translateX(-50%);background:rgba(20,30,50,.92);color:#fff;padding:9px 14px;border-radius:12px;font-size:13px;display:none;max-width:88vw;text-align:center}
#msg3{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#456;font-weight:700;z-index:11}
</style>
</head>
<body>
<header id="top">
  <b style="color:var(--bl)">🚆</b>
  <div class="seg"><button id="b2d" class="on">2D 編輯</button><button id="b3d">3D 運行</button></div>
  <button class="b" id="verBtn">v1.11.0</button>
  <div class="sp"></div>
  <button class="b pri" id="btnInstall" style="display:none">⬇ 安裝為手機 App</button>
  <button class="b" id="btnMenu">☰ 選單</button>
</header>

<canvas id="c2d"></canvas>
<section id="edit">
  <div id="status"></div>
  <div id="cats"></div>
  <div id="pal"></div>
  <div id="acts">
    <button class="b" id="aUndo">↶ 復原</button>
    <button class="b" id="aFlip">⇄ 接合端</button>
    <button class="b pri" id="aPlace">＋ 放置</button>
    <button class="b" id="aSw">🔀 道岔切換</button>
    <button class="b dan" id="aDel">🗑 刪除</button>
    <button class="b" id="aFit">⌖ 全覽</button>
  </div>
</section>

<section id="v3d">
  <canvas id="c3d"></canvas>
  <div id="msg3">載入 3D 引擎中…</div>
  <div class="ov" id="camBar">
    <button class="b on" data-m="free">🌍 自由</button>
    <button class="b" data-m="follow">🎥 跟隨</button>
    <button class="b" data-m="cab">🚆 車頭</button>
    <button class="b" data-m="op">🧑 操控者</button>
    <button class="b" id="camEnd">⇄ 車頭視角</button>
    <button class="b" id="camReset">↺ 重置</button>
  </div>
  <div class="ov" id="trainBtn"><button class="b pri" id="bTrain">🚉 火車</button></div>
  <div class="ov" id="ctl">
    <div id="dock">
      <div class="tools">
        <button class="b" id="bStyle">🎛 控制器</button>
        <button class="b dan" id="bStop">全部緊急停止</button>
        <button class="b" id="bHorn">🔔</button>
        <button class="b on" id="bIner">慣性</button>
        <button class="b on" id="bSnd">🔊</button>
      </div>
      <div class="crow"><div id="ctlBody0" class="cbody"></div><div id="ctlBody1" class="cbody"></div><div id="tpack"></div></div>
    </div>
  </div>
  <div class="sheet" id="trainSheet">
    <h3>🚉 放上火車</h3>
    <div id="loopInfo" style="font-size:13px"></div>
    <label>車號</label><select id="selSlot"><option value="0">1 號車</option><option value="1">2 號車</option></select>
    <label>放置環線</label><select id="selLoop"></select>
    <label>列車種類</label><select id="selTrain"></select>
    <label>編成數：<b id="carN">10</b> 輛</label><input type="range" id="selCars" min="2" max="10" value="10">
    <div style="display:flex;gap:8px;margin-top:14px"><button class="b pri" id="tGo" style="flex:1">放上軌道</button><button class="b dan" id="tRm">移除此車</button><button class="b" id="tClose">關閉</button></div>
  </div>
</section>
<div id="modal"><div class="box" id="modalBox"></div></div>
<div id="toast"></div>

<script>
'use strict';
const D=Math.PI/180,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const norm=a=>((a%360)+360)%360,angDiff=(a,b)=>{const d=Math.abs(norm(a)-norm(b));return d>180?360-d:d},clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let toastT;function toast(t,ms=2200){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',ms)}

/* ============ 版本與修改日誌（改版時：更新 APP_VER，並在 CHANGELOG 最前面新增一筆） ============ */
const APP_VER='1.11.0';
const CHANGELOG=[

  ['操控器','每台控制器標題列有編號與速度；未放置的車控制器變淡；最後操作的那台有橘色外框'],
  ['視角','跟隨與車頭視角看最後操作的那台（外框標示），鍵盤 1／2 也可指定'],

 {v:'1.9.0',d:'2026-11-28',items:[
  ['架構','KATO 軌道零件（直線、曲線、道岔、交叉）獨立成 tracks/kato.js'],
  ['架構','島式月台（含 3D 模型）與全部預設軌道組一併移到 tracks/kato.js'],
  ['架構','index.html 改用軌道註冊函式（reg、registerStation、registerPreset）；新增軌道檔只需加檔案並登記到 TRACK_FILES'],

 {v:'1.8.0',d:'2026-11-28',items:[

  ['架構','車輛模型獨立成 trains/e5.js；新增車種只需新增檔案並登記到 TRAIN_FILES'],
  ['架構','index.html 改用車輛註冊表（registerTrain），不再內建車輛模型']]},
 {v:'1.7.0',d:'2026-11-28',items:[
  ['火車','支援兩台列車同時出現（1 號車、2 號車），可分別選環線、車種、編成數'],
  ['操控器','兩台各自擁有獨立的速度、方向、煞車與緊急停止'],
  ['視角','跟隨與車頭視角跟著目前控制中的列車；車頭視角只隱藏該車的車頭'],
  ['火車','兩台放在同一環線時，第二台自動放在對面半圈；環線太短會提示']]},
 {v:'1.6.0',d:'2026-11-28',items:[
  ['軌道','新增預設組「M1 + V1 島式車站」：內側 M1 環線（R315）、外側 V1 環線（R381），兩圈同心、間距 66 mm'],
  ['車站','新增島式月台零件（372×26×8 mm），位於兩條直線軌道之間；2D 以米色矩形顯示，可選取與刪除'],
  ['3D 模型','車站建模：月台、黃色警戒線、立柱與頂棚、長椅、「KATO 駅」站名牌、端部樓梯間'],
  ['火車','火車面板新增「放置環線」選單，多個獨立環線時可選擇要放在哪一條'],
  ['軌道','環線偵測改為可找出全部獨立環線，狀態列顯示環線數量']]},
 {v:'1.5.1',d:'2026-11-28',items:[
  ['道岔控制器','改為 KATO 20-500 的上下推動式：推桿在上＝直進、在下＝轉彎；滑槽標示直進與分岔符號'],
  ['道岔控制器','每個控制器底部加黑底白字編號方塊，與道岔對應'],
  ['道岔控制器','2D 編輯畫面與 3D 場景的道岔旁標示相同編號，方便辨認控制哪一個道岔'],
  ['道岔控制器','修正被主控制器蓋住、被切掉的問題；道岔很多時可左右滑動'],
  ['操控器','點滑槽上半＝直進、下半＝轉彎']]},
 {v:'1.5.0',d:'2026-11-28',items:[
  ['操控器','控制器移到畫面中下方，視窗過窄時自動縮放'],
  ['操控器','新增五種可切換的控制器：Standard SX（黑）、Standard S（藍 22-012）、Standard（綠 22-011）、迷你控制器、主控器 22-053'],
  ['操控器','主控器新增 B1~B7 煞車段、P1~P5 動力段、非常煞車與紅色非常鈕'],
  ['操控器','控制器選擇會記憶（localStorage）'],
  ['道岔','道岔切換改為 KATO 20-500 道岔控制器，接在控制器右方，每個道岔一個'],
  ['系統','每次修改一律提供完整 index.html']]},
 {v:'1.4.0',d:'2026-11-28',items:[
  ['系統','新增版本號顯示（頂部列版本按鈕）'],
  ['系統','新增「版本日誌」視窗，記錄每次修改的部位；版本更新後首次開啟自動彈出'],
  ['PWA','Service Worker 快取名稱改為隨版本號變動']]},
 {v:'1.3.0',d:'2026-11-28',items:[
  ['3D 模型','E5 車鼻改為鴨嘴形：車頂緩降、寬度漸縮、鼻尖圓鈍'],
  ['3D 模型','粉紅線在車鼻上往下收，鼻尖改為白色蓋'],
  ['3D 模型','駕駛室窗改為獨立深色窗，加灰色窗框與前方斜面玻璃'],
  ['3D 模型','頭燈／尾燈移到鼻尖兩側'],
  ['3D 模型','車頂改為飛鳥綠；車窗改為一格一格的小窗，車門位置留空並加門縫線']]},
 {v:'1.2.0',d:'2026-11-28',items:[
  ['3D 場景','修正場地閃爍：移除共面草地平面，改為底板頂面直接上綠色並下降 0.3 mm'],

c3.addEventListener('contextmenu',e=>e.preventDefault());
const zoom3=f=>{if(camMode==='op')opFov=clamp(opFov*f,15,80);else if(camMode==='cab'){}else if(camMode==='follow'&&trains[act])orb.df=clamp(orb.df*f,60,3000);else orb.d=clamp(orb.d*f,60,12000)};
function pan3(dx,dy){if(camMode!=='free')return;const th=orb.th*D,s=orb.d*.0016,fx=-Math.cos(th),fz=-Math.sin(th),rx=Math.sin(th),rz=-Math.cos(th);orb.t.x+=-dx*s*rx+dy*s*fx;orb.t.z+=-dx*s*rz+dy*s*fz}
function rot3(dx,dy){
  if(camMode==='free'||(camMode==='follow'&&trains[act])){
    orb.th+=dx*.35;
    orb.ph=clamp(orb.ph+dy*.3,4,88);
  }else{
    look.yaw=clamp(look.yaw-dx*.25,-150,150);
    look.pit=clamp(look.pit+dy*.2,-60,60);
  }
}
c3.addEventListener('pointerdown',e=>{c3.setPointerCapture(e.pointerId);p3.set(e.pointerId,{x:e.clientX,y:e.clientY});initAudio()});
c3.addEventListener('pointermove',e=>{const o=p3.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;
  if(p3.size===1){(e.shiftKey||e.buttons===2||e.ctrlKey)?pan3(dx,dy):rot3(dx,dy)}
  else if(p3.size===2){const a=[...p3.values()],d0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);o.x=e.clientX;o.y=e.clientY;const d1=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom3(d0/(d1||1));pan3(dx/2,dy/2);return}
  o.x=e.clientX;o.y=e.clientY});
['pointerup','pointercancel'].forEach(t=>c3.addEventListener(t,e=>p3.delete(e.pointerId)));
c3.addEventListener('wheel',e=>{e.preventDefault();zoom3(Math.exp(e.deltaY*.001))},{passive:false});
$('#camBar').onclick=e=>{const b=e.target.closest('.b');if(!b)return;
  if(b.id==='camEnd'){const t=trains[act];if(!t)return toast('請先放上火車');t.camRev=!t.camRev;return}
  if(b.id==='camReset'){look.yaw=look.pit=0;orb.th=90;orb.ph=50;opFov=50;orb.df=380;if(camMode!=='follow')orb.t.set((bb.x0+bb.x1)/2,0,(bb.y0+bb.y1)/2);return}
  const m=b.dataset.m;if((m==='cab'||m==='follow')&&!trains[act])toast('請先放上火車');camMode=m;look.yaw=look.pit=0;[...$('#camBar').querySelectorAll('[data-m]')].forEach(x=>x.classList.toggle('on',x===b))};

/* 火車面板 */
$('#selCars').oninput=e=>$('#carN').textContent=e.target.value;
$('#bTrain').onclick=()=>{const ls=findLoops();
  $('#loopInfo').innerHTML=ls.length?`<span class="ok">✔ 已形成 ${ls.length} 條封閉環線</span>`:'<span class="no">✘ 軌道尚未形成封閉環線，請回 2D 補齊</span>';
  $('#selLoop').innerHTML=ls.map((l,n)=>`<option value="${n}">環線 ${n+1}（${(l.len/1000).toFixed(2)} m）</option>`).join('')||'<option value="0">（無）</option>';
  $('#selSlot').value=trains[0]?(trains[1]?String(act):'1'):'0';
  $('#trainSheet').style.display='block'};
$('#tGo').onclick=()=>{const ls=findLoops(),lp=ls[+$('#selLoop').value||0];if(!lp)return toast('軌道尚未形成封閉環線');placeTrain(lp,+$('#selSlot').value,lp.p+':'+lp.i)};
$('#tRm').onclick=()=>{removeTrain(+$('#selSlot').value);$('#trainSheet').style.display='none'};$('#tClose').onclick=()=>$('#trainSheet').style.display='none';

/* ============ 控制器（可切換款式；兩台並排，各自控制一台列車） ============ */
const CTLS={
  sx:{name:'Power Pack Standard SX（黑）',short:'Standard SX',cls:'c-sx',kind:'rot',lab:['FWD','OFF','REV']},
  blue:{name:'Power Pack Standard S（藍 22-012）',short:'22-012 Std S',cls:'c-blue',kind:'rot',lab:['前進','停止','後進']},
  teal:{name:'Power Pack Standard（綠 22-011）',short:'22-011 Std',cls:'c-teal',kind:'rot',lab:['前進','停止','後進']},
  mini:{name:'迷你控制器（深綠）',short:'Mini',cls:'c-mini',kind:'mini',lab:['FWD','OFF','REV']},
  master:{name:'主控器 22-053（B 煞車／P 動力）',short:'No.22-053',cls:'c-master',kind:'master',lab:['前','切','後']}
};
let ctlKey='sx';try{const s=localStorage.getItem(LSC);if(CTLS[s])ctlKey=s}catch(e){}
const MB=n=>.5-n*.062,MP=n=>.5+n*.088;
function revHTML(l){return `<div class="rev"><svg viewBox="-34 -34 68 68"><g class="rkg"><rect x="-32" y="-5" width="32" height="10" rx="5" fill="#c9ced4" stroke="#8d949b"/><circle r="15" fill="#d5d9dd" stroke="#8d949b" stroke-width="2"/><circle r="9" fill="#bfc4ca"/></g></svg><div class="rl"><button data-d="1">${l[0]}</button><button data-d="0">${l[1]}</button><button data-d="-1">${l[2]}</button></div></div>`}
function rotHTML(){let tk='';for(let i=0;i<=10;i++){const a=(-135+27*i)*D,s=Math.sin(a),c=-Math.cos(a);tk+=`<line x1="${s*44}" y1="${c*44}" x2="${s*49}" y2="${c*49}" stroke="#555" stroke-width="${i%5?1:2}"/>`}
  return `<svg class="rot" data-rot viewBox="-60 -60 120 120"><circle r="57" fill="rgba(0,0,0,.35)"/><circle r="50" fill="#e4e7ea" stroke="#9aa0a6" stroke-width="2"/>${tk}<text x="-26" y="34" font-size="8" font-weight="800" fill="#333" text-anchor="middle">0</text><text x="26" y="34" font-size="8" font-weight="800" fill="#333" text-anchor="middle">MAX</text><g class="rotg"><path d="M-10 6 L-5 -40 L5 -40 L10 6Z" fill="#c9ced4" stroke="#8d949b" stroke-width="1.5"/><circle r="11" fill="#b8bec5" stroke="#8d949b" stroke-width="1.5"/><circle cy="-46" r="9.5" fill="#111"/><circle cx="-3" cy="-49" r="2.6" fill="#666"/></g></svg>`}
function miniHTML(){let tk='';for(let i=0;i<=10;i++){const a=(-135+27*i)*D,s=Math.sin(a),c=-Math.cos(a);tk+=`<line x1="${s*50}" y1="${c*50}" x2="${s*56}" y2="${c*56}" stroke="#cfe" stroke-width="${i%5?1:2}"/>`}
  return `<svg class="rot" data-rot viewBox="-60 -60 120 120">${tk}<circle r="46" fill="#0b0b0b" stroke="#333" stroke-width="3"/><circle r="38" fill="none" stroke="#2a2a2a" stroke-width="1"/><circle r="30" fill="none" stroke="#2a2a2a" stroke-width="1"/><circle r="22" fill="none" stroke="#2a2a2a" stroke-width="1"/><circle r="14" fill="none" stroke="#2a2a2a" stroke-width="1"/><g class="rotg"><line y1="-8" y2="-42" stroke="#e8e8e8" stroke-width="5" stroke-linecap="round"/></g></svg>`}
function masterHTML(l){let lab=`<i class="eb" style="top:2%">非常</i>`;for(let n=7;n>=1;n--)lab+=`<i class="bk" style="top:${MB(n)*100}%">B${n}</i>`;lab+=`<i class="nt" style="top:50%">切</i>`;for(let p=1;p<=5;p++)lab+=`<i class="pw" style="top:${MP(p)*100}%">P${p}</i>`;
  return `<div class="mdir"><button data-d="1">${l[0]}</button><button data-d="0">${l[1]}</button><button data-d="-1">${l[2]}</button></div><div class="mscaleBox" data-slide>${lab}<div class="slit"></div><div class="mh"></div></div><div><button class="ebtn" data-eb>緊急</button><div class="ebl">EMERGENCY<br>BRAKE</div></div>`}
function renderCtl(){const c=CTLS[ctlKey];
  [0,1].forEach(i=>{const b=$('#ctlBody'+i);b.className='cbody '+c.cls;
    const hdr=`<div class="hdr"><span class="led"></span><b class="tn">${i+1}</b><span class="brand">KATO</span><span class="mdl">${c.short}</span><span class="spd">0 km/h</span></div>`;
    let inner;if(c.kind==='rot')inner=revHTML(c.lab)+rotHTML();else if(c.kind==='mini')inner=revHTML(c.lab)+miniHTML();else inner=masterHTML(c.lab);
    b.innerHTML=hdr+`<div class="mrow">${inner}</div>`});
  updCtl();fitDock()}
function updCtl(){
  [0,1].forEach(i=>{const b=$('#ctlBody'+i);if(!b)return;const s=C(i),q=x=>b.querySelector(x);
    b.classList.toggle('act',i===act);b.classList.toggle('none',!trains[i]);
    const led=q('.led');if(led)led.classList.toggle('on',s.lever!==0);
    const rg=q('.rotg');if(rg)rg.setAttribute('transform',`rotate(${-135+270*s.dial})`);
    const rk=q('.rkg');if(rk)rk.setAttribute('transform',`rotate(${s.lever*40})`);
    b.querySelectorAll('[data-d]').forEach(x=>x.classList.toggle('on',+x.dataset.d===s.lever));
    const mh=q('.mh');if(mh){let f=.5;if(s.emerg)f=.02;else if(s.brk>0)f=MB(Math.round(s.brk*7));else if(s.dial>0)f=MP(clamp(Math.round(s.dial*5),1,5));mh.style.top=(f*100)+'%'}});
  showSpd()}
function emergency(i){const s=C(i);s.dial=0;s.lever=0;s.brk=0;s.emerg=true;updCtl()}
function setMaster(i,f){const s=C(i);s.emerg=false;s.brk=0;
  if(f<.035){emergency(i);return}
  if(f<.47){s.brk=clamp(Math.round((.5-f)/.062),1,7)/7;s.dial=0}
  else if(f<=.53){s.dial=0}
  else s.dial=clamp(Math.round((f-.5)/.088),1,5)/5;
  updCtl()}
function selectTrain(i){act=i;if(!trains[i])toast(`${i+1} 號車尚未放置，請按「🚉 火車」放上軌道`);updCtl()}
function fitDock(){const d=$('#dock');if(!d)return;d.style.transform='';const w=d.offsetWidth;if(w>0){const s=Math.min(1,(innerWidth-12)/w);if(s<1)d.style.transform=`scale(${s})`}}
/* 兩台控制器各自的拖曳／點擊處理 */
[0,1].forEach(i=>{const cb=$('#ctlBody'+i);let drag=null;
  const mv=e=>{if(!drag)return;const r=drag.el.getBoundingClientRect(),s=C(i);
    if(drag.t==='rot'){const ang=Math.atan2(e.clientX-(r.left+r.width/2),-(e.clientY-(r.top+r.height/2)))/D;s.dial=clamp((clamp(ang,-135,135)+135)/270,0,1);s.emerg=false;s.brk=0;updCtl()}
    else setMaster(i,clamp((e.clientY-r.top)/r.height,0,1))};
  cb.addEventListener('pointerdown',e=>{if(act!==i){act=i;updCtl()}
    const r=e.target.closest('[data-rot]'),s=e.target.closest('[data-slide]');
    if(r)drag={t:'rot',el:r};else if(s)drag={t:'slide',el:s};else return;
    cb.setPointerCapture(e.pointerId);initAudio();mv(e)});
  cb.addEventListener('pointermove',mv);
  ['pointerup','pointercancel'].forEach(t=>cb.addEventListener(t,()=>{drag=null}));
  cb.addEventListener('click',e=>{const d=e.target.closest('[data-d]');if(d){const s=C(i);s.lever=+d.dataset.d;s.emerg=false;updCtl();return}if(e.target.closest('[data-eb]'))emergency(i)})});
$('#bStyle').onclick=()=>{showModal('<h3 style="margin:0 0 6px">🎛 選擇控制器</h3>'+Object.keys(CTLS).map(k=>`<button class="it" data-k="${k}">${CTLS[k].name}${k===ctlKey?' ✔':''}</button>`).join(''));
  $('#modalBox').onclick=e=>{const b=e.target.closest('.it');if(!b)return;ctlKey=b.dataset.k;try{localStorage.setItem(LSC,ctlKey)}catch(x){}renderCtl();$('#modal').style.display='none'}};
$('#bStop').onclick=()=>{emergency(0);emergency(1)};
$('#bIner').onclick=e=>e.currentTarget.classList.toggle('on');
$('#bSnd').onclick=e=>{e.currentTarget.classList.toggle('on');initAudio()};
let ac,mo,mg;function initAudio(){if(!$('#bSnd').classList.contains('on'))return null;if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();mo=ac.createOscillator();mo.type='sawtooth';mg=ac.createGain();mg.gain.value=0;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=500;mo.connect(f);f.connect(mg);mg.connect(ac.destination);mo.start()}catch(e){return null}}if(ac.state==='suspended')ac.resume();return ac}
$('#bHorn').onclick=()=>{const a=initAudio();if(!a)return;[392,523].forEach(f=>{const o=a.createOscillator(),gn=a.createGain();o.type='square';o.frequency.value=f;gn.gain.setValueAtTime(.06,a.currentTime);gn.gain.exponentialRampToValueAtTime(.001,a.currentTime+.9);o.connect(gn);gn.connect(a.destination);o.start();o.stop(a.currentTime+.9)})};
/* 鍵盤：1／2 指定目前的車，其餘按鍵操作目前的那一台 */
addEventListener('keydown',e=>{if(mode!=='3d')return;const s=C(act);
  if(e.key==='1')selectTrain(0);else if(e.key==='2')selectTrain(1);
  else if(e.key==='ArrowUp'){s.dial=clamp(s.dial+.05,0,1);s.brk=0;s.emerg=false}
  else if(e.key==='ArrowDown')s.dial=clamp(s.dial-.05,0,1);
  else if(e.key==='f')s.lever=1;else if(e.key==='r')s.lever=-1;else if(e.key==='o')s.lever=0;
  else if(e.key===' ')emergency(act);else return;updCtl()});
addEventListener('resize',()=>{resize2();resize3();fitDock()});

/* ============ 啟動：先載入軌道檔與車輛檔，再讀取存檔 ============ */
renderCtl();resize2();
Promise.all([loadTracks(),loadTrains()]).then(()=>{
  let ok=false;
  try{const s=JSON.parse(localStorage.getItem(LS)||'null');if(Array.isArray(s)&&s.length&&s.every(p=>CAT[p.id])){pieces=s;ok=true}}catch(e){}
  if(!CAT[selType]&&TYPES.length)selType=TYPES[0].id;
  renderPal();
  if(!ok&&PRESETS[0]){_b=[];PRESETS[0].f();pieces=_b}
  rebuild();updStatus();fit();
  try{if(localStorage.getItem(LSV)!==APP_VER){localStorage.setItem(LSV,APP_VER);setTimeout(showLog,400)}}catch(e){}});
</script>
