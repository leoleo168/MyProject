<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D列印機台生產工單</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  /* 強制維持正方形比例 */
  .square-box {
    aspect-ratio: 1 / 1;
    border: 1.5px solid #000000 !important;
  }

  /* 網頁預覽用的 A4 卡片樣式 */
  .a4-card {
    width: 210mm;
    height: 297mm; /* 固定 A4 高度 */
    margin: 0 auto 20px auto; /* 網頁預覽時卡片之間留空隙 */
    background: white;
    padding: 10mm 12mm;
    box-sizing: border-box;
    box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
    border-radius: 0.5rem;
    display: flex;
    flex-direction: column;
    page-break-after: always;
    break-after: page;
  }

  /* 列印專用樣式 */
  @media print {
    @page {
      size: A4 portrait;
      margin: 0 !important;
    }
    body {
      background: #ffffff !important;
      margin: 0 !important;
      padding: 0 !important;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .no-print {
      display: none !important;
    }
    
    .a4-card {
      width: 210mm;
      height: 297mm !important;
      max-height: 297mm !important;
      padding: 8mm 10mm !important;
      margin: 0 !important;
      border: none !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      overflow: hidden;
    }
  }
</style>
</head>
<body class="bg-slate-200 min-h-screen text-slate-900 p-3 md:p-6 text-sm font-sans">

<div class="max-w-4xl mx-auto">
  
  <!-- 頂部控制面板 (列印時完全隱藏) -->
  <div class="no-print bg-white p-5 rounded-xl shadow-md border border-slate-300 mb-6">
    <div class="flex flex-wrap items-center justify-between gap-3 mb-4 border-b border-slate-200 pb-4">
      <div>
        <h1 class="text-lg font-black text-slate-900">3D列印生產工單系統</h1>
        <p class="text-xs text-slate-500 font-bold mt-1">固定一行 10 格・超過 100 盤自動產生新頁面</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleItemModal(true)" class="flex items-center gap-1 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2 rounded-lg font-bold text-xs border border-slate-300 transition">
          ⚙️ 品項庫管理
        </button>
        <button onclick="window.print()" class="flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg font-black shadow-md transition active:scale-95 text-sm">
          🖨️ 列印 A4 工單
        </button>
      </div>
    </div>

    <!-- 參數輸入區 -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">列印品項名稱</label>
        <div class="flex flex-col gap-1.5">
          <select id="itemSelect" onchange="handleSelectChange()" class="text-sm border border-slate-300 rounded-lg p-2 bg-slate-50 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500"></select>
          <input type="text" id="itemInput" value="感測器固定外殼" oninput="renderBatches()" class="w-full text-sm border border-slate-300 rounded-lg p-2 font-bold outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
        </div>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">每盤容量 (個/盤)</label>
        <input type="number" id="perPlateInput" min="1" value="4" oninput="renderBatches()" class="w-full text-base border border-slate-300 rounded-lg p-2 font-black text-blue-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mt-1">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1.5">總需求數量 (PCS)</label>
        <input type="number" id="totalQtyInput" min="1" value="500" oninput="renderBatches()" class="w-full text-base border border-slate-300 rounded-lg p-2 font-black text-blue-700 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 mt-1">
      </div>
    </div>
  </div>

  <!-- 列印預覽區 (JS 動態生成多張 A4 卡片) -->
  <div id="printArea">
    <!-- 動態插入 .a4-card -->
  </div>

</div>

<!-- 後台品項管理彈窗 Modal -->
<div id="itemModal" class="no-print fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
  <div class="bg-white rounded-xl shadow-xl max-w-lg w-full p-5 max-h-[90vh] flex flex-col">
    <div class="flex justify-between items-center mb-3 border-b pb-2">
      <h3 class="text-sm font-bold text-slate-900">📦 品項庫管理</h3>
      <button onclick="toggleItemModal(false)" class="text-slate-400 hover:text-slate-600 font-bold text-base">✕</button>
    </div>
    <div class="overflow-y-auto flex-1 pr-1 space-y-4">
      <div class="bg-blue-50 border border-blue-200 rounded-lg p-3">
        <label class="block text-xs font-bold text-blue-900 mb-1">📋 從 Google 試算表貼入品項</label>
        <textarea id="bulkPasteInput" rows="3" placeholder="貼上範例：&#10;品項 A&#10;品項 B" class="w-full text-xs border border-blue-300 rounded p-2 outline-none bg-white font-mono"></textarea>
        <button onclick="importFromPaste()" class="mt-2 w-full bg-blue-600 hover:bg-blue-700 text-white text-xs py-1.5 rounded font-bold transition">批次解析並加入</button>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-700">目前庫存品項 (<span id="itemCount">0</span>)</label>
          <button onclick="clearAllItems()" class="text-[10px] text-red-500 hover:underline">清空全部</button>
        </div>
        <div id="modalItemList" class="max-h-40 overflow-y-auto border border-slate-200 rounded divide-y divide-slate-100 bg-white"></div>
      </div>
    </div>
    <div class="flex justify-end pt-3 border-t mt-3">
      <button onclick="toggleItemModal(false)" class="bg-slate-900 text-white text-xs px-5 py-2 rounded-lg font-bold hover:bg-black">完成關閉</button>
    </div>
  </div>
</div>

<script>
  const DEFAULT_ITEMS = ["感測器固定外殼", "導軌防塵護蓋", "線軸固定轉接件", "治具固定夾塊"];
  let items = [];
  
  // 每頁最多 100 格 (10欄 x 10列)
  const MAX_PLATES_PER_PAGE = 100;

  window.addEventListener('DOMContentLoaded', () => {
    loadItems();
    renderBatches();
  });

  function loadItems() {
    const saved = localStorage.getItem('3d_print_items');
    if (saved) { try { items = JSON.parse(saved); } catch(e) { items = [...DEFAULT_ITEMS]; } } 
    else { items = [...DEFAULT_ITEMS]; }
    populateSelect();
  }

  function saveItems() { localStorage.setItem('3d_print_items', JSON.stringify(items)); populateSelect(); }

  function populateSelect() {
    const select = document.getElementById('itemSelect');
    select.innerHTML = '<option value="">選擇預設品項...</option>';
    items.forEach(item => {
      const opt = document.createElement('option');
      opt.value = item; opt.textContent = item;
      select.appendChild(opt);
    });
    const customOpt = document.createElement('option');
    customOpt.value = "custom"; customOpt.textContent = "✎ 自行手動輸入...";
    select.appendChild(customOpt);
    renderModalList();
  }

  function handleSelectChange() {
    const select = document.getElementById('itemSelect');
    const input = document.getElementById('itemInput');
    if (select.value === 'custom') { input.value = ''; input.focus(); } 
    else if (select.value !== '') { input.value = select.value; }
    renderBatches();
  }

  function toggleItemModal(show) {
    const modal = document.getElementById('itemModal');
    if (show) { modal.classList.remove('hidden'); renderModalList(); } 
    else { modal.classList.add('hidden'); }
  }

  function renderModalList() {
    const list = document.getElementById('modalItemList');
    document.getElementById('itemCount').innerText = items.length;
    list.innerHTML = '';
    items.forEach((item, index) => {
      const row = document.createElement('div');
      row.className = "flex justify-between items-center px-3 py-1.5 text-xs hover:bg-slate-50";
      row.innerHTML = `<span class="font-medium text-slate-800">${item}</span>
        <button onclick="deleteItem(${index})" class="text-red-500 hover:text-red-700 font-bold px-1 text-[11px]">刪除</button>`;
      list.appendChild(row);
    });
  }

  function deleteItem(index) { items.splice(index, 1); saveItems(); }
  function clearAllItems() { if (confirm('確定要清空所有品項嗎？')) { items = []; saveItems(); } }

  function importFromPaste() {
    const text = document.getElementById('bulkPasteInput').value;
    if (!text.trim()) return alert('請先貼入內容');
    const newItems = text.split(/\r?\n/).map(i => i.trim()).filter(i => i.length > 0);
    newItems.forEach(item => { if (!items.includes(item)) { items.push(item); } });
    saveItems();
    document.getElementById('bulkPasteInput').value = '';
    alert('匯入成功！');
  }

  // 🏆 核心：分頁與固定 10 欄排版邏輯
  function renderBatches() {
    const perPlate = parseInt(document.getElementById('perPlateInput').value, 10) || 1;
    const totalQty = parseInt(document.getElementById('totalQtyInput').value, 10) || 0;
    const itemName = document.getElementById('itemInput').value || '未填寫品項';
    
    const today = new Date();
    const currentDate = today.toISOString().split('T')[0];
    const orderId = Math.floor(100000 + (today.getTime() % 900000)); 
    
    const printArea = document.getElementById('printArea');
    printArea.innerHTML = '';

    if (totalQty <= 0 || perPlate <= 0) return;

    const totalPlates = Math.ceil(totalQty / perPlate);

    // 建立所有盤數資料
    const allPlates = [];
    let runningCumulative = 0;
    for (let i = 0; i < totalPlates; i++) {
      const isLastPlate = (i === totalPlates - 1);
      const remainder = totalQty % perPlate;
      const currentPlateQty = (isLastPlate && remainder !== 0) ? remainder : perPlate;
      runningCumulative += currentPlateQty;
      allPlates.push({
        index: i + 1,
        qty: currentPlateQty,
        cumulative: runningCumulative
      });
    }

    // 將盤數依照 MAX_PLATES_PER_PAGE (100) 切割成多個分頁
    const chunks = [];
    for (let i = 0; i < allPlates.length; i += MAX_PLATES_PER_PAGE) {
      chunks.push(allPlates.slice(i, i + MAX_PLATES_PER_PAGE));
    }

    // 針對每個分頁產生一張 A4 卡片
    chunks.forEach((chunk, pageIndex) => {
      const a4Card = document.createElement('div');
      a4Card.className = 'a4-card';
      
      const isMultiPage = chunks.length > 1;
      const pageTitleSuffix = isMultiPage ? `<span class="text-base text-blue-600 ml-2">(第 ${pageIndex + 1} 頁 / 共 ${chunks.length} 頁)</span>` : '';
      const rangeText = isMultiPage ? `（第 ${chunk[0].index} 盤 ~ 第 ${chunk[chunk.length - 1].index} 盤）` : `（印完請直接於大格內打勾）`;

      a4Card.innerHTML = `
        <!-- 表頭 -->
        <div class="border-b-2 border-slate-900 pb-1.5 mb-2 flex justify-between items-end shrink-0">
          <div>
            <h2 class="text-2xl font-black tracking-tight text-slate-900">3D 列印生產單 ${pageTitleSuffix}</h2>
            <div class="text-xs text-slate-500 font-bold mt-0.5">機台黏貼專用・進度核對卡</div>
          </div>
          <div class="text-right text-xs text-slate-600 font-mono leading-tight">
            <div>日期: ${currentDate}</div>
            <div>單號: #${orderId}</div>
          </div>
        </div>

        <!-- 現場填寫區 -->
        <div class="grid grid-cols-2 gap-4 mb-2 p-2 bg-slate-50 rounded-lg border border-slate-200 text-xs shrink-0">
          <div><span class="font-bold text-slate-700">耗材種類 / 顏色規格：</span><div class="mt-1.5 border-b border-dashed border-slate-400 h-4"></div></div>
          <div><span class="font-bold text-slate-700">操作人員 / 簽核：</span><div class="mt-1.5 border-b border-dashed border-slate-400 h-4"></div></div>
        </div>

        <!-- 參數顯示區 -->
        <div class="grid grid-cols-3 gap-3 mb-2 p-2.5 bg-slate-50 rounded-lg border border-slate-200 shrink-0">
          <div>
            <div class="text-xs font-bold text-slate-500 mb-0.5">列印品項</div>
            <div class="text-base font-black text-slate-900 truncate">${itemName}</div>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-500 mb-0.5">每盤容量 (個/盤)</div>
            <div class="text-base font-black text-slate-900">${perPlate}</div>
          </div>
          <div>
            <div class="text-xs font-bold text-slate-500 mb-0.5">總需求數量 (PCS)</div>
            <div class="text-base font-black text-slate-900">${totalQty}</div>
          </div>
        </div>

        <!-- 盤數摘要 -->
        <div class="flex justify-between items-center text-sm font-bold text-slate-800 mb-2 px-1 shrink-0">
          <span>生產盤數勾選表 <span class="text-slate-500 text-xs">${rangeText}</span></span>
          <span>總盤數：<span class="text-lg font-black text-blue-700">${totalPlates}</span> 盤</span>
        </div>

        <!-- 網格區 (固定 10 欄，自然向下排列) -->
        <div class="flex-1 overflow-visible">
          <div class="w-full grid grid-cols-10 gap-1 content-start grid-container"></div>
        </div>
      `;

      const gridContainer = a4Card.querySelector('.grid-container');

      // 渲染該頁的格子
      chunk.forEach(plate => {
        const gridBox = document.createElement('div');
        gridBox.className = `square-box rounded p-1 flex flex-col justify-between bg-white relative`;
        gridBox.innerHTML = `
          <div class="text-left">
            <span class="text-xs font-black text-slate-900 leading-none">#${plate.index}</span>
          </div>
          <div class="text-right mt-auto">
            <div class="text-[9px] text-slate-500 font-bold leading-none mb-0.5">總數</div>
            <div class="text-sm font-black text-slate-900 leading-none">${plate.cumulative}</div>
          </div>
        `;
        gridContainer.appendChild(gridBox);
      });

      printArea.appendChild(a4Card);
    });
  }
</script>
</body>
</html>
