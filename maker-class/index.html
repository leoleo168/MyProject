<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ArduBlock 檔案下載站</title>

<!-- 外部資源：Tailwind、圖示、字型、ZIP 打包工具 -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  /* ====== 基本樣式（顏色可在此修改）====== */
  :root{ --bg:#0f172a; --card:#1e293b; --accent:#38bdf8; }
  body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:#e2e8f0;}
  .card{background:var(--card);border:1px solid #334155;border-radius:1rem;
        transition:.25s;box-shadow:0 4px 14px rgba(0,0,0,.25);}
  .card.hov:hover{transform:translateY(-6px);border-color:var(--accent);
        box-shadow:0 12px 28px rgba(56,189,248,.18);}
  .tag{padding:.45rem 1.1rem;border-radius:999px;border:1px solid #334155;
       cursor:pointer;transition:.2s;font-size:.9rem;background:transparent;color:#cbd5e1;}
  .tag:hover{border-color:var(--accent);color:var(--accent);}
  .tag.active{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700;}
  .btn{padding:.55rem 1rem;border-radius:.6rem;font-size:.9rem;transition:.2s;cursor:pointer;}
  .btn-main{background:var(--accent);color:#0f172a;font-weight:700;}
  .btn-main:hover{background:#7dd3fc;}
  .btn-main:disabled{opacity:.5;cursor:not-allowed;}
  .btn-ghost{border:1px solid #475569;color:#e2e8f0;background:transparent;}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
  .btn-danger{border:1px solid #7f1d1d;color:#fca5a5;background:transparent;}
  .btn-danger:hover{background:#7f1d1d;color:#fff;}
  .inp{width:100%;padding:.5rem .75rem;border-radius:.5rem;background:#0f172a;border:1px solid #475569;color:#e2e8f0;}
  .inp:focus{outline:none;border-color:var(--accent);}
  .drop{border:2px dashed #475569;border-radius:.9rem;padding:1.5rem;text-align:center;cursor:pointer;transition:.2s;}
  .drop:hover,.drop.over{border-color:var(--accent);background:rgba(56,189,248,.06);}
  .fade-in{animation:fade .4s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style>
</head>

<body class="min-h-screen">

<!-- ① 導覽列 -->
<nav class="sticky top-0 z-40 backdrop-blur bg-slate-900/80 border-b border-slate-700">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
    <div class="flex items-center gap-2 font-bold text-lg">
      <i class="fa-solid fa-puzzle-piece" style="color:var(--accent)"></i>
      <span data-i18n="logo"></span>
    </div>
    <div class="flex items-center gap-2">
      <!-- 老師管理入口 -->
      <button id="adminBtn" class="btn btn-ghost">
        <i class="fa-solid fa-lock"></i> <span class="hidden sm:inline" data-i18n="teacherMode"></span>
      </button>
      <button id="langBtn" class="btn btn-ghost">
        <i class="fa-solid fa-globe"></i> <span id="langLabel">EN</span>
      </button>
    </div>
  </div>
</nav>

<!-- ② Hero 區塊 -->
<header class="max-w-6xl mx-auto px-4 pt-14 pb-8 text-center">
  <h1 class="text-3xl md:text-5xl font-bold mb-4" data-i18n="heroTitle"></h1>
  <p class="text-slate-400 max-w-2xl mx-auto mb-6" data-i18n="heroSub"></p>
  <div class="flex flex-wrap justify-center gap-4 text-sm text-slate-400">
    <span><i class="fa-solid fa-chalkboard-user" style="color:var(--accent)"></i> <span data-i18n="teacher"></span></span>
    <span><i class="fa-solid fa-envelope" style="color:var(--accent)"></i> teacher@example.com</span>
  </div>
  <div class="flex flex-wrap justify-center gap-3 mt-8">
    <button id="zipAll" class="btn btn-main text-base">
      <i class="fa-solid fa-file-zipper"></i> <span data-i18n="downloadAll"></span>
    </button>
    <button id="refresh" class="btn btn-ghost text-base">
      <i class="fa-solid fa-rotate"></i> <span data-i18n="refresh"></span>
    </button>
  </div>
</header>

<!-- 使用步驟 -->
<section class="max-w-6xl mx-auto px-4 mb-10">
  <div class="card p-5 grid md:grid-cols-3 gap-4 text-sm">
    <div><b style="color:var(--accent)">1.</b> <span data-i18n="step1"></span></div>
    <div><b style="color:var(--accent)">2.</b> <span data-i18n="step2"></span></div>
    <div><b style="color:var(--accent)">3.</b> <span data-i18n="step3"></span></div>
  </div>
</section>

<!-- ③ 搜尋 + 分類篩選 -->
<section class="max-w-6xl mx-auto px-4 mb-6">
  <input id="search" type="text"
    class="w-full md:w-96 mb-4 px-4 py-2 rounded-lg bg-slate-800 border border-slate-600 focus:outline-none focus:border-sky-400"
    data-i18n-ph="searchPh">
  <div id="tags" class="flex flex-wrap gap-2"></div>
</section>

<!-- ④ 檔案卡片區 -->
<main class="max-w-6xl mx-auto px-4 pb-16">
  <p id="status" class="text-center text-slate-400 py-10"></p>
  <div id="grid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
</main>

<!-- ★ 老師管理視窗（上傳） -->
<div id="modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
  <div class="card w-full max-w-lg p-5 max-h-[92vh] overflow-y-auto">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg"><i class="fa-solid fa-cloud-arrow-up" style="color:var(--accent)"></i> <span data-i18n="uploadTitle"></span></h3>
      <button id="mClose" class="text-2xl text-slate-400 hover:text-white">&times;</button>
    </div>

    <!-- 步驟一：金鑰設定 -->
    <div id="authBox" class="space-y-3 text-sm">
      <p class="text-slate-400" data-i18n="tokenHelp"></p>
      <div>
        <label class="block mb-1 text-slate-300" data-i18n="tokenLabel"></label>
        <input id="tokenInp" type="password" class="inp" placeholder="github_pat_xxxxxxxx" autocomplete="off">
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block mb-1 text-slate-300">GitHub</label><input id="ownerInp" class="inp"></div>
        <div><label class="block mb-1 text-slate-300">Repository</label><input id="repoInp" class="inp"></div>
      </div>
      <label class="flex items-center gap-2 text-slate-400">
        <input id="rememberChk" type="checkbox"> <span data-i18n="remember"></span>
      </label>
      <button id="saveToken" class="btn btn-main w-full" data-i18n="unlock"></button>
    </div>

    <!-- 步驟二：上傳區 -->
    <div id="upBox" class="hidden space-y-3 text-sm">
      <div>
        <label class="block mb-1 text-slate-300" data-i18n="subLabel"></label>
        <input id="subInp" class="inp" data-i18n-ph="subPh">
      </div>
      <div id="drop" class="drop">
        <i class="fa-solid fa-file-arrow-up text-3xl mb-2" style="color:var(--accent)"></i>
        <p data-i18n="dropText"></p>
        <input id="fileInp" type="file" accept=".abp" multiple class="hidden">
      </div>
      <ul id="upList" class="space-y-1 text-xs"></ul>
      <button id="doUpload" class="btn btn-main w-full" disabled>
        <i class="fa-solid fa-upload"></i> <span data-i18n="uploadBtn"></span>
      </button>
      <button id="logout" class="btn btn-ghost w-full" data-i18n="logout"></button>
    </div>
  </div>
</div>

<!-- 提示訊息 -->
<div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-sky-400 text-slate-900 font-bold px-5 py-2 rounded-full shadow-lg opacity-0 pointer-events-none transition z-[60] max-w-[90vw] text-center"></div>

<!-- ⑥ 頁尾 -->
<footer class="border-t border-slate-700 py-8 text-center text-slate-500 text-sm">
  <div class="flex justify-center gap-5 text-xl mb-3">
    <a href="#" class="hover:text-sky-400"><i class="fa-brands fa-github"></i></a>
    <a href="#" class="hover:text-sky-400"><i class="fa-brands fa-youtube"></i></a>
    <a href="#" class="hover:text-sky-400"><i class="fa-solid fa-envelope"></i></a>
  </div>
  <p data-i18n="copyright"></p>
</footer>

<script>
/* =====================================================
   ★ 基本設定
   ===================================================== */
const CONFIG = {
  folder: "files/",     // .abp 檔案存放的資料夾
  ext: ".abp",          // 要偵測的副檔名
  owner: "",            // GitHub 帳號（留空 = 自動從網址判斷）
  repo:  "",            // Repository 名稱（留空 = 自動從網址判斷）
  cacheMinutes: 5       // 清單快取時間（分鐘）
};

/* =====================================================
   ★ 雙語文字集中管理區
   ===================================================== */
const I18N = {
  zh:{
    logo:"ArduBlock 檔案下載站",
    heroTitle:"ArduBlock 課堂檔案下載",
    heroSub:"同學們請在這裡下載今天上課要用的 .abp 積木程式檔。新檔案會自動出現在下方。",
    teacher:"授課老師：王老師",
    downloadAll:"一次下載全部檔案（ZIP）",
    refresh:"重新整理清單",

    step2:"開啟 Arduino IDE → 工具 → ArduBlock。",
    step3:"在 ArduBlock 視窗按「載入」，選擇剛下載的 .abp 檔。",
    searchPh:"搜尋檔案名稱…",
    loading:"正在讀取檔案清單…",
    empty:"目前沒有符合的檔案",
    loadFail:"無法讀取檔案清單，請稍後再試或通知老師。",
    download:"下載 .abp", del:"刪除",
    downloaded:"開始下載！", zipping:"正在打包，請稍候…",
    zipFail:"部分檔案下載失敗：", zipNone:"沒有成功取得任何檔案",
    dlFail:"下載失敗，請通知老師",
    updated:"清單已更新，共 {n} 個檔案", usingCache:"網路忙碌，使用上次的清單",
    defDesc:"ArduBlock 積木程式檔",
    all:"全部", other:"其他",
    copyright:"© 2026 ArduBlock 課堂。保留所有權利。",
    /* 老師上傳相關 */
    teacherMode:"老師模式",
    uploadTitle:"老師上傳檔案",
    tokenHelp:"請貼上你的 GitHub 金鑰（Token）。金鑰只會存在這台電腦的瀏覽器，不會顯示給學生。",
    tokenLabel:"GitHub 金鑰",
    remember:"記住這台電腦（公用電腦請勿勾選）",
    unlock:"驗證並開啟上傳",
    subLabel:"放進子資料夾（選填，會變成分類）",
    subPh:"例如：基礎、感測器",
    dropText:"點擊或拖曳 .abp 檔案到這裡（可多選）",
    uploadBtn:"開始上傳", logout:"登出老師模式",
    needToken:"請先輸入金鑰", authFail:"金鑰或專案名稱錯誤，請檢查",
    authOk:"驗證成功！", onlyAbp:"只接受 .abp 檔案：",
    upOk:"上傳成功", upFail:"失敗", upWait:"上傳中…",
    upDone:"上傳完成！約 1~2 分鐘後學生即可下載",
    confirmDel:"確定要刪除這個檔案嗎？\n", delOk:"已刪除", delFail:"刪除失敗",
    loggedOut:"已登出"
  },
  en:{
    logo:"ArduBlock File Hub",
    heroTitle:"ArduBlock Class File Downloads",
    heroSub:"Download today's .abp block-program files here. New files appear automatically.",
    teacher:"Instructor: Mr. Wang",
    downloadAll:"Download All Files (ZIP)",
    refresh:"Refresh List",
    step1:"Pick a file and click “Download”.",
    step2:"Open Arduino IDE → Tools → ArduBlock.",
    step3:"Click “Load” in the ArduBlock window and choose the .abp file.",
    searchPh:"Search files…",
    loading:"Loading file list…",
    empty:"No matching files",
    loadFail:"Could not load the file list. Please try again later or tell your teacher.",
    download:"Download .abp", del:"Delete",
    downloaded:"Download started!", zipping:"Packing files…",
    zipFail:"Some files failed: ", zipNone:"No files could be fetched",
    dlFail:"Download failed. Please tell your teacher.",
    updated:"List updated: {n} files", usingCache:"Network busy, using the last saved list",
    defDesc:"ArduBlock block program file",
    all:"All", other:"Other",
    copyright:"© 2026 ArduBlock Class. All rights reserved.",
    /* Teacher upload */
    teacherMode:"Teacher",
    uploadTitle:"Teacher Upload",
    tokenHelp:"Paste your GitHub token. It is stored only in this browser and is never shown to students.",
    tokenLabel:"GitHub Token",
    remember:"Remember on this computer (not for shared PCs)",
    unlock:"Verify & Enable Upload",
    subLabel:"Subfolder (optional, becomes a category)",
    subPh:"e.g. Basics, Sensors",
    dropText:"Click or drop .abp files here (multiple allowed)",
    uploadBtn:"Start Upload", logout:"Exit Teacher Mode",
    needToken:"Please enter the token first", authFail:"Wrong token or repository. Please check.",
    authOk:"Verified!", onlyAbp:"Only .abp files are accepted: ",
    upOk:"Uploaded", upFail:"Failed", upWait:"Uploading…",
    upDone:"Done! Students can download in about 1–2 minutes.",
    confirmDel:"Delete this file?\n", delOk:"Deleted", delFail:"Delete failed",
    loggedOut:"Logged out"
  }
};

/* =====================================================
   ★ 選用：為特定檔案加上中英文標題與說明
   ===================================================== */
const META = {
  "Blink.abp": {
    zh:{t:"LED 閃爍", d:"讓 LED 每秒亮滅一次，第一個積木程式。"},
    en:{t:"Blink LED", d:"Blink an LED once per second."}
  }
};

/* ★ 選用：資料夾名稱的雙語顯示 */
const CAT_LABELS = {
  // "basic": { zh:"基礎入門", en:"Basics" }
};

/* ===== 狀態 ===== */
let lang = localStorage.getItem('lang') || 'zh';
let cat = '__all';
let FILES = [];
let pending = [];      // 等待上傳的檔案
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 金鑰管理（只存在老師自己的瀏覽器）===== */
const getToken = () => sessionStorage.getItem('gh_token') || localStorage.getItem('gh_token') || '';
const isAdmin  = () => !!getToken();

/* ===== 判斷 GitHub 帳號與專案名稱 ===== */
function getRepo(){
  let owner = localStorage.getItem('gh_owner') || CONFIG.owner;
  let repo  = localStorage.getItem('gh_repo')  || CONFIG.repo;
  if((!owner || !repo) && location.hostname.endsWith('.github.io')){
    owner = owner || location.hostname.split('.')[0];
    const seg = location.pathname.split('/').filter(Boolean)[0];
    repo = repo || ((seg && !seg.includes('.')) ? seg : owner + '.github.io');
  }
  return {owner, repo};
}

/* =====================================================
   ★ 取得檔案清單（自動偵測）
   ===================================================== */
async function fetchFromAPI(){
  const {owner, repo} = getRepo();
  if(!owner || !repo) throw new Error('no repo');
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1&t=${Date.now()}`);
  if(!res.ok) throw new Error('api ' + res.status);
  const data = await res.json();
  const prefix = CONFIG.folder;
  return data.tree
    .filter(x => x.type==='blob' && x.path.startsWith(prefix) && x.path.toLowerCase().endsWith(CONFIG.ext))
    .map(x => ({path: x.path.slice(prefix.length), size: x.size || 0}));
}
async function fetchFromJson(){
  const res = await fetch('files.json?t=' + Date.now());
  if(!res.ok) throw new Error('json ' + res.status);
  const arr = await res.json();
  return arr.map(x => typeof x==='string' ? {path:x, size:0} : {path:x.path, size:x.size||0});
}
async function loadList(force=false){
  const KEY = 'abp_list_cache';
  $('#status').textContent = I18N[lang].loading; $('#status').classList.remove('hidden');
  const cache = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(!force && cache && Date.now() - cache.time < CONFIG.cacheMinutes*60000){
    FILES = cache.list; render(); return;
  }
  try{
    let list;
    try{ list = await fetchFromAPI(); }
    catch(e){ list = await fetchFromJson(); }
    FILES = list;
    localStorage.setItem(KEY, JSON.stringify({time:Date.now(), list}));
    if(force) toast(I18N[lang].updated.replace('{n}', list.length));
  }catch(e){
    if(cache){ FILES = cache.list; toast(I18N[lang].usingCache); }
    else { FILES = []; $('#status').textContent = I18N[lang].loadFail; return; }
  }
  render();
}

/* ===== 整理成卡片資料 ===== */
function parse(f){
  const parts = f.path.split('/');
  const name = parts.pop();
  const folder = parts.length ? parts[0] : '__other';
  const base = name.slice(0, -CONFIG.ext.length);
  const m = META[f.path] || {};
  const auto = base.replace(/[_\-]+/g,' ').trim();
  return { path:f.path, name, folder, size:f.size,
    t:{zh:(m.zh&&m.zh.t)||auto, en:(m.en&&m.en.t)||auto},
    d:{zh:(m.zh&&m.zh.d)||'', en:(m.en&&m.en.d)||''} };
}
function catLabel(c){
  if(c==='__all') return I18N[lang].all;
  if(c==='__other') return I18N[lang].other;
  return (CAT_LABELS[c] && CAT_LABELS[c][lang]) || c;
}
const fmtSize = b => !b ? '' : b<1024 ? b+' B' : (b/1024).toFixed(1)+' KB';

/* ===== 語言套用 ===== */
function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  document.title = t.logo;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t[el.dataset.i18nPh]);
  $('#langLabel').textContent = lang==='zh' ? 'EN' : '中文';
  if(FILES.length) render();
}

/* ===== 畫面渲染 ===== */
function render(){
  const t = I18N[lang];
  const items = FILES.map(parse).sort((a,b)=>a.path.localeCompare(b.path,'zh-Hant',{numeric:true}));
  const cats = [...new Set(items.map(i=>i.folder))];
  if(!['__all',...cats].includes(cat)) cat='__all';
  $('#tags').innerHTML = cats.length>1
    ? ['__all',...cats].map(c=>`<button class="tag ${c===cat?'active':''}" data-c="${esc(c)}">${esc(catLabel(c))}</button>`).join('') : '';

  const q = $('#search').value.trim().toLowerCase();
  const list = items.filter(i=>(cat==='__all'||i.folder===cat) && (i.path+i.t.zh+i.t.en).toLowerCase().includes(q));
  $('#status').textContent = t.empty;
  $('#status').classList.toggle('hidden', list.length>0);

  const admin = isAdmin();
  $('#grid').innerHTML = list.map(i=>`
    <article class="card hov p-5 flex flex-col fade-in">
      <div class="flex items-center justify-between mb-3">
        <div class="w-12 h-12 rounded-xl flex items-center justify-center text-xl"
             style="background:rgba(56,189,248,.12);color:var(--accent)">
          <i class="fa-solid fa-puzzle-piece"></i>
        </div>
        ${cats.length>1 ? `<span class="px-2 py-1 rounded bg-slate-700 text-xs">${esc(catLabel(i.folder))}</span>`:''}
      </div>
      <h3 class="font-bold text-lg mb-1 break-words">${esc(i.t[lang])}</h3>
      <p class="text-slate-400 text-sm mb-2 flex-1">${esc(i.d[lang] || t.defDesc)}</p>
      <p class="text-xs text-slate-500 mb-4 break-all"><i class="fa-regular fa-file"></i> ${esc(i.name)} ${fmtSize(i.size) ? '· '+fmtSize(i.size):''}</p>
      <div class="flex gap-2">
        <button class="btn btn-main flex-1" data-dl="${esc(i.path)}"><i class="fa-solid fa-download"></i> ${t.download}</button>
        ${admin ? `<button class="btn btn-danger" title="${t.del}" data-del="${esc(i.path)}"><i class="fa-solid fa-trash"></i></button>`:''}
      </div>
    </article>`).join('');
  $('#adminBtn').innerHTML = `<i class="fa-solid ${admin?'fa-lock-open':'fa-lock'}"></i> <span class="hidden sm:inline">${t.teacherMode}</span>`;
}

/* ===== 下載工具 ===== */
const urlOf = p => CONFIG.folder + p.split('/').map(encodeURIComponent).join('/');
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function downloadOne(path){
  try{
    const res = await fetch(urlOf(path) + '?t=' + Date.now());
    if(!res.ok) throw new Error();
    saveBlob(await res.blob(), path.split('/').pop());
    toast(I18N[lang].downloaded);
  }catch(e){ toast(I18N[lang].dlFail); }
}
$('#zipAll').onclick = async ()=>{
  const t = I18N[lang];
  if(typeof JSZip==='undefined'){alert('ZIP tool failed to load.');return;}
  if(!FILES.length){ toast(t.zipNone); return; }
  toast(t.zipping);
  const zip = new JSZip(); const missing = []; let ok = 0;
  await Promise.all(FILES.map(async f=>{
    try{
      const res = await fetch(urlOf(f.path));
      if(!res.ok) throw new Error();
      zip.file(f.path, await res.blob()); ok++;
    }catch(e){ missing.push(f.path); }
  }));
  if(ok===0){ toast(t.zipNone); return; }
  saveBlob(await zip.generateAsync({type:'blob'}), 'ArduBlock_Class_Files.zip');
  if(missing.length) setTimeout(()=>toast(t.zipFail + missing.join(', ')), 2000);
};

/* =====================================================
   ★ 老師上傳功能（透過 GitHub API）
   ===================================================== */
const apiPath = p => p.split('/').map(encodeURIComponent).join('/');
function gh(method, path, body){
  const {owner, repo} = getRepo();
  return fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${apiPath(path)}`, {
    method,
    headers:{ Authorization:'Bearer '+getToken(), Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
}
// 讀檔案轉 base64
const toBase64 = file => new Promise((ok, bad)=>{
  const r = new FileReader();
  r.onload = ()=>ok(r.result.split(',')[1]);
  r.onerror = bad; r.readAsDataURL(file);
});

// 開關視窗
function openModal(){
  const r = getRepo();
  $('#ownerInp').value = r.owner || ''; $('#repoInp').value = r.repo || '';
  $('#authBox').classList.toggle('hidden', isAdmin());
  $('#upBox').classList.toggle('hidden', !isAdmin());
  $('#modal').classList.remove('hidden');
}
const closeModal = ()=>$('#modal').classList.add('hidden');

// 驗證金鑰：嘗試讀取專案資訊
$('#saveToken').onclick = async ()=>{
  const t = I18N[lang], tk = $('#tokenInp').value.trim();
  if(!tk){ toast(t.needToken); return; }
  const owner = $('#ownerInp').value.trim(), repo = $('#repoInp').value.trim();
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {headers:{Authorization:'Bearer '+tk}});
  const info = res.ok ? await res.json() : null;
  if(!info || !info.permissions || !info.permissions.push){ toast(t.authFail); return; }
  localStorage.setItem('gh_owner', owner); localStorage.setItem('gh_repo', repo);
  (($('#rememberChk').checked) ? localStorage : sessionStorage).setItem('gh_token', tk);
  $('#tokenInp').value = '';
  toast(t.authOk); openModal(); render();
};
$('#logout').onclick = ()=>{
  sessionStorage.removeItem('gh_token'); localStorage.removeItem('gh_token');
  closeModal(); render(); toast(I18N[lang].loggedOut);
};

// 選檔／拖曳
function addFiles(fl){
  const t = I18N[lang];
  [...fl].forEach(f=>{
    if(!f.name.toLowerCase().endsWith(CONFIG.ext)){ toast(t.onlyAbp + f.name); return; }
    if(!pending.some(p=>p.name===f.name)) pending.push(f);
  });
  drawPending();
}
function drawPending(){
  $('#upList').innerHTML = pending.map(f=>`
    <li class="flex justify-between bg-slate-800 rounded px-3 py-1.5" data-n="${esc(f.name)}">
      <span class="break-all">${esc(f.name)}</span><span class="st text-slate-500">${fmtSize(f.size)}</span></li>`).join('');
  $('#doUpload').disabled = pending.length===0;
}
$('#drop').onclick = ()=>$('#fileInp').click();
$('#fileInp').onchange = e=>{ addFiles(e.target.files); e.target.value=''; };
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over');}));
$('#drop').addEventListener('drop', e=>addFiles(e.dataTransfer.files));

// 開始上傳（逐一上傳，避免衝突）
$('#doUpload').onclick = async ()=>{
  const t = I18N[lang];
  const sub = $('#subInp').value.trim().replace(/^\/+|\/+$/g,'');
  $('#doUpload').disabled = true;
  for(const f of pending){
    const li = [...document.querySelectorAll('#upList li')].find(x=>x.dataset.n===f.name);
    const st = li.querySelector('.st'); st.textContent = t.upWait;
    try{
      const path = CONFIG.folder + (sub ? sub+'/' : '') + f.name;
      // 若同名檔案已存在，需帶上 sha 才能覆蓋
      let sha; const ex = await gh('GET', path);
      if(ex.ok) sha = (await ex.json()).sha;
      const res = await gh('PUT', path, { message:'upload '+f.name, content: await toBase64(f), sha });
      if(!res.ok) throw new Error(res.status);
      st.textContent = '✅ ' + t.upOk; st.className = 'st text-emerald-400';
    }catch(e){ st.textContent = '❌ ' + t.upFail; st.className = 'st text-red-400'; }
  }
  pending = [];
  toast(t.upDone);
  setTimeout(()=>loadList(true), 1500);
};

// 刪除檔案
async function deleteFile(path){
  const t = I18N[lang];
  if(!confirm(t.confirmDel + path)) return;
  try{
    const full = CONFIG.folder + path;
    const ex = await gh('GET', full);
    if(!ex.ok) throw new Error();
    const res = await gh('DELETE', full, { message:'delete '+path, sha:(await ex.json()).sha });
    if(!res.ok) throw new Error();
    toast(t.delOk); setTimeout(()=>loadList(true), 1000);
  }catch(e){ toast(t.delFail); }
}

/* ===== 提示訊息 ===== */
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.style.opacity=1;
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity=0,3000);
}

/* ===== 事件 ===== */
$('#search').oninput = render;
$('#refresh').onclick = ()=>loadList(true);
$('#langBtn').onclick = ()=>{ lang = lang==='zh'?'en':'zh'; localStorage.setItem('lang',lang); applyLang(); };
$('#tags').onclick = e=>{ const b=e.target.closest('.tag'); if(b){ cat=b.dataset.c; render(); } };
$('#grid').onclick = e=>{
  const d=e.target.closest('[data-dl]'); if(d) downloadOne(d.dataset.dl);
  const x=e.target.closest('[data-del]'); if(x) deleteFile(x.dataset.del);
};
$('#adminBtn').onclick = openModal;
$('#mClose').onclick = closeModal;
$('#modal').onclick = e=>{ if(e.target.id==='modal') closeModal(); };

/* ===== 啟動 ===== */
applyLang();
loadList();
</script>
