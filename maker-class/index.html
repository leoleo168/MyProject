/* ★ 選用：資料夾名稱的雙語顯示（沒寫就直接顯示資料夾名稱）*/
const CAT_LABELS = {
  // "SchoolA": { zh:"A國小", en:"School A" }
};

/* ===== 狀態 ===== */
let lang = localStorage.getItem('lang') || 'zh';
let path = [];         // 目前所在位置，例如 ['A國小','紅綠燈']；[] 代表首頁
let FILES = [];
let NOTES = {};
let pending = [];
let editingPath = null;
const NONE = '__none';  // 「未分類」虛擬資料夾
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ===== 金鑰管理 ===== */
const getToken = () => sessionStorage.getItem('gh_token') || localStorage.getItem('gh_token') || '';
const isAdmin  = () => !!getToken();
function getRepo(){
  return { owner: localStorage.getItem('gh_owner') || CONFIG.owner,
           repo:  localStorage.getItem('gh_repo')  || CONFIG.repo };
}

/* ===== 依副檔名挑選圖示 ===== */
function iconOf(name){
  const e = (name.split('.').pop() || '').toLowerCase();
  const map = {
    pdf:'fa-file-pdf', doc:'fa-file-word', docx:'fa-file-word',
    xls:'fa-file-excel', xlsx:'fa-file-excel', csv:'fa-file-csv',
    ppt:'fa-file-powerpoint', pptx:'fa-file-powerpoint',
    zip:'fa-file-zipper', rar:'fa-file-zipper', '7z':'fa-file-zipper',
    png:'fa-file-image', jpg:'fa-file-image', jpeg:'fa-file-image', gif:'fa-file-image', svg:'fa-file-image',
    mp4:'fa-file-video', mov:'fa-file-video', mp3:'fa-file-audio', wav:'fa-file-audio',
    txt:'fa-file-lines', md:'fa-file-lines',
    ino:'fa-file-code', py:'fa-file-code', js:'fa-file-code', html:'fa-file-code', cpp:'fa-file-code',
    abp:'fa-puzzle-piece'
  };
  return map[e] || 'fa-file';
}

/* =====================================================
   ★ 讀取檔案清單與註解
   ===================================================== */
const isHidden = name => CONFIG.hiddenFiles.includes(name.split('/').pop().toLowerCase());

async function fetchFromAPI(){
  const {owner, repo} = getRepo();
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/HEAD?recursive=1&t=${Date.now()}`);
  if(!res.ok) throw new Error('api ' + res.status);
  const data = await res.json();
  const prefix = CONFIG.basePath + CONFIG.folder;
  return data.tree
    .filter(x => x.type==='blob' && x.path.startsWith(prefix) && !isHidden(x.path))
    .map(x => ({path: x.path.slice(prefix.length), size: x.size || 0}));
}
async function fetchFromJson(){
  const res = await fetch('files.json?t=' + Date.now());
  if(!res.ok) throw new Error('json ' + res.status);
  const arr = await res.json();
  return arr.map(x => typeof x==='string' ? {path:x, size:0} : {path:x.path, size:x.size||0});
}
async function loadNotes(){
  try{
    if(isAdmin()){
      const r = await gh('GET', CONFIG.basePath + CONFIG.folder + CONFIG.notesFile);
      if(r.ok){ NOTES = JSON.parse(decodeB64((await r.json()).content)); return; }
    }
    const res = await fetch(CONFIG.folder + CONFIG.notesFile + '?t=' + Date.now());
    NOTES = res.ok ? await res.json() : {};
  }catch(e){ NOTES = NOTES || {}; }
}
async function loadList(force=false){
  const KEY = 'file_list_cache';
  $('#status').textContent = I18N[lang].loading; $('#status').classList.remove('hidden');
  await loadNotes();
  const cache = JSON.parse(localStorage.getItem(KEY) || 'null');
  if(!force && cache && Date.now() - cache.time < CONFIG.cacheMinutes*60000){
    FILES = cache.list; render(); return;
  }
  try{
    let list;
    try{ list = await fetchFromAPI(); }
    catch(e){ list = await fetchFromJson(); }
    FILES = list;
    localStorage.setItem(KEY, JSON.stringify({time:Date.now(), list}));
    if(force) toast(I18N[lang].updated.replace('{n}', list.length));
  }catch(e){
    if(cache){ FILES = cache.list; toast(I18N[lang].usingCache); }
    else { FILES = []; $('#status').textContent = I18N[lang].loadFail; return; }
  }
  render();
}

/* ===== 整理成卡片資料 ===== */
function parse(f){
  const parts = f.path.split('/');
  const name = parts.pop();
  const base = name.replace(/\.[^.]+$/, '');   // 去掉副檔名當標題
  return { path:f.path, name, size:f.size, folderParts:parts,
    title: base.replace(/[_\-]+/g,' ').trim() || name,
    note: NOTES[f.path] || '' };
}
function label(c){
  if(c===NONE) return I18N[lang].unsorted;
  return (CAT_LABELS[c] && CAT_LABELS[c][lang]) || c;
}
const fmtSize = b => !b ? '' : b<1024 ? b+' B' : b<1048576 ? (b/1024).toFixed(1)+' KB' : (b/1048576).toFixed(1)+' MB';

/* ===== 檔案總管邏輯 ===== */
function inPath(i){
  if(path.length===0) return true;
  if(path[0]===NONE) return i.folderParts.length===0;
  return path.every((p,k)=>i.folderParts[k]===p);
}
function currentView(items){
  const here = items.filter(inPath);
  const folders = new Map();
  const files = [];
  if(path[0]===NONE){ here.forEach(i=>files.push(i)); return {folders:[], files}; }
  const depth = path.length;
  here.forEach(i=>{
    if(i.folderParts.length===depth){ files.push(i); }
    else{
      const key = [...path, i.folderParts[depth]].join('/');
      folders.set(key, (folders.get(key)||0)+1);
    }
  });
  // 首頁：把根目錄的散落檔案收進「未分類」虛擬資料夾
  if(depth===0 && files.length){ folders.set(NONE, files.length); files.length=0; }
  const arr = [...folders.entries()].map(([k,n])=>({key:k, name:k===NONE?NONE:k.split('/').pop(), count:n}))
    .sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant',{numeric:true}));
  return {folders:arr, files};
}
function goTo(p){ path = p; $('#search').value=''; render(); window.scrollTo({top:0,behavior:'smooth'}); }

/* ===== 語言套用 ===== */
function applyLang(){
  const t = I18N[lang];
  document.documentElement.lang = lang==='zh' ? 'zh-Hant' : 'en';
  document.title = t.logo;
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t[el.dataset.i18n]);
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t[el.dataset.i18nPh]);
  $('#langLabel').textContent = lang==='zh' ? 'EN' : '中文';
  render(); drawPending();
}
function updateAdminBtn(){
  $('#adminBtn').innerHTML = `<i class="fa-solid ${isAdmin()?'fa-lock-open':'fa-lock'}"></i> <span class="hidden sm:inline">${I18N[lang].teacherMode}</span>`;
}

/* ===== 畫面渲染 ===== */
function fileCard(i, showPlace){
  const t = I18N[lang], admin = isAdmin();
  const place = i.folderParts.length ? i.folderParts.map(p=>esc(label(p))).join(' <span class="text-slate-600">/</span> ') : esc(t.unsorted);
  return `
  <article class="card hov p-5 flex flex-col fade-in">
    <div class="flex items-center gap-3 mb-3">
      <div class="w-12 h-12 shrink-0 rounded-xl flex items-center justify-center text-xl"
           style="background:rgba(56,189,248,.12);color:var(--accent)">
        <i class="fa-solid ${iconOf(i.name)}"></i>
      </div>
      ${showPlace ? `<span class="px-2.5 py-1 rounded-lg bg-slate-700 text-xs text-sky-300 break-words"><i class="fa-solid fa-folder"></i> ${place}</span>`:''}
    </div>
    <h3 class="font-bold text-lg mb-1 break-words">${esc(i.title)}</h3>
    <p class="text-sm mb-2 flex-1 whitespace-pre-line break-words ${i.note?'text-slate-300':'text-slate-500'}">${esc(i.note || t.defDesc)}</p>
    <p class="text-xs text-slate-500 mb-4 break-all"><i class="fa-regular fa-file"></i> ${esc(i.name)} ${fmtSize(i.size) ? '· '+fmtSize(i.size):''}</p>
    <div class="flex gap-2">
      <button class="btn btn-main flex-1" data-dl="${esc(i.path)}"><i class="fa-solid fa-download"></i> ${t.download}</button>
      ${admin ? `<button class="btn btn-ghost" title="${t.edit}" data-edit="${esc(i.path)}"><i class="fa-solid fa-pen"></i></button>
                 <button class="btn btn-danger" title="${t.del}" data-del="${esc(i.path)}"><i class="fa-solid fa-trash"></i></button>`:''}
    </div>
  </article>`;
}

function render(){
  const t = I18N[lang];
  const items = FILES.map(parse).sort((a,b)=>a.path.localeCompare(b.path,'zh-Hant',{numeric:true}));
  const q = $('#search').value.trim().toLowerCase();
  const searching = q.length>0;

  // 若目前資料夾已不存在（例如檔案被刪光），退回上一層
  while(path.length && !items.some(inPath)) path = path.slice(0,-1);

  // 路徑列
  if(searching){
    $('#crumb').innerHTML = `<span class="text-slate-300"><i class="fa-solid fa-magnifying-glass" style="color:var(--accent)"></i> ${esc(t.searchResult.replace('{n}', items.filter(i=>(i.path+i.title+i.note).toLowerCase().includes(q)).length))}</span>`;
    $('#backBtn').classList.add('hidden');
  }else{
    const segs = [`<span class="crumb-link ${path.length?'':'font-bold text-white'}" data-p=""><i class="fa-solid fa-house"></i> ${esc(t.home)}</span>`];
    path.forEach((p,k)=>{
      const isLast = k===path.length-1;
      segs.push(`<i class="fa-solid fa-chevron-right text-xs text-slate-600"></i>`);
      segs.push(`<span class="crumb-link ${isLast?'font-bold text-white':''}" data-p="${esc(path.slice(0,k+1).join('/'))}">${esc(label(p))}</span>`);
    });
    $('#crumb').innerHTML = segs.join('');
    $('#backBtn').classList.toggle('hidden', path.length===0);
  }
  $('#zipLabel').textContent = path.length ? t.zipHere : t.zipRoot;

  let folders = [], files = [];
  if(searching){
    files = items.filter(i=>(i.path+i.title+i.note).toLowerCase().includes(q));
  }else{
    const v = currentView(items); folders = v.folders; files = v.files;
  }

  // 資料夾卡片
  $('#folders').innerHTML = folders.map(f=>`
    <article class="card hov folder p-5 flex items-center gap-4 fade-in" data-go="${esc(f.key)}">
      <div class="w-14 h-14 shrink-0 rounded-xl flex items-center justify-center text-3xl text-amber-300" style="background:rgba(251,191,36,.12)">
        <i class="fa-solid fa-folder"></i>
      </div>
      <div class="min-w-0 flex-1">
        <h3 class="font-bold text-lg break-words">${esc(label(f.name))}</h3>
        <p class="text-xs text-slate-400">${esc(t.filesCount.replace('{n}', f.count))}</p>
      </div>
      <i class="fa-solid fa-chevron-right text-slate-500"></i>
    </article>`).join('');

  // 檔案卡片（搜尋時顯示所在資料夾）
  $('#grid').innerHTML = files.map(i=>fileCard(i, searching)).join('');

  const nothing = folders.length===0 && files.length===0;
  $('#status').textContent = searching ? t.emptySearch : t.empty;
  $('#status').classList.toggle('hidden', !nothing);
  updateAdminBtn();
}

/* ===== 下載工具 ===== */
const urlOf = p => CONFIG.folder + p.split('/').map(encodeURIComponent).join('/');
function saveBlob(blob, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function downloadOne(p){
  try{
    const res = await fetch(urlOf(p) + '?t=' + Date.now());
    if(!res.ok) throw new Error();
    saveBlob(await res.blob(), p.split('/').pop());
    toast(I18N[lang].downloaded);
  }catch(e){ toast(I18N[lang].dlFail); }
}
// 一次下載：打包「目前所在資料夾（含子資料夾）」的所有檔案
$('#zipAll').onclick = async ()=>{
  const t = I18N[lang];
  if(typeof JSZip==='undefined'){alert('ZIP tool failed to load.');return;}
  const targets = FILES.map(parse).filter(inPath);
  if(!targets.length){ toast(t.zipNone); return; }
  toast(t.zipping);
  const zip = new JSZip(); const missing = []; let ok = 0;
  await Promise.all(targets.map(async f=>{
    try{
      const res = await fetch(urlOf(f.path));
      if(!res.ok) throw new Error();
      zip.file(f.path, await res.blob()); ok++;
    }catch(e){ missing.push(f.path); }
  }));
  if(ok===0){ toast(t.zipNone); return; }
  const zname = path.length && path[0]!==NONE ? path.join('_') : 'Class_Files';
  saveBlob(await zip.generateAsync({type:'blob'}), zname + '.zip');
  if(missing.length) setTimeout(()=>toast(t.zipFail + missing.join(', ')), 2000);
};

/* =====================================================
   ★ GitHub API 工具
   ===================================================== */
const apiPath = p => p.split('/').map(encodeURIComponent).join('/');
function gh(method, p, body){
  const {owner, repo} = getRepo();
  return fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${apiPath(p)}${method==='GET'?'?t='+Date.now():''}`, {
    method,
    headers:{ Authorization:'Bearer '+getToken(), Accept:'application/vnd.github+json', 'Content-Type':'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
}
const toBase64 = file => new Promise((ok, bad)=>{
  const r = new FileReader();
  r.onload = ()=>ok(r.result.split(',')[1]);
  r.onerror = bad; r.readAsDataURL(file);
});
function encodeB64(str){ let s=''; new TextEncoder().encode(str).forEach(b=>s+=String.fromCharCode(b)); return btoa(s); }
function decodeB64(b64){ return new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\n/g,'')), c=>c.charCodeAt(0))); }

/* ===== 儲存註解到 notes.json（先讀最新版再合併）===== */
async function saveNotes(updates, removals=[]){
  const p = CONFIG.basePath + CONFIG.folder + CONFIG.notesFile;
  let current = {}, sha;
  const r = await gh('GET', p);
  if(r.ok){ const j = await r.json(); sha = j.sha; try{ current = JSON.parse(decodeB64(j.content)); }catch(e){} }
  Object.entries(updates).forEach(([k,v])=>{ if(v) current[k]=v; else delete current[k]; });
  removals.forEach(k=>delete current[k]);
  const res = await gh('PUT', p, { message:'update notes', content: encodeB64(JSON.stringify(current,null,2)), sha });
  if(!res.ok) throw new Error(res.status);
  NOTES = current;
}

/* ===== 老師視窗 ===== */
function updateWorkList(){
  const school = $('#schoolInp').value.trim();
  const works = new Set();
  FILES.map(parse).forEach(i=>{ if(i.folderParts[0]===school && i.folderParts[1]) works.add(i.folderParts[1]); });
  $('#workList').innerHTML = [...works].map(w=>`<option value="${esc(w)}">`).join('');
}
function openModal(){
  const r = getRepo();
  $('#ownerInp').value = r.owner || ''; $('#repoInp').value = r.repo || '';
  $('#authBox').classList.toggle('hidden', isAdmin());
  $('#upBox').classList.toggle('hidden', !isAdmin());
  // 自動帶入目前所在的資料夾
  const inReal = path.length && path[0]!==NONE;
  $('#schoolInp').value = inReal ? (path[0]||'') : '';
  $('#workInp').value   = inReal ? (path[1]||'') : '';
  const schools = [...new Set(FILES.map(parse).map(i=>i.folderParts[0]).filter(Boolean))];
  $('#schoolList').innerHTML = schools.map(s=>`<option value="${esc(s)}">`).join('');
  updateWorkList();
  $('#modal').classList.remove('hidden');
}
const closeModal = ()=>$('#modal').classList.add('hidden');
$('#schoolInp').addEventListener('input', updateWorkList);

$('#saveToken').onclick = async ()=>{
  const t = I18N[lang], tk = $('#tokenInp').value.trim();
  if(!tk){ toast(t.needToken); return; }
  const owner = $('#ownerInp').value.trim(), repo = $('#repoInp').value.trim();
  const res = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {headers:{Authorization:'Bearer '+tk}});
  const info = res.ok ? await res.json() : null;
  if(!info || !info.permissions || !info.permissions.push){ toast(t.authFail); return; }
  localStorage.setItem('gh_owner', owner); localStorage.setItem('gh_repo', repo);
  (($('#rememberChk').checked) ? localStorage : sessionStorage).setItem('gh_token', tk);
  $('#tokenInp').value = '';
  toast(t.authOk); openModal(); loadList(true);
};
$('#logout').onclick = ()=>{
  sessionStorage.removeItem('gh_token'); localStorage.removeItem('gh_token');
  closeModal(); render(); toast(I18N[lang].loggedOut);
};

/* ===== 選檔／拖曳（每個檔案都有註解欄，不限檔案類型）===== */
function addFiles(fl){
  const t = I18N[lang];
  [...fl].forEach(f=>{
    if(f.size > 50*1024*1024){ toast(t.tooBig + f.name); return; }
    if(!pending.some(p=>p.name===f.name)){ f.note = ''; pending.push(f); }
  });
  drawPending();
}
function drawPending(){
  $('#upList').innerHTML = pending.map((f,idx)=>`
    <li class="bg-slate-800 rounded-lg p-2" data-n="${esc(f.name)}">
      <div class="flex justify-between mb-1"><span class="break-all">${esc(f.name)}</span><span class="st text-slate-500">${fmtSize(f.size)}</span></div>
      <input class="inp note-inp" data-i="${idx}" value="${esc(f.note||'')}" placeholder="${esc(I18N[lang].notePh)}">
    </li>`).join('');
  $('#doUpload').disabled = pending.length===0;
}
$('#upList').addEventListener('input', e=>{
  const el = e.target.closest('.note-inp'); if(el) pending[el.dataset.i].note = el.value;
});
$('#drop').onclick = ()=>$('#fileInp').click();
$('#fileInp').onchange = e=>{ addFiles(e.target.files); e.target.value=''; };
['dragover','dragenter'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#drop').addEventListener(ev,e=>{e.preventDefault();$('#drop').classList.remove('over');}));
$('#drop').addEventListener('drop', e=>addFiles(e.dataTransfer.files));

/* ===== 開始上傳 ===== */
$('#doUpload').onclick = async ()=>{
  const t = I18N[lang];
  const clean = s => s.trim().replace(/^\/+|\/+$/g,'');
  const folder = [clean($('#schoolInp').value), clean($('#workInp').value)].filter(Boolean).join('/');
  $('#doUpload').disabled = true;
  const newNotes = {};
  for(const f of pending){
    const li = [...document.querySelectorAll('#upList li')].find(x=>x.dataset.n===f.name);
    const st = li.querySelector('.st'); st.textContent = t.upWait;
    try{
      const rel  = (folder ? folder+'/' : '') + f.name;
      const full = CONFIG.basePath + CONFIG.folder + rel;
      let sha; const ex = await gh('GET', full);
      if(ex.ok) sha = (await ex.json()).sha;
      const res = await gh('PUT', full, { message:'upload '+f.name, content: await toBase64(f), sha });
      if(!res.ok) throw new Error(res.status);
      if(f.note && f.note.trim()) newNotes[rel] = f.note.trim();
      st.textContent = '✅ ' + t.upOk; st.className = 'st text-emerald-400';
    }catch(e){ st.textContent = '❌ ' + t.upFail; st.className = 'st text-red-400'; }
  }
  if(Object.keys(newNotes).length){ try{ await saveNotes(newNotes); }catch(e){ toast(t.noteFail); } }
  pending = [];
  toast(t.upDone);
  setTimeout(()=>{ loadList(true); drawPending(); }, 1500);
};

/* ===== 編輯註解 ===== */
function openNote(p){
  editingPath = p;
  $('#noteFile').textContent = p;
  $('#noteInp').value = NOTES[p] || '';
  $('#noteModal').classList.remove('hidden');
}
const closeNote = ()=>$('#noteModal').classList.add('hidden');
$('#noteCancel').onclick = closeNote;
$('#noteModal').onclick = e=>{ if(e.target.id==='noteModal') closeNote(); };
$('#noteSave').onclick = async ()=>{
  const t = I18N[lang];
  try{
    await saveNotes({[editingPath]: $('#noteInp').value.trim()});
    closeNote(); render(); toast(t.noteSaved);
  }catch(e){ toast(t.noteFail); }
};

/* ===== 刪除檔案（同時移除註解）===== */
async function deleteFile(p){
  const t = I18N[lang];
  if(!confirm(t.confirmDel + p)) return;
  try{
    const full = CONFIG.basePath + CONFIG.folder + p;
    const ex = await gh('GET', full);
    if(!ex.ok) throw new Error();
    const res = await gh('DELETE', full, { message:'delete '+p, sha:(await ex.json()).sha });
    if(!res.ok) throw new Error();
    if(NOTES[p]){ try{ await saveNotes({}, [p]); }catch(e){} }
    toast(t.delOk); setTimeout(()=>loadList(true), 1000);
  }catch(e){ toast(t.delFail); }
}

/* ===== 提示訊息 ===== */
function toast(msg){
  const el=$('#toast'); el.textContent=msg; el.style.opacity=1;
  clearTimeout(el._t); el._t=setTimeout(()=>el.style.opacity=0,3000);
}

/* ===== 事件 ===== */
$('#search').oninput = render;
$('#refresh').onclick = ()=>loadList(true);
$('#langBtn').onclick = ()=>{ lang = lang==='zh'?'en':'zh'; localStorage.setItem('lang',lang); applyLang(); };
$('#folders').onclick = e=>{
  const f = e.target.closest('[data-go]'); if(f) goTo(f.dataset.go.split('/'));
};
$('#crumb').onclick = e=>{
  const c = e.target.closest('[data-p]'); if(c) goTo(c.dataset.p ? c.dataset.p.split('/') : []);
};
$('#backBtn').onclick = ()=>goTo(path.slice(0,-1));
$('#grid').onclick = e=>{
  const d=e.target.closest('[data-dl]'); if(d) downloadOne(d.dataset.dl);
  const x=e.target.closest('[data-del]'); if(x) deleteFile(x.dataset.del);
  const p=e.target.closest('[data-edit]'); if(p) openNote(p.dataset.edit);
};
$('#adminBtn').onclick = openModal;
$('#mClose').onclick = closeModal;
$('#modal').onclick = e=>{ if(e.target.id==='modal') closeModal(); };

/* ===== 啟動 ===== */
applyLang();
loadList();
</script>
