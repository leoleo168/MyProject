<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2b3a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="垃圾分類員">
<title>垃圾分類員</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;overflow:hidden}
#cv{position:fixed;inset:0}
#cv canvas{display:block;width:100%;height:100%}
#touch{position:fixed;inset:0;z-index:1}
.hud{position:fixed;z-index:2;pointer-events:none}
#top{left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pill{background:rgba(20,28,38,.72);border-radius:16px;padding:8px 16px;backdrop-filter:blur(4px)}
.money{font-size:32px;font-weight:800;color:#ffd766;line-height:1.1}
.sub{font-size:15px;opacity:.9;margin-top:2px}
.btns{display:flex;gap:8px;pointer-events:auto;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
.icbtn{background:rgba(51,70,90,.92);border:0;color:#fff;min-width:52px;height:52px;padding:0 14px;border-radius:14px;font-size:19px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.35);cursor:pointer}
.icbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.icbtn.off{opacity:.6}
@media (max-width:600px){.icbtn{min-width:46px;height:46px;font-size:17px;padding:0 10px}.btns{gap:6px}.money{font-size:28px}}
#goal{top:calc(env(safe-area-inset-top) + 102px);left:14px;width:250px;font-size:15px;font-weight:700}
#bar{height:9px;background:rgba(0,0,0,.45);border-radius:6px;margin-top:5px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd766,#ff9f5a)}
#state{top:calc(env(safe-area-inset-top) + 170px);left:14px;font-size:16px;font-weight:800;max-width:300px}
#state.stop{border-left:6px solid #5fcf80}
#state.go{border-left:6px solid #ff9f5a}
#install{display:none;position:fixed;z-index:3;right:14px;top:calc(env(safe-area-inset-top) + 120px);padding:12px 20px;border-radius:16px;background:linear-gradient(135deg,#5fcf80,#3aa668);color:#fff;font-weight:700;border:0;font-size:17px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#iosHint{display:none;top:calc(env(safe-area-inset-top) + 220px);left:14px;right:14px;font-size:15px;text-align:center}
#cross{left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.9;transition:transform .1s}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;mix-blend-mode:difference}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#cross.on{transform:translate(-50%,-50%) scale(1.5) rotate(45deg)}
#target{left:0;right:0;top:57%;text-align:center;font-size:21px;font-weight:800}
#target span{display:inline-block;background:rgba(20,28,38,.82);padding:8px 18px;border-radius:14px}
#target span:empty{display:none}
#toast{left:50%;top:20%;transform:translate(-50%,0);width:90%;max-width:520px;text-align:center;font-size:19px;line-height:1.55;background:rgba(20,28,38,.92);border-radius:18px;padding:14px 18px;opacity:0;transition:opacity .25s}
#toast small{font-size:16px;opacity:.9}
#toast.show{opacity:1}

/* 右手(只放手臂與垃圾疊) */
#hand{right:3%;bottom:0;width:clamp(190px,24vw,340px);display:flex;flex-direction:column;align-items:center;transition:transform .12s}
#stack{display:flex;flex-direction:column-reverse;align-items:center;pointer-events:auto;margin-bottom:-40px;position:relative;z-index:1;min-height:30px}
.hi{line-height:1;margin-top:-30px;filter:drop-shadow(0 4px 3px rgba(0,0,0,.5));font-size:clamp(46px,6vw,70px)}
.hi.cur{font-size:clamp(84px,11vw,130px);margin-top:0;filter:drop-shadow(0 0 12px #ffd766) drop-shadow(0 4px 3px rgba(0,0,0,.5))}
.hi.bump{animation:bump .25s}
@keyframes bump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#arm{width:clamp(120px,15vw,200px);height:clamp(150px,22vw,280px);border-radius:50px 50px 0 0;background:linear-gradient(#f0c39a 0 40%,#3f9d5e 40%);transform:rotate(-10deg);box-shadow:inset -14px 0 0 rgba(0,0,0,.14);position:relative}
#arm:before{content:"";position:absolute;left:0;right:0;top:40%;height:9px;background:#2d7a47}

/* ★ 底部資訊列:名稱 + 數量,固定在最下方,蓋在手臂上、不會被垃圾擋住 */
#handInfo{right:3%;bottom:calc(env(safe-area-inset-bottom) + 10px);width:clamp(190px,24vw,340px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:4}
#curLbl{font-size:21px;font-weight:800;background:rgba(20,28,38,.92);padding:7px 16px;border-radius:14px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;border:2px solid rgba(255,215,102,.7);box-shadow:0 3px 8px rgba(0,0,0,.4)}
#curLbl:empty{display:none}
#cnt{font-size:17px;font-weight:800;background:rgba(20,28,38,.85);padding:3px 14px;border-radius:12px}

#acts{right:calc(clamp(190px,24vw,340px) + 24px);bottom:calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:row;gap:12px;align-items:center;pointer-events:auto}
.abtn{width:84px;height:84px;border-radius:50%;border:0;color:#3a2a00;font-size:15px;font-weight:800;box-shadow:0 6px 0 rgba(0,0,0,.35);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.abtn b{font-size:32px}
.abtn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
#pickBtn{background:#7fd6ff;box-shadow:0 6px 0 #3a8fb8}
#actBtn{background:#ffd766;box-shadow:0 6px 0 #c9a23a}
.abtn.dim{background:#8a8f95!important;box-shadow:0 6px 0 #5f646a!important;color:#333}
#joy{display:none;width:110px;height:110px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);z-index:2}
#knob{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.55)}
#keys{display:none;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);font-size:15px;line-height:1.9;opacity:.95}
@media (pointer:fine){#keys{display:block}#acts{display:none}}
#keys kbd{background:rgba(255,255,255,.22);border-radius:6px;padding:2px 8px;font-family:inherit;font-weight:700}

#sheet{position:fixed;left:0;right:0;bottom:0;height:82%;background:#25323f;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .3s ease-out;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);z-index:6;touch-action:pan-y;max-width:900px;margin:0 auto}
#sheet *{touch-action:pan-y}
#sheet.open{transform:none}
#sheet h3{margin:0;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;font-size:20px}
.tabs{display:flex;gap:8px}
.tab{border:0;border-radius:12px;padding:12px 20px;background:#33465a;color:#fff;font-weight:800;font-size:19px;cursor:pointer}
.tab.on{background:#ffd766;color:#3a2a00}
#list{overflow-y:auto;padding:0 16px 20px;flex:1;-webkit-overflow-scrolling:touch}
.it{display:flex;align-items:center;gap:14px;background:#2f4052;border-radius:16px;padding:14px;margin-bottom:12px}
.it .ic{font-size:42px;width:56px;text-align:center}
.it .tx{flex:1;min-width:0}
.it b{font-size:20px}.it small{display:block;font-size:16px;opacity:.85;margin-top:4px;line-height:1.5}
.tag{display:inline-block;font-size:14px;padding:2px 10px;border-radius:10px;margin-left:8px;color:#fff;font-weight:700}
.buy{border:0;border-radius:14px;padding:14px 16px;min-width:110px;font-weight:800;font-size:19px;background:#5fcf80;color:#06260f;box-shadow:0 4px 0 #3a9a58;cursor:pointer}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #3a9a58}
.buy:disabled{background:#4a5966;color:#99a;box-shadow:0 4px 0 #38444f;cursor:default}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:9}
#modal>div{background:#2f4052;border-radius:22px;padding:28px;text-align:center;width:86%;max-width:380px;font-size:18px}
#modal h3{font-size:24px}
#modal button{margin-top:16px;border:0;border-radius:14px;padding:14px 32px;background:#ffd766;font-weight:800;font-size:20px;cursor:pointer}
#loading{position:fixed;inset:0;z-index:20;background:#1c2630;display:flex;align-items:center;justify-content:center;font-size:20px;text-align:center;padding:30px}
</style>
</head>
<body>
<div id="cv"></div>
<div id="touch"></div>
<div id="joy" class="hud"><div id="knob"></div></div>

<div id="top" class="hud">
  <div class="pill"><div class="money" id="money">$0</div><div class="sub" id="rate"></div></div>
  <div class="btns">
    <button class="icbtn" id="modeBtn">💡簡易</button>
    <button class="icbtn" id="bobBtn">🌀關</button>
    <button class="icbtn" id="mute">🔊</button>
    <button class="icbtn" id="shopBtn">🛒</button>
  </div>
</div>
<div id="goal" class="hud pill"><span id="goalTx"></span><div id="bar"><i id="barI"></i></div></div>
<div id="state" class="hud pill stop"></div>
<div id="cross" class="hud"></div>
<div id="target" class="hud"><span id="tgTx"></span></div>
<div id="toast" class="hud"></div>
<button id="install">📲 安裝為手機 App</button>
<div id="iosHint" class="hud pill">iPhone:點下方「分享」→「加入主畫面」即可安裝 📲</div>

<div id="keys" class="hud pill">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動 ・ <kbd>Shift</kbd> 跑步<br>
  滑鼠 自由轉頭(點畫面鎖定) ・ <kbd>Esc</kbd> 釋放<br>
  <kbd>左鍵</kbd> 對準垃圾 = 撿起<br>
  <kbd>左鍵</kbd> 面對垃圾桶 = 丟入(也可按 <kbd>空白</kbd>)<br>
  <kbd>滾輪</kbd> / <kbd>Q</kbd> 切換要丟的垃圾<br>
  <kbd>M</kbd> 模式 ・ <kbd>B</kbd> 商店 ・ <kbd>G</kbd> 圖鑑
</div>

<div id="hand" class="hud">
  <div id="stack"></div>
  <div id="arm"></div>
</div>
<div id="handInfo" class="hud">
  <div id="curLbl"></div>
  <div id="cnt"></div>
</div>

<div id="acts" class="hud">
  <button class="abtn" id="pickBtn"><b>✋</b>撿起</button>
  <button class="abtn" id="actBtn"><b>🗑️</b>丟入</button>
</div>

<div id="sheet">
  <h3><div class="tabs"><button class="tab on" id="tShop">🛠️ 升級</button><button class="tab" id="tDex">📖 圖鑑</button></div><button class="icbtn" id="closeShop">✕</button></h3>
  <div id="list"></div>
</div>
<div id="modal"><div><div style="font-size:52px">🌙</div><h3 style="margin:6px 0">歡迎回來!</h3><p id="offTx"></p><button id="offOk">收下</button></div></div>
<div id="loading">⏳ 載入 3D 場景中…<br>(第一次需要連網)</div>

<script type="module">
const $=id=>document.getElementById(id);

/* ========== PWA ========== */
(function(){
  const svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='#2b3a4a'/><rect x='8' y='26' width='36' height='20' rx='3' fill='#3f9d5e'/><rect x='46' y='30' width='12' height='16' rx='3' fill='#e0b030'/><circle cx='18' cy='48' r='6' fill='#222'/><circle cx='48' cy='48' r='6' fill='#222'/><rect x='14' y='16' width='8' height='10' fill='#3f7fc4'/><rect x='26' y='16' width='8' height='10' fill='#e08a2e'/></svg>";
  const iconUrl="data:image/svg+xml,"+encodeURIComponent(svg);
  const m={name:"垃圾分類員",short_name:"垃圾分類",display:"standalone",background_color:"#2b3a4a",theme_color:"#2b3a4a",start_url:location.href.split('#')[0],icons:[{src:iconUrl,sizes:"any",type:"image/svg+xml",purpose:"any"}]};
  const l=document.createElement('link');l.rel='manifest';
  l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));document.head.appendChild(l);
  const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');
  x.fillStyle='#2b3a4a';x.fillRect(0,0,180,180);
  x.fillStyle='#3f9d5e';x.fillRect(20,80,100,56);x.fillStyle='#e0b030';x.fillRect(126,90,36,46);
  x.fillStyle='#222';x.beginPath();x.arc(50,142,16,0,7);x.arc(136,142,16,0,7);x.fill();
  x.fillStyle='#3f7fc4';x.fillRect(34,40,22,40);x.fillStyle='#e08a2e';x.fillRect(66,40,22,40);
  const a=document.createElement('link');a.rel='apple-touch-icon';a.href=c.toDataURL();document.head.appendChild(a);
  try{
    const code=`const C='sorter3d-v8';
self.addEventListener('install',e=>self.skipWaiting());
self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));

e.respondWith(fetch(e.request).then(r=>{const cp=r.clone();caches.open(C).then(c=>c.put(e.request,cp));return r}).catch(()=>caches.match(e.request)))});`;
    if('serviceWorker' in navigator)navigator.serviceWorker.register(URL.createObjectURL(new Blob([code],{type:'text/javascript'}))).catch(()=>{});
  }catch(e){}
})();
let dp=null;const ib=$('install');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;ib.style.display='block'});
ib.onclick=async()=>{if(!dp)return;dp.prompt();await dp.userChoice;dp=null;ib.style.display='none'};
addEventListener('appinstalled',()=>ib.style.display='none');
if(/iphone|ipad|ipod/i.test(navigator.userAgent)&&!(matchMedia('(display-mode: standalone)').matches||navigator.standalone))$('iosHint').style.display='block';

/* ========== 載入 Three.js ========== */
let THREE;
try{THREE=await import('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js')}
catch(e){$('loading').innerHTML='❌ 無法載入 3D 引擎<br>請確認網路連線後重新整理';throw e}
$('loading').style.display='none';

/* ========== 資料:台灣垃圾分類 ========== */
const BIN=[
 {n:'資源回收',e:'♻️',c:'#3f7fc4',v:5},
 {n:'廚餘',e:'🍎',c:'#e08a2e',v:3},
 {n:'一般垃圾',e:'🗑️',c:'#6b7280',v:2},
 {n:'特殊回收',e:'🔋',c:'#c94a4a',v:8},
];
const ITEMS=[
 {e:'🥤',n:'寶特瓶',b:0,t:'寶特瓶倒空、沖洗、壓扁後回收,瓶蓋也可以一起回收。'},
 {e:'🥫',n:'鐵鋁罐',b:0,t:'金屬罐(鐵罐、鋁罐)倒空洗淨後屬於資源回收。'},
 {e:'🍾',n:'玻璃瓶',b:0,t:'完整的玻璃瓶罐洗淨後可回收;破掉的玻璃要包好丟一般垃圾。'},
 {e:'📰',n:'報紙',b:0,t:'乾淨的紙類(報紙、書本、紙箱)可以回收。'},
 {e:'📦',n:'紙箱',b:0,t:'紙箱拆掉膠帶、壓扁後回收。'},
 {e:'🥛',n:'鋁箔包',b:0,t:'鋁箔包屬於紙容器,洗淨壓扁後回收。'},
 {e:'📚',n:'舊書本',b:0,t:'書本屬於紙類,乾淨的可以回收。'},
 {e:'👕',n:'乾淨舊衣',b:0,t:'乾淨的衣物可投入舊衣回收箱,屬於資源回收。'},
 {e:'🍶',n:'洗髮精瓶',b:0,t:'塑膠瓶身沖洗乾淨後回收。'},
 {e:'🍌',n:'香蕉皮',b:1,t:'水果皮屬於廚餘(可堆肥)。'},
 {e:'🍚',n:'吃剩的白飯',b:1,t:'剩菜剩飯屬於廚餘(養豬廚餘)。'},
 {e:'🥕',n:'紅蘿蔔皮',b:1,t:'蔬菜的皮、根、葉屬於廚餘。'},
 {e:'🍎',n:'蘋果核',b:1,t:'水果的果核、果皮屬於廚餘。'},
 {e:'🍵',n:'茶葉渣',b:1,t:'茶渣、咖啡渣瀝乾後屬於廚餘。'},
 {e:'🍜',n:'吃剩的麵條',b:1,t:'煮熟的麵食、剩菜屬於廚餘。'},
 {e:'🍉',n:'西瓜皮',b:1,t:'瓜果皮屬於廚餘。'},
 {e:'📃',n:'用過的衛生紙',b:2,t:'衛生紙纖維太短、又有髒污,不能回收,丟一般垃圾。'},
 {e:'🍖',n:'大骨頭',b:2,t:'豬牛大骨太硬,不能當廚餘,丟一般垃圾。'},
 {e:'🍢',n:'竹籤',b:2,t:'竹、木製的籤、筷子屬於一般垃圾。'},
 {e:'🏺',n:'破掉的陶瓷',b:2,t:'陶瓷碗盤不能回收,包好後丟一般垃圾。'},
 {e:'🎈',n:'破掉的氣球',b:2,t:'氣球是橡膠製品,無法回收,屬於一般垃圾。'},
 {e:'😷',n:'用過的口罩',b:2,t:'用過的口罩屬於一般垃圾,耳繩剪斷再丟更環保。'},
 {e:'🐚',n:'貝殼',b:2,t:'貝殼、蚵殼太硬不易分解,屬於一般垃圾。'},
 {e:'🚬',n:'菸蒂',b:2,t:'菸蒂屬於一般垃圾,要確認熄滅後再丟。'},
 {e:'🍱',n:'油污便當盒',b:2,t:'沾滿油污的紙餐盒無法回收,屬於一般垃圾。'},
 {e:'🔋',n:'廢電池',b:3,t:'電池含重金屬,不能丟一般垃圾,要拿到回收點。'},
 {e:'💡',n:'日光燈管',b:3,t:'燈管含汞,不可打破,要送到回收點。'},
 {e:'📱',n:'壞掉的手機',b:3,t:'手機屬於廢資訊物品(3C),要送到回收管道。'},
 {e:'🌡️',n:'水銀溫度計',b:3,t:'水銀溫度計含汞,屬於有害物,要送到回收點。'},
 {e:'🎧',n:'壞掉的耳機',b:3,t:'廢小型電子產品要送到回收管道。'},
];
const MODES=[{l:'💡簡易',m:1,d:'簡易:顯示答案'},{l:'🎓標準',m:1.5,d:'標準:只顯示名稱,收入 ×1.5'},{l:'🔥挑戰',m:2,d:'挑戰:不顯示名稱,收入 ×2'}];

/* 圖示相容檢查:缺字自動換成備用圖示 */
const EMOJI_FONT='"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
function glyphAlpha(ch){
 const c=document.createElement('canvas');c.width=c.height=40;
 const x=c.getContext('2d',{willReadFrequently:true});
 x.font='28px '+EMOJI_FONT;x.textBaseline='middle';x.fillText(ch,2,20);
 const d=x.getImageData(0,0,40,40).data,a=new Uint8Array(1600);
 for(let i=0;i<1600;i++)a[i]=d[i*4+3]>40?1:0;return a}
const TOFU=glyphAlpha('\u{10FFFE}');
function emojiOK(e){
 try{const a=glyphAlpha(e);let on=0,diff=0;

}
function cycle(dir){
 if(held.length<2||isOpen())return;
 if(dir>0)held.push(held.shift());else held.unshift(held.pop());
 tone(400,.04,'triangle',.05);renderHand();ui();
}
function act(){
 if(isOpen())return;
 if(!held.length){toast('👐 手上沒有東西,先去撿垃圾吧',1500);return}
 const b=aimed;
 if(!b){toast('🎯 面對垃圾桶、靠近一點,再丟入',1600);return}
 const id=held[0],it=ITEMS[id],d=S.dex[id]||(S.dex[id]={ok:0,ng:0});
 if(it.b===b.i){
  held.shift();d.ok++;S.ok++;S.sorted++;
  const gain=BIN[b.i].v*mult();S.money+=gain;S.total+=gain;
  toast(`✅ 答對了!<b style="color:#ffd766"> +$${fmt(gain)}</b><br><small>${it.e}${it.n}:${it.t}</small>`,3500);
  tone(660,.15,'sine',.1);setTimeout(()=>tone(990,.15,'sine',.07),80);vib(14);
 }else{
  d.ng++;S.ng++;
  toast(`❌ ${it.e}${it.n} 不是「${BIN[b.i].n}」<br>應該丟「${BIN[it.b].e}${BIN[it.b].n}」<br><small>${it.t}</small><br><small>滾輪可以換一個要丟的垃圾</small>`,5500);
  tone(160,.25,'sawtooth',.05);vib([30,40,30]);
 }
 renderHand();ui();save();
}
function smartClick(){
 if(isOpen())return;
 if(target&&held.length<capN()){pickup();return}
 if(held.length&&aimed){act();return}
 if(target){pickup();return}
 if(held.length){toast('🎯 面對垃圾桶(靠近一點)再點左鍵丟入',1600);return}
 toast('👀 對準地上的垃圾,靠近後點左鍵撿起',1600);
}

/* ========== 鍵盤 / 滑鼠 / 觸控 ========== */
addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' ','tab'].includes(k))e.preventDefault();
 keys[k]=1;
 if(e.repeat)return;
 if(k===' '||k==='e'||k==='enter')act();
 else if(k==='q')cycle(1);
 else if(k==='m')$('modeBtn').click();
 else if(k==='b'||k==='tab')isOpen()?closeShop():openShop('shop');
 else if(k==='g')isOpen()&&tab==='dex'?closeShop():openShop('dex');
 else if(k==='escape')closeShop();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0});

touch.addEventListener('click',e=>{
 if(e.pointerType==='touch')return;
 if(fine&&!document.pointerLockElement&&!isOpen())touch.requestPointerLock?.();
});
const clampM=v=>Math.max(-80,Math.min(80,v));
document.addEventListener('mousemove',e=>{
 if(document.pointerLockElement===touch){
  lookA-=clampM(e.movementX)*.0022;
  lookP-=clampM(e.movementY)*.0022;
 }
});
touch.addEventListener('mousedown',e=>{
 if(document.pointerLockElement===touch&&e.button===0)smartClick();
});
addEventListener('wheel',e=>{
 if(isOpen())return;e.preventDefault();
 if(Math.abs(e.deltaY)<1)return;
 cycle(e.deltaY>0?1:-1);
},{passive:false});

let mv={id:null,ox:0,oy:0,vx:0,vy:0},lk={id:null,x:0,y:0};
touch.addEventListener('pointerdown',e=>{
 if(e.pointerType==='mouse')return;
 e.preventDefault();try{touch.setPointerCapture(e.pointerId)}catch(_){}
 if(e.clientX<innerWidth*.5&&mv.id===null){mv={id:e.pointerId,ox:e.clientX,oy:e.clientY,vx:0,vy:0};
  joy.style.display='block';joy.style.left=(e.clientX-55)+'px';joy.style.top=(e.clientY-55)+'px';knob.style.transform='translate(0,0)'}
 else if(lk.id===null){lk={id:e.pointerId,x:e.clientX,y:e.clientY}}
});
touch.addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse')return;
 if(e.pointerId===mv.id){let dx=(e.clientX-mv.ox)/55,dy=(e.clientY-mv.oy)/55;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  mv.vx=dx;mv.vy=dy;knob.style.transform=`translate(${dx*33}px,${dy*33}px)`}
 else if(e.pointerId===lk.id){
  lookA-=(e.clientX-lk.x)*.006;
  lookP-=(e.clientY-lk.y)*.006;
  lk.x=e.clientX;lk.y=e.clientY}
});
function up(e){if(e.pointerId===mv.id){mv={id:null,ox:0,oy:0,vx:0,vy:0};joy.style.display='none'}if(e.pointerId===lk.id)lk={id:null,x:0,y:0}}
touch.addEventListener('pointerup',up);touch.addEventListener('pointercancel',up);
$('pickBtn').addEventListener('pointerdown',e=>{e.preventDefault();pickup()});
$('actBtn').addEventListener('pointerdown',e=>{e.preventDefault();act()});
$('stack').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();cycle(1)});

/* ========== 更新 ========== */
function update(dt){
 truckUpdate(dt);
 const open=isOpen();
 if(!open){
  if(keys['arrowleft'])lookA+=1.6*dt;if(keys['arrowright'])lookA-=1.6*dt;
 }
 const k=1-Math.exp(-dt*28);
 const dA=lookA*k,dP=lookP*k;lookA-=dA;lookP-=dP;
 P.a+=dA;P.p=Math.max(-1.3,Math.min(1.3,P.p+dP));

 let fwd=0,str=0;
 if(!open){
  if(keys['w']||keys['arrowup'])fwd+=1;if(keys['s']||keys['arrowdown'])fwd-=1;
  if(keys['d'])str+=1;if(keys['a'])str-=1;
  if(mv.id!==null){fwd+=-mv.vy;str+=mv.vx}
 }
 const l=Math.hypot(fwd,str);if(l>1){fwd/=l;str/=l}
 const run=keys['shift']?1.5:1;
 const sp=2.8*(1+.08*S.lv.spd)*run;
 const fx=-Math.sin(P.a),fz=-Math.cos(P.a),rx=Math.cos(P.a),rz=-Math.sin(P.a);
 const tvx=(fx*fwd+rx*str)*sp,tvz=(fz*fwd+rz*str)*sp;
 const ka=1-Math.exp(-dt*11);
 vel.x+=(tvx-vel.x)*ka;vel.z+=(tvz-vel.z)*ka;
 const vx=vel.x*dt,vz=vel.z*dt;
 if(!blocked(P.x+vx,P.z))P.x+=vx;else vel.x=0;
 if(!blocked(P.x,P.z+vz))P.z+=vz;else vel.z=0;
 const moving=Math.min(1,Math.hypot(vel.x,vel.z)/sp||0);
 if(S.bob){bobT+=moving*dt*8*run;bob=Math.sin(bobT)*.022*moving}else bob=0;
 cam.position.set(P.x,1.6+bob,P.z);cam.rotation.set(P.p,P.a,0);
 $('hand').style.transform=S.bob?`translate(0,${Math.abs(Math.sin(bobT))*5*moving}px)`:'none';

 const inc=income();if(inc>0){S.money+=inc*dt;S.total+=inc*dt}

 for(let i=floorItems.length-1;i>=0;i--){const f=floorItems[i];
  if(f.state!=='fall')continue;
  f.age+=dt;const u=Math.min(1,f.age/f.T);
  f.sp.position.set(f.x0+(f.tx-f.x0)*u,f.y0+f.vy*f.age-4.9*f.age*f.age,f.z0+(f.tz-f.z0)*u);
  f.sp.material.rotation=f.age*7;
  if(f.age>=f.T){f.state='idle';f.sp.material.rotation=0;f.disc.visible=true;f.sp.position.set(f.tx,.5,f.tz);tone(110,.12,'sine',.1,60)}}

 const cp=Math.cos(P.p),dxv=-Math.sin(P.a)*cp,dyv=Math.sin(P.p),dzv=-Math.cos(P.a)*cp;
 const reach=2.5+.25*S.lv.rng;
 let tg=null,best=1e9;
 floorItems.forEach(f=>{
  if(f.state!=='idle')return;
  f.sp.position.y=.5+.03*Math.sin(time*1.6+f.ph);
  f.disc.material.color.set(S.mode===0?BIN[ITEMS[f.id].b].c:'#000000');
  f.disc.material.opacity=S.mode===0?.6:.3;
  f.sp.scale.set(.6,.6,1);
  const vx2=f.x-P.x,vy2=f.sp.position.y-cam.position.y,vz2=f.z-P.z;
  const d2=vx2*vx2+vy2*vy2+vz2*vz2,dot=vx2*dxv+vy2*dyv+vz2*dzv;
  if(dot<=0||d2>reach*reach)return;
  const perp=Math.sqrt(Math.max(0,d2-dot*dot));
  if(perp<.42&&dot<best){best=dot;tg=f}});
 if(tg)tg.sp.scale.set(.78,.78,1);
 target=tg;
 let ab=null,bc=.9;
 for(const b of BINPOS){
  const vx3=b.x-P.x,vy3=.8-cam.position.y,vz3=b.z-P.z,d=Math.hypot(vx3,vy3,vz3);
  if(d>3.9)continue;
  const c=(vx3*dxv+vy3*dyv+vz3*dzv)/d;
  if(c>bc){bc=c;ab=b}}
 aimed=ab;
 $('cross').classList.toggle('on',!!tg||(!!ab&&held.length>0));
}

/* ========== UI ========== */
function renderHand(bump){
 const st=$('stack');st.innerHTML='';
 held.forEach((id,i)=>{
  const d=document.createElement('div');d.className='hi'+(i===0?' cur':'');
  d.textContent=ITEMS[id].e;
  d.style.transform=`translateX(${i===0?0:(i%2?10:-10)}px) rotate(${i===0?0:(i%2?8:-8)}deg)`;
  if(bump&&i===held.length-1)d.classList.add('bump');
  st.appendChild(d)});
}
let uiT=0,lastTg='';
function ui(){
 $('money').textContent='$'+fmt(S.money);
 const acc=S.ok+S.ng?Math.round(S.ok/(S.ok+S.ng)*100):0;
 $('rate').textContent=(S.lv.vol?'每秒 $'+fmt(income())+' ・ ':'')+'正確率 '+acc+'%';
 let best=null;UP.forEach(u=>{if(u.max&&S.lv[u.id]>=u.max)return;const c=cost(u);if(!best||c<best.c)best={u,c}});
 if(best){$('goalTx').textContent='🎯 '+best.u.name+' Lv'+(S.lv[best.u.id]+1)+' $'+fmt(best.c);$('barI').style.width=Math.min(100,S.money/best.c*100)+'%'}
 const st=$('state');
 if(T.ph==='stop'){const r=Math.ceil(STOP-T.t);st.className='hud pill stop';
  st.textContent=dropping()?`🛑 停車中・車尾開口丟入垃圾(${r}秒後出發)`:`🛑 即將出發…(${r})`}
 else{st.className='hud pill go';
  st.textContent=T.ph==='brake'?'🚚 即將停靠…':T.ph==='acc'?'🚚 出發中…':'🚚 行駛中・前往下一個收運點'}
 let t='';
 if(target){const it=ITEMS[target.id];
  const nm=S.mode===0?`${it.e} ${it.n} → ${BIN[it.b].n}`:S.mode===1?`${it.e} ${it.n}`:'❓ 這是什麼垃圾?';
  t=(fine?'[左鍵] 撿起 ':'')+nm}
 else if(aimed&&held.length){t=(fine?'[左鍵] ':'')+'丟入 '+BIN[aimed.i].e+BIN[aimed.i].n}
 if(t!==lastTg){lastTg=t;$('tgTx').textContent=t}
 const cur=held.length?ITEMS[held[0]]:null;
 let lbl='';
 if(cur)lbl=S.mode===0?`${cur.n} → ${BIN[cur.b].n}`:S.mode===1?cur.n:'❓ 要丟哪一桶?';
 if($('curLbl').textContent!==lbl)$('curLbl').textContent=lbl;
 $('cnt').textContent=`手上 ${held.length}/${capN()}`;
 $('actBtn').classList.toggle('dim',!(aimed&&held.length));
 $('pickBtn').classList.toggle('dim',!target||held.length>=capN());
 $('modeBtn').textContent=MODES[S.mode].l;
 $('bobBtn').textContent=S.bob?'🌀開':'🌀關';$('bobBtn').classList.toggle('off',!S.bob);
 if(isOpen()&&tab==='shop')updShop();
}

/* ========== 商店 / 圖鑑 ========== */
function buildShop(){
 const L=$('list');L.innerHTML='';
 UP.forEach(u=>{const d=document.createElement('div');d.className='it';d.id='u_'+u.id;
  d.innerHTML=`<div class="ic">${u.ic}</div><div class="tx"><b></b><small>${u.desc}</small></div><button class="buy"></button>`;
  d.querySelector('button').onclick=()=>buy(u);L.appendChild(d)});
 updShop();
}
function updShop(){UP.forEach(u=>{const d=$('u_'+u.id);if(!d)return;const lv=S.lv[u.id],mx=u.max&&lv>=u.max,c=cost(u);
 d.querySelector('b').textContent=u.name+'  Lv'+lv+(u.max?'/'+u.max:'');
 const b=d.querySelector('button');b.textContent=mx?'已滿級':'$'+fmt(c);b.disabled=mx||S.money<c})}
function buildDex(){
 const L=$('list');const seen=Object.keys(S.dex).length;
 let h=`<div class="it"><div class="tx"><b>📖 分類圖鑑 ${seen}/${ITEMS.length}</b><small>答對 ${S.ok} 次・答錯 ${S.ng} 次。投入過的物品會解鎖說明。</small></div></div>`;
 ITEMS.forEach((it,i)=>{const d=S.dex[i];
  if(!d){h+=`<div class="it"><div class="ic">❓</div><div class="tx"><b>未知物品</b><small>投入垃圾桶後解鎖</small></div></div>`;return}
  h+=`<div class="it"><div class="ic">${it.e}</div><div class="tx"><b>${it.n}</b><span class="tag" style="background:${BIN[it.b].c}">${BIN[it.b].n}</span><small>${it.t}<br>✅${d.ok} ❌${d.ng}</small></div></div>`});
 L.innerHTML=h;
}
function setTab(t){tab=t;$('tShop').classList.toggle('on',t==='shop');$('tDex').classList.toggle('on',t==='dex');t==='shop'?buildShop():buildDex()}
function buy(u){
 const c=cost(u);if(S.money<c||(u.max&&S.lv[u.id]>=u.max))return;
 S.money-=c;S.lv[u.id]++;tone(520,.12,'triangle',.1);setTimeout(()=>tone(780,.18,'triangle',.1),90);vib([10,30,10]);
 if(u.id==='cap')renderHand();
 updShop();ui();save();
}
$('shopBtn').onclick=()=>openShop('shop');
$('closeShop').onclick=closeShop;
$('tShop').onclick=()=>setTab('shop');$('tDex').onclick=()=>setTab('dex');
$('mute').textContent=S.mute?'🔇':'🔊';
$('mute').onclick=()=>{S.mute=!S.mute;$('mute').textContent=S.mute?'🔇':'🔊';save()};
$('modeBtn').onclick=()=>{S.mode=(S.mode+1)%3;toast(MODES[S.mode].d,2200);ui();save()};
$('bobBtn').onclick=()=>{S.bob=!S.bob;toast(S.bob?'🌀 走路晃動:開':'🌀 走路晃動:關(比較不暈)',1800);ui();save()};

/* ========== 離線收益 ========== */
(function(){
 const secs=Math.min((Date.now()-S.last)/1000,8*3600),r=income();
 if(r>0&&secs>60){const g=r*secs*.5;S.money+=g;S.total+=g;const m=Math.floor(secs/60);
  $('offTx').innerHTML='你離開了 '+(m>=60?Math.floor(m/60)+' 小時 ':'')+(m%60)+' 分鐘<br>志工們幫你賺了 <b style="color:#ffd766">$'+fmt(g)+'</b>';
  $('modal').style.display='flex'}
 $('offOk').onclick=()=>{$('modal').style.display='none'};save();
})();

/* ========== 主迴圈 ========== */
let lt=performance.now();
function loop(n){
 const dt=Math.min(.1,(n-lt)/1000);lt=n;time+=dt;
 update(dt);renderer.render(scene,cam);
 uiT+=dt;if(uiT>.1){uiT=0;ui()}
 requestAnimationFrame(loop);
}
renderHand();ui();requestAnimationFrame(loop);
setTimeout(()=>toast(fine
 ?'🚚 你站在回收車的車斗上!<br>WASD 移動・點畫面後滑鼠轉頭<br>垃圾會從<b>車尾開口</b>丟進來<br>對準撿起(左鍵)→ 面對垃圾桶丟入(左鍵)'
 :'🚚 你站在回收車的車斗上!<br>左半邊=走路 右半邊=轉頭<br>垃圾從<b>車尾開口</b>丟進來<br>準心對準垃圾按 ✋,面對垃圾桶按 🗑️',8000),500);
</script>
