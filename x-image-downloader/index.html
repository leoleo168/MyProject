<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X (Twitter) 媒體一鍵下載器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 JSZip 與 FileSaver 庫，實現無阻擋的 ZIP 一鍵打包下載 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        .hidden-element { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
        .media-zoom { transition: transform 0.3s ease; }
        .group:hover .media-zoom { transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="flex justify-center mb-4">
                <div class="bg-blue-500 p-3 rounded-2xl shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-slate-900">X (Twitter) 媒體下載器</h1>
            <p class="text-slate-500">貼上貼文網址，自動解析並打包下載高畫質圖片與影片</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <input
                    type="text"
                    id="urlInput"
                    placeholder="請在此貼上 X (Twitter) 貼文網址..."
                    class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                />
            </div>
            <button
                id="analyzeBtn"
                class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-medium flex items-center justify-center gap-2 transition-colors disabled:opacity-70 disabled:cursor-not-allowed whitespace-nowrap"
            >
                <svg id="btnSpinner" class="hidden-element w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <svg id="btnIcon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <span id="btnText">解析媒體</span>
            </button>
        </div>

        <!-- Error Message -->
        <div id="errorDiv" class="hidden-element bg-red-50 text-red-600 p-4 rounded-xl flex items-start gap-3 border border-red-100">
            <svg class="w-5 h-5 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <p id="errorText"></p>
        </div>

        <!-- Results Section -->
        <div id="resultsDiv" class="hidden-element bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-100">
                <div>
                    <h2 id="countText" class="text-lg font-semibold text-slate-900">找到 0 個媒體檔案</h2>
                    <p id="authorText" class="text-sm text-slate-500 mt-1 line-clamp-1"></p>
                </div>
                <button
                    id="downloadAllBtn"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 transition-colors w-full sm:w-auto justify-center shadow-sm shadow-blue-500/30 disabled:opacity-60 disabled:cursor-not-allowed"
                >
                    <svg id="dlAllIcon" class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    <svg id="dlAllSpinner" class="hidden-element w-4 h-4 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="dlAllText">一鍵打包下載 (ZIP)</span>
                </button>
            </div>

            <!-- Media Grid -->
            <div id="imageGrid" class="grid gap-4">
                <!-- Media will be injected here by JS -->
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorDiv = document.getElementById('errorDiv');
        const errorText = document.getElementById('errorText');
        const resultsDiv = document.getElementById('resultsDiv');
        const imageGrid = document.getElementById('imageGrid');
        const countText = document.getElementById('countText');
        const authorText = document.getElementById('authorText');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const dlAllText = document.getElementById('dlAllText');
        const dlAllIcon = document.getElementById('dlAllIcon');
        const dlAllSpinner = document.getElementById('dlAllSpinner');

        let currentMedia = [];
        let currentAuthor = '';

        async function handleAnalyze() {
            const url = urlInput.value.trim();
            if (!url) {
                showError('請輸入網址');
                return;
            }

            setLoading(true);
            hideError();
            resultsDiv.classList.add('hidden-element');
            currentMedia = [];

            try {
                const match = url.match(/(?:x\.com|twitter\.com)\/([^/]+)\/status\/(\d+)/);
                if (!match) throw new Error('無效的網址格式。請確保網址包含 status/數字');

                const username = match[1];
                const tweetId = match[2];

                const response = await fetch(`https://api.fxtwitter.com/${username}/status/${tweetId}`);
                if (!response.ok) throw new Error('無法解析此貼文，可能是私人帳號、貼文已刪除或 API 暫時失效。');

                const data = await response.json();
                const tweet = data.tweet;

                if (!tweet) throw new Error('無法取得貼文資料。');

                if (tweet.media) {
                    if (tweet.media.photos) {
                        tweet.media.photos.forEach(photo => {
                            const urlObj = new URL(photo.url);
                            urlObj.searchParams.set('name', 'orig');
                            currentMedia.push({ type: 'photo', url: urlObj.toString() });
                        });
                    }
                    
                    if (tweet.media.video) {
                        currentMedia.push({ type: 'video', url: tweet.media.video.url, poster: tweet.media.video.thumbnail_url });
                    }
                    
                    if (tweet.media.videos) {
                        tweet.media.videos.forEach(video => {
                            currentMedia.push({ type: 'video', url: video.url, poster: video.thumbnail_url });
                        });
                    }

                    // 去除重複
                    currentMedia = Array.from(new Map(currentMedia.map(item => [item.url, item])).values());
                }

                if (currentMedia.length > 0) {
                    currentAuthor = tweet.author.screen_name || username;
                    renderResults();
                } else {
                    throw new Error('此貼文沒有包含任何圖片或影片檔案 (可能是純文字)。');
                }
            } catch (err) {
                showError(err.message || '發生未知錯誤');
            } finally {
                setLoading(false);
            }
        }

        function renderResults() {
            const photoCount = currentMedia.filter(m => m.type === 'photo').length;
            const videoCount = currentMedia.filter(m => m.type === 'video').length;
            
            let countStr = [];
            if (photoCount > 0) countStr.push(`${photoCount} 張圖片`);
            if (videoCount > 0) countStr.push(`${videoCount} 部影片`);
            
            countText.textContent = `找到 ${countStr.join('、')}`;
            authorText.textContent = `來自 @${currentAuthor} 的貼文`;
            
            imageGrid.className = 'grid gap-4';
            if (currentMedia.length === 1) imageGrid.classList.add('grid-cols-1');
            else if (currentMedia.length === 2) imageGrid.classList.add('grid-cols-1', 'sm:grid-cols-2');
            else imageGrid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'md:grid-cols-2');

            imageGrid.innerHTML = currentMedia.map((media, idx) => {
                const isVideo = media.type === 'video';
                const mediaElement = isVideo 
                    ? `<video src="${media.url}" poster="${media.poster || ''}" class="media-zoom w-full h-full object-cover" autoplay loop muted playsinline></video>
                       <div class="absolute top-3 left-3 bg-black/60 text-white px-2 py-1 rounded text-xs font-bold backdrop-blur-md flex items-center gap-1">
                          <svg class="w-3 h-3" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> GIF/影片
                       </div>`
                    : `<img src="${media.url}" alt="Twitter media ${idx + 1}" class="media-zoom w-full h-full object-cover" loading="lazy" />`;

                return `
                <div class="group relative rounded-xl overflow-hidden border border-slate-200 bg-slate-900 aspect-square">
                    ${mediaElement}
                    <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center gap-3 backdrop-blur-sm">
                        <button onclick="downloadSingleMedia('${media.url}', ${idx}, '${media.type}')" class="bg-white text-slate-900 p-3 rounded-full hover:bg-blue-50 transition-colors shadow-lg" title="下載此檔案">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        </button>
                        <a href="${media.url}" target="_blank" rel="noopener noreferrer" class="bg-white/20 text-white p-3 rounded-full hover:bg-white/30 transition-colors shadow-lg" title="在新分頁開啟原圖/影片">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                        </a>
                    </div>
                </div>
                `;
            }).join('');

            resultsDiv.classList.remove('hidden-element');
        }

        // 單一檔案下載（維持開新分頁／直接下載）
        function downloadSingleMedia(url, index, type) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // 一鍵打包下載成 ZIP 壓縮檔（解決多圖被瀏覽器快顯封鎖攔截的問題）
        async function handleDownloadAllZip() {
            if (currentMedia.length === 0) return;

            downloadAllBtn.disabled = true;
            dlAllIcon.classList.add('hidden-element');
            dlAllSpinner.classList.remove('hidden-element');

            const zip = new JSZip();
            let completed = 0;

            for (let i = 0; i < currentMedia.length; i++) {
                const media = currentMedia[i];
                dlAllText.textContent = `打包中 (${i + 1}/${currentMedia.length})...`;

                try {
                    // 透過 fetch 取得二進位資料
                    const res = await fetch(media.url);
                    if (!res.ok) throw new Error('Fetch failed');
                    const blob = await res.blob();
                    
                    const ext = media.type === 'video' ? 'mp4' : 'jpg';
                    const fileName = `${currentAuthor}_${String(i + 1).padStart(2, '0')}.${ext}`;
                    zip.file(fileName, blob);
                    completed++;
                } catch (e) {
                    console.warn(`第 ${i + 1} 個檔案無法直接打包，略過`, e);
                }
            }

            if (completed > 0) {
                dlAllText.textContent = '產生壓縮檔中...';
                const zipBlob = await zip.generateAsync({ type: 'blob' });
                saveAs(zipBlob, `X_${currentAuthor}_${currentMedia.length}個檔案.zip`);
            } else {
                // 如果全都遇到 CORS 阻擋（極少見），退回依序開分頁
                alert('無法自動打包，將嘗試依序開啟下載分頁，請允許快顯視窗。');
                currentMedia.forEach(m => window.open(m.url, '_blank'));
            }

            // 還原按鈕狀態
            dlAllText.textContent = '一鍵打包下載 (ZIP)';
            dlAllIcon.classList.remove('hidden-element');
            dlAllSpinner.classList.add('hidden-element');
            downloadAllBtn.disabled = false;
        }

        function setLoading(isLoading) {
            analyzeBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = '解析中...';
                btnIcon.classList.add('hidden-element');
                btnSpinner.classList.remove('hidden-element');
            } else {
                btnText.textContent = '解析媒體';
                btnIcon.classList.remove('hidden-element');
                btnSpinner.classList.add('hidden-element');
            }
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorDiv.classList.remove('hidden-element');
        }

        function hideError() {
            errorDiv.classList.add('hidden-element');
        }

        analyzeBtn.addEventListener('click', handleAnalyze);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAnalyze();
        });
        downloadAllBtn.addEventListener('click', handleDownloadAllZip);
    </script>
</body>
</html>
