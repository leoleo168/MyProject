<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X (Twitter) 圖片一鍵下載器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-element { display: none !important; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-spin { animation: spin 1s linear infinite; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 p-4 md:p-8 font-sans text-slate-800">
    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="flex justify-center mb-4">
                <div class="bg-blue-500 p-3 rounded-2xl shadow-lg shadow-blue-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg>
                </div>
            </div>
            <h1 class="text-3xl font-bold text-slate-900">X (Twitter) 圖片下載器</h1>
            <p class="text-slate-500">貼上貼文網址，自動解析並下載高畫質原圖</p>
        </div>

        <!-- Input Section -->
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col sm:flex-row gap-3">
            <div class="relative flex-1">
                <input
                    type="text"
                    id="urlInput"
                    placeholder="請在此貼上 X (Twitter) 貼文網址..."
                    class="w-full pl-4 pr-10 py-3 rounded-xl border border-slate-200 focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                />
            </div>
            <button
                id="analyzeBtn"
                class="bg-slate-900 hover:bg-slate-800 text-white px-6 py-3 rounded-xl font-medium flex items-center justify-center gap-2 transition-colors disabled:opacity-70 disabled:cursor-not-allowed whitespace-nowrap"
            >
                <svg id="btnSpinner" class="hidden-element w-5 h-5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                <svg id="btnIcon" class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <span id="btnText">解析圖片</span>
            </button>
        </div>

        <!-- Error Message -->
        <div id="errorDiv" class="hidden-element bg-red-50 text-red-600 p-4 rounded-xl flex items-start gap-3 border border-red-100">
            <svg class="w-5 h-5 shrink-0 mt-0.5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            <p id="errorText"></p>
        </div>

        <!-- Results Section -->
        <div id="resultsDiv" class="hidden-element bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-6">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-100">
                <div>
                    <h2 id="countText" class="text-lg font-semibold text-slate-900">找到 0 張圖片</h2>
                    <p id="authorText" class="text-sm text-slate-500 mt-1 line-clamp-1"></p>
                </div>
                <button
                    id="downloadAllBtn"
                    class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2.5 rounded-xl font-medium flex items-center gap-2 transition-colors w-full sm:w-auto justify-center shadow-sm shadow-blue-500/30"
                >
                    <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                    一鍵下載全部
                </button>
            </div>

            <!-- Image Grid -->
            <div id="imageGrid" class="grid gap-4">
                <!-- Images will be injected here by JS -->
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');
        const errorDiv = document.getElementById('errorDiv');
        const errorText = document.getElementById('errorText');
        const resultsDiv = document.getElementById('resultsDiv');
        const imageGrid = document.getElementById('imageGrid');
        const countText = document.getElementById('countText');
        const authorText = document.getElementById('authorText');
        const downloadAllBtn = document.getElementById('downloadAllBtn');

        let currentImages = [];
        let currentAuthor = '';

        // 處理解析
        async function handleAnalyze() {
            const url = urlInput.value.trim();
            if (!url) {
                showError('請輸入網址');
                return;
            }

            setLoading(true);
            hideError();
            resultsDiv.classList.add('hidden-element');
            currentImages = [];

            try {
                const match = url.match(/(?:x\.com|twitter\.com)\/([^/]+)\/status\/(\d+)/);
                if (!match) throw new Error('無效的網址格式。請確保網址包含 status/數字');

                const username = match[1];
                const tweetId = match[2];

                // 改用 fxtwitter API
                const response = await fetch(`https://api.fxtwitter.com/${username}/status/${tweetId}`);
                if (!response.ok) throw new Error('無法解析此貼文，可能是私人帳號、貼文已刪除或 API 暫時失效。');

                const data = await response.json();
                
                // fxtwitter 的資料結構在 data.tweet 裡面
                const tweet = data.tweet;

                if (!tweet) {
                     throw new Error('無法取得貼文資料。');
                }

                // fxtwitter 的媒體資料結構
                if (tweet.media && tweet.media.photos && tweet.media.photos.length > 0) {
                    
                    // 取得所有圖片網址，並轉換為原圖畫質
                    currentImages = tweet.media.photos.map(photo => {
                        const urlObj = new URL(photo.url);
                        urlObj.searchParams.set('name', 'orig');
                        return urlObj.toString();
                    });

                    currentAuthor = tweet.author.screen_name || username;
                    renderResults();
                } else {
                    throw new Error('此貼文沒有包含任何圖片檔案 (可能是影片或純文字)。');
                }
            } catch (err) {
                showError(err.message || '發生未知錯誤');
            } finally {
                setLoading(false);
            }
        }

        // 渲染結果
        function renderResults() {
            countText.textContent = `找到 ${currentImages.length} 張圖片`;
            authorText.textContent = `來自 @${currentAuthor} 的貼文`;
            
            // 設定網格欄數
            imageGrid.className = 'grid gap-4';
            if (currentImages.length === 1) imageGrid.classList.add('grid-cols-1');
            else if (currentImages.length === 2) imageGrid.classList.add('grid-cols-1', 'sm:grid-cols-2');
            else imageGrid.classList.add('grid-cols-1', 'sm:grid-cols-2', 'md:grid-cols-2');

            imageGrid.innerHTML = currentImages.map((img, idx) => `
                <div class="group relative rounded-xl overflow-hidden border border-slate-200 bg-slate-50 aspect-square">
                    <img src="${img}" alt="Twitter image ${idx + 1}" class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105" loading="lazy" />
                    <div class="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center gap-3 backdrop-blur-sm">
                        <button onclick="downloadImage('${img}', ${idx})" class="bg-white text-slate-900 p-3 rounded-full hover:bg-blue-50 transition-colors shadow-lg" title="下載此圖片">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
                        </button>
                        <a href="${img}" target="_blank" rel="noopener noreferrer" class="bg-white/20 text-white p-3 rounded-full hover:bg-white/30 transition-colors shadow-lg" title="在新分頁開啟原圖">
                            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" x2="21" y1="14" y2="3"/></svg>
                        </a>
                    </div>
                </div>
            `).join('');

            resultsDiv.classList.remove('hidden-element');
        }

        // 下載單張圖片
        async function downloadImage(imgUrl, index) {
            try {
                const response = await fetch(imgUrl);
                const blob = await response.blob();
                const blobUrl = window.URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `X_Image_${currentAuthor || 'download'}_${index + 1}.jpg`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                window.URL.revokeObjectURL(blobUrl);
            } catch (e) {
                console.warn('Blob download failed, opening in new tab', e);
                window.open(imgUrl, '_blank');
            }
        }

        // UI 狀態控制
        function setLoading(isLoading) {
            analyzeBtn.disabled = isLoading;
            if (isLoading) {
                btnText.textContent = '解析中...';
                btnIcon.classList.add('hidden-element');
                btnSpinner.classList.remove('hidden-element');
            } else {
                btnText.textContent = '解析圖片';
                btnIcon.classList.remove('hidden-element');
                btnSpinner.classList.add('hidden-element');
            }
        }

        function showError(msg) {
            errorText.textContent = msg;
            errorDiv.classList.remove('hidden-element');
        }

        function hideError() {
            errorDiv.classList.add('hidden-element');
        }

        // 事件監聽
        analyzeBtn.addEventListener('click', handleAnalyze);
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAnalyze();
        });
        downloadAllBtn.addEventListener('click', () => {
            currentImages.forEach((imgUrl, index) => {
                setTimeout(() => { downloadImage(imgUrl, index); }, index * 500);
            });
        });
    </script>
</body>
</html>
