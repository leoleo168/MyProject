name: Deploy Auto-Generated Hub to GitHub Pages

on:
  push:
    branches: ["main"] # 如果你的主分支是 master，請改成 master
  workflow_dispatch:   # 允許手動在 GitHub 後台觸發

# 設定部署權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 使用 Node.js 掃描所有資料夾並產生精美的雙語首頁 index.html
      - name: Build Index Page
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. 取得所有包含 index.html 的子資料夾
            const directories = fs.readdirSync(".", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith("."))
              .filter(d => fs.existsSync(path.join(d.name, "index.html")));

            // 2. 整理專案資料
            const projects = directories.map(dir => {
              const folderName = dir.name;
              let meta = {
                title: folderName.replace(/[-_]/g, " "),
                description: "點擊進入查看互動效果。",
                tags: ["Web"],
                date: ""
              };

              const metaFile = path.join(folderName, "meta.json");
              if (fs.existsSync(metaFile)) {
                try {
                  meta = { ...meta, ...JSON.parse(fs.readFileSync(metaFile, "utf8")) };
                } catch (e) {
                  console.error("解析 meta.json 失敗:", metaFile);
                }
              }

              const hasPreview = fs.existsSync(path.join(folderName, "preview.png"));
              const previewImg = hasPreview ? `./${folderName}/preview.png` : "";

              return { ...meta, folder: folderName, previewImg };
            });

            // 2.5 收集所有不重複的 TAG
            const allTags = new Set();
            projects.forEach(p => {
              if (p.tags && Array.isArray(p.tags)) {
                p.tags.forEach(t => allTags.add(t));
              }
            });
            const uniqueTags = Array.from(allTags).sort();

            // 生成篩選按鈕 HTML
            const filterHtml = `
              <div class="filter-container">
                <button class="filter-btn active" data-filter="all">
                  <i class="fa-solid fa-layer-group"></i> <span data-i18n="filterAll">全部作品</span>
                </button>
                ${uniqueTags.map(t => `
                  <button class="filter-btn" data-filter="${t}">
                    <span>${t}</span>
                  </button>
                `).join("")}
              </div>
            `;

            // 3. 生成卡片 HTML
            const cardsHtml = projects.map(p => `
              <a href="./${p.folder}/" class="card" target="_blank" rel="noopener noreferrer" data-tags="${(p.tags || []).join(",")}">
                <div class="card-img-wrapper">
                  ${p.previewImg ? `<div class="card-img" style="background-image: url(\x27${p.previewImg}\x27);"></div>` : `<div class="card-placeholder"><i class="fa-solid fa-compass-drafting"></i></div>`}
                  <div class="card-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                </div>
                <div class="card-content">
                  <div class="tags">
                    ${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}
                  </div>
                  <h2 class="card-title">${p.title}</h2>
                  <p class="card-desc">${p.description}</p>
                  <div class="card-footer">
                    <span class="card-link"><span data-i18n="viewProject">立即探索</span> <i class="fa-solid fa-arrow-right"></i></span>
                  </div>
                </div>
              </a>
            `).join("\n");

            // 4. 生成新版首頁 index.html
            const fullHtml = `<!DOCTYPE html>
            <html lang="zh-TW">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>單頁互動實驗室 | Single Page Lab</title>
              
              <!-- Google Fonts & Font Awesome 圖示 -->
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

              <style>
                :root {
                  --bg-main: #0b1120;
                  --bg-card: rgba(30, 41, 59, 0.7);
                  --border-color: rgba(51, 65, 85, 0.6);
                  --accent: #38bdf8;
                  --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
                  --text-main: #f8fafc;
                  --text-muted: #94a3b8;
                }

                * { box-sizing: border-box; margin: 0; padding: 0; }
                
                body {
                  font-family: "Plus Jakarta Sans", "Noto Sans TC", system-ui, sans-serif;
                  background-color: var(--bg-main);
                  color: var(--text-main);
                  min-height: 100vh;
                  padding: 2.5rem 1.5rem 4rem;
                  background-image: 
                    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
                  background-attachment: fixed;
                }

                .container { max-width: 1240px; margin: 0 auto; }

                /* 頂部導覽列（含語言切換） */
                .navbar {
                  display: flex;
                  justify-content: flex-end;
                  margin-bottom: 2rem;
                }
                .lang-toggle {
                  background: rgba(30, 41, 59, 0.8);
                  border: 1px solid var(--border-color);
                  color: var(--text-muted);
                  padding: 0.45rem 1rem;
                  border-radius: 9999px;
                  cursor: pointer;
                  font-size: 0.85rem;
                  font-weight: 600;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  transition: all 0.25s ease;
                  backdrop-filter: blur(8px);
                }
                .lang-toggle:hover {
                  color: var(--accent);
                  border-color: var(--accent);
                  box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
                }

                /* Hero 標題區 */
                header { margin-bottom: 2.5rem; text-align: center; }
                .hero-pill {
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  font-size: 0.8rem;
                  font-weight: 600;
                  color: var(--accent);
                  background: rgba(56, 189, 248, 0.1);
                  border: 1px solid rgba(56, 189, 248, 0.25);
                  padding: 0.3rem 0.9rem;
                  border-radius: 9999px;
                  margin-bottom: 1rem;
                }
                h1 {
                  font-size: clamp(2.2rem, 5vw, 3.2rem);
                  font-weight: 800;
                  letter-spacing: -0.03em;
                  margin-bottom: 0.75rem;
                  background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
                }
                .subtitle {
                  color: var(--text-muted);
                  font-size: 1.1rem;
                  max-width: 600px;
                  margin: 0 auto;
                }

                /* 聯絡資訊標籤 */
                .contact-info {
                  display: flex;
                  justify-content: center;
                  gap: 0.85rem;
                  margin-top: 1.5rem;
                  flex-wrap: wrap;
                }
                .contact-link {
                  color: var(--text-muted);
                  text-decoration: none;
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  font-size: 0.875rem;
                  font-weight: 600;
                  background: var(--bg-card);
                  padding: 0.45rem 1.1rem;
                  border-radius: 9999px;
                  border: 1px solid var(--border-color);
                  transition: all 0.25s ease;
                  cursor: pointer;
                  backdrop-filter: blur(8px);
                  font-family: inherit;
                }
                .contact-link:hover {
                  color: #fff;
                  border-color: var(--accent);
                  background: rgba(30, 41, 59, 1);
                  transform: translateY(-2px);
                  box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15);
                }

                /* 標籤分類篩選列 */
                .filter-container {
                  display: flex;
                  justify-content: center;
                  gap: 0.6rem;
                  margin-bottom: 3rem;
                  flex-wrap: wrap;
                }
                .filter-btn {
                  background: var(--bg-card);
                  color: var(--text-muted);
                  border: 1px solid var(--border-color);
                  padding: 0.5rem 1.15rem;
                  border-radius: 9999px;
                  cursor: pointer;
                  font-size: 0.9rem;
                  font-weight: 600;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  transition: all 0.2s ease;
                  backdrop-filter: blur(8px);
                }
                .filter-btn:hover {
                  color: #fff;
                  border-color: #64748b;
                }
                .filter-btn.active {
                  background: var(--accent-gradient);
                  color: #0b1120;
                  border-color: transparent;
                  box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
                }

                /* 作品卡片網格 */
                .grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                  gap: 2rem;
                }
                .card {
                  background: var(--bg-card);
                  border-radius: 20px;
                  overflow: hidden;
                  border: 1px solid var(--border-color);
                  text-decoration: none;
                  color: inherit;
                  display: flex;
                  flex-direction: column;
                  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                  backdrop-filter: blur(12px);
                  position: relative;
                }
                .card.hidden {
                  display: none;
                }
                .card:hover {
                  transform: translateY(-6px);
                  border-color: rgba(56, 189, 248, 0.6);
                  box-shadow: 0 16px 32px -10px rgba(56, 189, 248, 0.25);
                }
                
                /* 卡片圖片與預覽 */
                .card-img-wrapper {
                  position: relative;
                  overflow: hidden;
                  width: 100%;
                  height: 180px;
                  background: #131d31;
                  border-bottom: 1px solid var(--border-color);
                }
                .card-img {
                  width: 100%;
                  height: 100%;
                  background-size: cover;
                  background-position: center;
                  transition: transform 0.4s ease;
                }
                .card:hover .card-img {
                  transform: scale(1.05);
                }
                .card-placeholder {
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 2.8rem;
                  color: #334155;
                  background: linear-gradient(135deg, #131d31 0%, #1e293b 100%);
                }
                .card-badge {
                  position: absolute;
                  top: 0.75rem;
                  right: 0.75rem;
                  width: 32px;
                  height: 32px;
                  background: rgba(15, 23, 42, 0.85);
                  border: 1px solid var(--border-color);
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 0.75rem;
                  color: var(--accent);
                  backdrop-filter: blur(4px);
                  transition: all 0.2s ease;
                }
                .card:hover .card-badge {
                  background: var(--accent);
                  color: #0b1120;
                  transform: rotate(45deg);
                }

                /* 卡片內容 */
                .card-content {
                  padding: 1.5rem;
                  display: flex;
                  flex-direction: column;
                  flex-grow: 1;
                }
                .tags {
                  display: flex;
                  gap: 0.4rem;
                  margin-bottom: 0.75rem;
                  flex-wrap: wrap;
                }
                .tag {
                  font-size: 0.725rem;
                  background: rgba(56, 189, 248, 0.1);
                  color: var(--accent);
                  border: 1px solid rgba(56, 189, 248, 0.2);
                  padding: 0.2rem 0.55rem;
                  border-radius: 9999px;
                  font-weight: 600;
                }
                .card-title {
                  font-size: 1.25rem;
                  font-weight: 700;
                  color: #f8fafc;
                  margin-bottom: 0.5rem;
                  line-height: 1.35;
                }
                .card-desc {
                  font-size: 0.925rem;
                  color: var(--text-muted);
                  line-height: 1.55;
                  margin-bottom: 1.5rem;
                  flex-grow: 1;
                }
                .card-footer {
                  display: flex;
                  align-items: center;
                  padding-top: 1rem;
                  border-top: 1px solid rgba(51, 65, 85, 0.4);
                }
                .card-link {
                  font-size: 0.875rem;
                  font-weight: 600;
                  color: var(--accent);
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  transition: gap 0.2s ease;
                }
                .card:hover .card-link {
                  gap: 0.65rem;
                }

                /* 頁尾 */
                footer {
                  margin-top: 4rem;
                  text-align: center;
                  color: #475569;
                  font-size: 0.85rem;
                }
              </style>
            </head>
            <body>
              <div class="container">
                <!-- 導覽列雙語切換 -->
                <div class="navbar">
                  <button class="lang-toggle" onclick="toggleLanguage()" id="lang-btn">
                    <i class="fa-solid fa-globe"></i> <span>EN</span>
                  </button>
                </div>

                <header>
                  <div class="hero-pill">
                    <i class="fa-solid fa-bolt"></i> <span data-i18n="badge">互動原型實驗庫</span>
                  </div>
                  <h1 data-i18n="title">單頁式作品集中心</h1>
                  <p class="subtitle" data-i18n="subtitle">收錄了 ${projects.length} 個獨立前端互動實驗與展示原型</p>
                  
                  <!-- 聯絡資訊區塊 -->
                  <div class="contact-info">
                    <button onclick="copyEmail()" id="email-btn" class="contact-link">
                      <i class="fa-regular fa-envelope"></i> <span>leoleo168@gmail.com</span>
                    </button>
                    <a href="https://is.gd/leoleo168" target="_blank" rel="noopener noreferrer" class="contact-link">
                      <i class="fa-solid fa-arrow-up-right-from-square"></i> <span data-i18n="shortLink">專屬短網址</span>
                    </a>
                  </div>
                </header>
                
                ${filterHtml}

                <main class="grid">${cardsHtml}</main>

                <footer>
                  <p data-i18n="footerText">持續建造更多有趣的原型與互動 🚀</p>
                </footer>
              </div>

              <script>
                // 雙語文字字典
                const i18n = {
                  "zh-TW": {
                    badge: "互動原型實驗庫",
                    title: "單頁式作品集中心",
                    subtitle: "收錄了 ${projects.length} 個獨立前端互動實驗與展示原型",
                    shortLink: "專屬短網址",
                    filterAll: "全部作品",
                    viewProject: "立即探索",
                    copied: "已複製信箱！",
                    footerText: "持續建造更多有趣的原型與互動 🚀"
                  },
                  "en": {
                    badge: "Interactive Prototype Hub",
                    title: "Single Page Lab",
                    subtitle: "A collection of ${projects.length} standalone web experiments & prototypes",
                    shortLink: "Shortlink",
                    filterAll: "All Projects",
                    viewProject: "Explore",
                    copied: "Copied!",
                    footerText: "Building interactive web experiences continuously 🚀"
                  }
                };

                let currentLang = "zh-TW";

                function toggleLanguage() {
                  currentLang = currentLang === "zh-TW" ? "en" : "zh-TW";
                  document.documentElement.lang = currentLang;
                  document.getElementById("lang-btn").innerHTML = currentLang === "zh-TW" 
                    ? \x27<i class="fa-solid fa-globe"></i> <span>EN</span>\x27 
                    : \x27<i class="fa-solid fa-globe"></i> <span>中文</span>\x27;

                  document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    if (i18n[currentLang] && i18n[currentLang][key]) {
                      el.textContent = i18n[currentLang][key];
                    }
                  });
                }

                // 複製信箱功能
                function copyEmail() {
                  navigator.clipboard.writeText("leoleo168@gmail.com").then(() => {
                    const btn = document.getElementById("email-btn");
                    const originalHtml = btn.innerHTML;
                    const text = i18n[currentLang].copied;
                    btn.innerHTML = \`<i class="fa-solid fa-check"></i> <span>\${text}</span>\`;
                    setTimeout(() => {
                      btn.innerHTML = originalHtml;
                    }, 2000);
                  }).catch(err => {
                    console.error("複製失敗", err);
                  });
                }

                // 分類篩選功能
                document.addEventListener("DOMContentLoaded", () => {
                  const filterBtns = document.querySelectorAll(".filter-btn");
                  const cards = document.querySelectorAll(".card");

                  filterBtns.forEach(btn => {
                    btn.addEventListener("click", () => {
                      filterBtns.forEach(b => b.classList.remove("active"));
                      btn.classList.add("active");

                      const filterValue = btn.getAttribute("data-filter");

                      cards.forEach(card => {
                        if (filterValue === "all") {
                          card.classList.remove("hidden");
                        } else {
                          const tags = card.getAttribute("data-tags").split(",");
                          if (tags.includes(filterValue)) {
                            card.classList.remove("hidden");
                          } else {
                            card.classList.add("hidden");
                          }
                        }
                      });
                    });
                  });
                });
              </script>
            </body>
            </html>`;

            fs.writeFileSync("index.html", fullHtml);
            console.log("首頁 index.html 生成成功！共掃描到 " + projects.length + " 個專案。");
          '

      # 設定 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上傳全站靜態資源
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 正式部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
