name: Deploy Auto-Generated Hub to GitHub Pages

on:
  push:
    branches: ["main"] # 如果你的主分支是 master，請改成 master
  workflow_dispatch:   # 允許手動在 GitHub 後台觸發

# 設定部署權限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 完整獲取歷史紀錄以取得精準的最後修改日期

      # 使用 Node.js 掃描所有資料夾並產生支援排序與管理的首頁 index.html
      - name: Build Index Page
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const { execSync } = require("child_process");

            // 1. 取得所有包含 index.html 的子資料夾
            const directories = fs.readdirSync(".", { withFileTypes: true })
              .filter(d => d.isDirectory() && !d.name.startsWith("."))
              .filter(d => fs.existsSync(path.join(d.name, "index.html")));

            // 2. 整理專案資料（含日期萃取）
            const projects = directories.map(dir => {
              const folderName = dir.name;
              
              // 自動取得 Git 最後修改日期
              let gitDate = "";
              try {
                gitDate = execSync(`git log -1 --format="%cd" --date=short -- "${folderName}"`).toString().trim();
              } catch (e) {
                gitDate = "";
              }

              let meta = {
                title: folderName.replace(/[-_]/g, " "),
                description: "點擊進入查看互動效果。",
                tags: ["Web"],
                date: gitDate || new Date().toISOString().slice(0, 10)
              };

              const metaFile = path.join(folderName, "meta.json");
              let rawMeta = {};
              if (fs.existsSync(metaFile)) {
                try {
                  rawMeta = JSON.parse(fs.readFileSync(metaFile, "utf8"));
                  meta = { ...meta, ...rawMeta };
                  // 若 meta.json 沒提供 date，補上 Git 取得的日期
                  if (!meta.date) meta.date = gitDate;
                } catch (e) {
                  console.error("解析 meta.json 失敗:", metaFile);
                }
              }

              const hasPreview = fs.existsSync(path.join(folderName, "preview.png"));
              const previewImg = hasPreview ? `./${folderName}/preview.png` : "";

              return { ...meta, folder: folderName, previewImg, rawMeta };
            });

            // 2.5 收集所有不重複的 TAG
            const allTags = new Set();
            projects.forEach(p => {
              if (p.tags && Array.isArray(p.tags)) {
                p.tags.forEach(t => allTags.add(t));
              }
            });
            const uniqueTags = Array.from(allTags).sort();

            // 生成卡片 HTML
            const cardsHtml = projects.map(p => `
              <div class="card" data-folder="${p.folder}" data-title="${p.title}" data-date="${p.date}" data-tags="${(p.tags || []).join(",")}">
                <a href="./${p.folder}/" class="card-link-wrapper" target="_blank" rel="noopener noreferrer">
                  <div class="card-img-wrapper">
                    ${p.previewImg ? `<div class="card-img" style="background-image: url(\x27${p.previewImg}\x27);"></div>` : `<div class="card-placeholder"><i class="fa-solid fa-compass-drafting"></i></div>`}
                    <div class="card-badge"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                  </div>
                  <div class="card-content">
                    <div class="tags" id="tags-${p.folder}">
                      ${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join("")}
                    </div>
                    <h2 class="card-title">${p.title}</h2>
                    <p class="card-desc">${p.description}</p>
                    <div class="card-footer">
                      <span class="card-date"><i class="fa-regular fa-calendar"></i> ${p.date || "近期"}</span>
                      <span class="card-link"><span data-i18n="viewProject">進入體驗</span> <i class="fa-solid fa-arrow-right"></i></span>
                    </div>
                  </div>
                </a>
                <button class="edit-tag-btn" onclick="openTagModal(\x27${p.folder}\x27)">
                  <i class="fa-solid fa-pen-to-square"></i> 編輯 TAG
                </button>
              </div>
            `).join("\n");

            // 4. 生成 index.html
            const fullHtml = `<!DOCTYPE html>
            <html lang="zh-TW">
            <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>我的單頁實驗室</title>
              
              <link rel="preconnect" href="https://fonts.googleapis.com">
              <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
              <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
              <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

              <style>
                :root {
                  --bg-main: #0b1120;
                  --bg-card: rgba(30, 41, 59, 0.7);
                  --border-color: rgba(51, 65, 85, 0.6);
                  --accent: #38bdf8;
                  --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #06b6d4 100%);
                  --text-main: #f8fafc;
                  --text-muted: #94a3b8;
                }

                * { box-sizing: border-box; margin: 0; padding: 0; }
                
                body {
                  font-family: "Plus Jakarta Sans", "Noto Sans TC", system-ui, sans-serif;
                  background-color: var(--bg-main);
                  color: var(--text-main);
                  min-height: 100vh;
                  padding: 2.5rem 1.5rem 4rem;
                  background-image: 
                    radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                    radial-gradient(at 100% 100%, rgba(6, 182, 212, 0.08) 0px, transparent 50%);
                  background-attachment: fixed;
                }

                .container { max-width: 1240px; margin: 0 auto; }

                /* 頂部導覽列 */
                .navbar {
                  display: flex;
                  justify-content: flex-end;
                  gap: 0.75rem;
                  margin-bottom: 2rem;
                }
                .nav-btn {
                  background: rgba(30, 41, 59, 0.8);
                  border: 1px solid var(--border-color);
                  color: var(--text-muted);
                  padding: 0.45rem 1rem;
                  border-radius: 9999px;
                  cursor: pointer;
                  font-size: 0.85rem;
                  font-weight: 600;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  transition: all 0.25s ease;
                  backdrop-filter: blur(8px);
                  font-family: inherit;
                }
                .nav-btn:hover, .nav-btn.active {
                  color: var(--accent);
                  border-color: var(--accent);
                  box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
                }

                /* Hero 標題區 */
                header { margin-bottom: 2.5rem; text-align: center; }
                h1 {
                  font-size: clamp(2.2rem, 5vw, 3.2rem);
                  font-weight: 800;
                  letter-spacing: -0.03em;
                  margin-bottom: 0.75rem;
                  display: inline-flex;
                  align-items: center;
                  justify-content: center;
                  gap: 0.5rem;
                }
                .title-gradient-text {
                  background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
                  -webkit-background-clip: text;
                  -webkit-text-fill-color: transparent;
                }
                .sparkle-icon {
                  color: #facc15;
                  font-size: 0.85em;
                  filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.6));
                  -webkit-text-fill-color: initial;
                }
                .subtitle { color: var(--text-muted); font-size: 1.1rem; max-width: 600px; margin: 0 auto; }

                /* 聯絡資訊標籤 */
                .contact-info {
                  display: flex;
                  justify-content: center;
                  gap: 0.85rem;
                  margin-top: 1.5rem;
                  flex-wrap: wrap;
                }
                .contact-link {
                  color: var(--text-muted);
                  text-decoration: none;
                  display: flex;
                  align-items: center;
                  gap: 0.5rem;
                  font-size: 0.875rem;
                  font-weight: 600;
                  background: var(--bg-card);
                  padding: 0.45rem 1.1rem;
                  border-radius: 9999px;
                  border: 1px solid var(--border-color);
                  transition: all 0.25s ease;
                  cursor: pointer;
                  backdrop-filter: blur(8px);
                  font-family: inherit;
                }
                .contact-link:hover {
                  color: #fff;
                  border-color: var(--accent);
                  background: rgba(30, 41, 59, 1);
                  transform: translateY(-2px);
                }

                /* 控制列（篩選 + 排序） */
                .toolbar-container {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  gap: 1.25rem;
                  margin-bottom: 2.5rem;
                  flex-wrap: wrap;
                }
                .filter-container {
                  display: flex;
                  gap: 0.5rem;
                  flex-wrap: wrap;
                }
                .filter-btn {
                  background: var(--bg-card);
                  color: var(--text-muted);
                  border: 1px solid var(--border-color);
                  padding: 0.45rem 1rem;
                  border-radius: 9999px;
                  cursor: pointer;
                  font-size: 0.875rem;
                  font-weight: 600;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                  transition: all 0.2s ease;
                  backdrop-filter: blur(8px);
                }
                .filter-btn:hover { color: #fff; border-color: #64748b; }
                .filter-btn.active {
                  background: var(--accent-gradient);
                  color: #0b1120;
                  border-color: transparent;
                  box-shadow: 0 0 16px rgba(56, 189, 248, 0.35);
                }

                /* 排序選單 */
                .sort-wrapper {
                  display: inline-flex;
                  align-items: center;
                  gap: 0.5rem;
                  background: var(--bg-card);
                  border: 1px solid var(--border-color);
                  padding: 0.35rem 0.85rem;
                  border-radius: 9999px;
                  backdrop-filter: blur(8px);
                  color: var(--text-muted);
                  font-size: 0.85rem;
                  font-weight: 600;
                }
                .sort-select {
                  background: transparent;
                  border: none;
                  color: var(--accent);
                  font-size: 0.85rem;
                  font-weight: 700;
                  cursor: pointer;
                  outline: none;
                  font-family: inherit;
                }
                .sort-select option {
                  background: #1e293b;
                  color: #f8fafc;
                }

                /* 作品卡片網格 */
                .grid {
                  display: grid;
                  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
                  gap: 2rem;
                }
                .card {
                  background: var(--bg-card);
                  border-radius: 20px;
                  overflow: hidden;
                  border: 1px solid var(--border-color);
                  display: flex;
                  flex-direction: column;
                  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                  backdrop-filter: blur(12px);
                  position: relative;
                }
                .card.hidden { display: none; }
                .card:hover {
                  transform: translateY(-6px);
                  border-color: rgba(56, 189, 248, 0.6);
                  box-shadow: 0 16px 32px -10px rgba(56, 189, 248, 0.25);
                }
                .card-link-wrapper {
                  text-decoration: none;
                  color: inherit;
                  display: flex;
                  flex-direction: column;
                  flex-grow: 1;
                }
                
                .card-img-wrapper {
                  position: relative;
                  overflow: hidden;
                  width: 100%;
                  height: 180px;
                  background: #131d31;
                  border-bottom: 1px solid var(--border-color);
                }
                .card-img {
                  width: 100%;
                  height: 100%;
                  background-size: cover;
                  background-position: center;
                  transition: transform 0.4s ease;
                }
                .card:hover .card-img { transform: scale(1.05); }
                .card-placeholder {
                  width: 100%;
                  height: 100%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 2.8rem;
                  color: #334155;
                  background: linear-gradient(135deg, #131d31 0%, #1e293b 100%);
                }
                .card-badge {
                  position: absolute;
                  top: 0.75rem;
                  right: 0.75rem;
                  width: 32px;
                  height: 32px;
                  background: rgba(15, 23, 42, 0.85);
                  border: 1px solid var(--border-color);
                  border-radius: 50%;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 0.75rem;
                  color: var(--accent);
                  backdrop-filter: blur(4px);
                }
                .card-content { padding: 1.5rem; display: flex; flex-direction: column; flex-grow: 1; }
                .tags { display: flex; gap: 0.4rem; margin-bottom: 0.75rem; flex-wrap: wrap; }
                .tag {
                  font-size: 0.725rem;
                  background: rgba(56, 189, 248, 0.1);
                  color: var(--accent);
                  border: 1px solid rgba(56, 189, 248, 0.2);
                  padding: 0.2rem 0.55rem;
                  border-radius: 9999px;
                  font-weight: 600;
                }
                .card-title { font-size: 1.25rem; font-weight: 700; color: #f8fafc; margin-bottom: 0.5rem; }
                .card-desc { font-size: 0.925rem; color: var(--text-muted); line-height: 1.55; margin-bottom: 1.5rem; flex-grow: 1; }
                
                .card-footer {
                  display: flex;
                  align-items: center;
                  justify-content: space-between;
                  padding-top: 1rem;
                  border-top: 1px solid rgba(51, 65, 85, 0.4);
                }
                .card-date {
                  font-size: 0.8rem;
                  color: #64748b;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.35rem;
                }
                .card-link { font-size: 0.875rem; font-weight: 600; color: var(--accent); display: inline-flex; align-items: center; gap: 0.4rem; }

                /* 管理模式下的卡片編輯按鈕 */
                .edit-tag-btn {
                  display: none;
                  background: #0284c7;
                  color: #fff;
                  border: none;
                  padding: 0.6rem;
                  font-size: 0.85rem;
                  font-weight: 700;
                  cursor: pointer;
                  transition: background 0.2s;
                  font-family: inherit;
                }
                .edit-tag-btn:hover { background: #0369a1; }
                body.admin-mode .edit-tag-btn { display: block; }

                /* Modal 樣式 */
                .modal-backdrop {
                  position: fixed;
                  top: 0; left: 0; width: 100vw; height: 100vh;
                  background: rgba(11, 17, 32, 0.85);
                  backdrop-filter: blur(8px);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  z-index: 999;
                  opacity: 0;
                  pointer-events: none;
                  transition: opacity 0.25s ease;
                }
                .modal-backdrop.active { opacity: 1; pointer-events: auto; }
                .modal-box {
                  background: #1e293b;
                  border: 1px solid var(--border-color);
                  border-radius: 20px;
                  max-width: 520px;
                  width: 90%;
                  padding: 2rem;
                  box-shadow: 0 20px 40px rgba(0,0,0,0.5);
                }
                .modal-title { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 0.5rem; }
                .modal-desc { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.25rem; }
                .tag-input-group { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
                .tag-input {
                  flex: 1;
                  background: #0f172a;
                  border: 1px solid var(--border-color);
                  padding: 0.6rem 1rem;
                  border-radius: 10px;
                  color: #fff;
                  font-size: 0.9rem;
                  outline: none;
                }
                .tag-input:focus { border-color: var(--accent); }
                .btn-add-tag {
                  background: var(--accent);
                  color: #0b1120;
                  border: none;
                  padding: 0.6rem 1.2rem;
                  border-radius: 10px;
                  font-weight: 700;
                  cursor: pointer;
                }
                .modal-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; min-height: 40px; }
                .modal-tag-chip {
                  background: #334155;
                  color: #38bdf8;
                  padding: 0.35rem 0.75rem;
                  border-radius: 9999px;
                  font-size: 0.8rem;
                  display: inline-flex;
                  align-items: center;
                  gap: 0.4rem;
                }
                .modal-tag-chip i { cursor: pointer; color: #94a3b8; }
                .modal-tag-chip i:hover { color: #ef4444; }
                .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
                .btn-modal-cancel {
                  background: transparent;
                  border: 1px solid var(--border-color);
                  color: var(--text-muted);
                  padding: 0.5rem 1rem;
                  border-radius: 10px;
                  cursor: pointer;
                  font-weight: 600;
                }
                .btn-modal-save {
                  background: var(--accent-gradient);
                  color: #0b1120;
                  border: none;
                  padding: 0.5rem 1.25rem;
                  border-radius: 10px;
                  cursor: pointer;
                  font-weight: 700;
                }
              </style>
            </head>
            <body>
              <div class="container">
                <!-- 導覽列 -->
                <div class="navbar">
                  <button class="nav-btn" onclick="toggleAdminMode()" id="admin-btn">
                    <i class="fa-solid fa-tags"></i> <span id="admin-btn-text">管理標籤</span>
                  </button>
                  <button class="nav-btn" onclick="toggleLanguage()" id="lang-btn">
                    <i class="fa-solid fa-globe"></i> <span>EN</span>
                  </button>
                </div>

                <header>
                  <h1>
                    <span class="title-gradient-text" data-i18n="title">我的單頁實驗室</span>
                    <i class="fa-solid fa-wand-magic-sparkles sparkle-icon"></i>
                  </h1>
                  <p class="subtitle" data-i18n="subtitle">共收錄 ${projects.length} 個單頁式互動作品</p>
                  
                  <div class="contact-info">
                    <button onclick="copyEmail()" id="email-btn" class="contact-link">
                      <i class="fa-regular fa-envelope"></i> <span>leoleo168@gmail.com</span>
                    </button>
                    <a href="https://is.gd/leoleo168" target="_blank" rel="noopener noreferrer" class="contact-link">
                      <i class="fa-solid fa-link"></i> <span>https://is.gd/leoleo168</span>
                    </a>
                  </div>
                </header>
                
                <!-- 工具列：標籤篩選 + 排序選單 -->
                <div class="toolbar-container">
                  <div class="filter-container" id="filter-bar">
                    <button class="filter-btn active" data-filter="all">
                      <i class="fa-solid fa-layer-group"></i> <span data-i18n="filterAll">全部作品</span>
                    </button>
                    ${uniqueTags.map(t => `
                      <button class="filter-btn" data-filter="${t}">
                        <span>${t}</span>
                      </button>
                    `).join("")}
                  </div>

                  <div class="sort-wrapper">
                    <i class="fa-solid fa-arrow-down-short-wide"></i>
                    <span data-i18n="sortBy">排序：</span>
                    <select id="sort-select" class="sort-select" onchange="applySorting()">
                      <option value="date-desc">📅 最新修改</option>
                      <option value="date-asc">🕒 最早建立</option>
                      <option value="name-asc">🔤 名稱 (A → Z)</option>
                      <option value="name-desc">🔤 名稱 (Z → A)</option>
                    </select>
                  </div>
                </div>

                <main class="grid" id="projects-grid">${cardsHtml}</main>

                <footer style="margin-top: 4rem; text-align: center; color: #475569; font-size: 0.85rem;">
                  <p data-i18n="footerText">持續建造更多有趣的原型與互動 🚀</p>
                </footer>
              </div>

              <!-- 編輯 TAG 彈出視窗 -->
              <div class="modal-backdrop" id="tag-modal">
                <div class="modal-box">
                  <h3 class="modal-title" id="modal-project-title">調整標籤</h3>
                  <p class="modal-desc">新增或移除此作品的 TAG，儲存後可一鍵同步到 GitHub 的 meta.json。</p>
                  
                  <div class="tag-input-group">
                    <input type="text" id="new-tag-input" class="tag-input" placeholder="輸入標籤名稱..." onkeydown="if(event.key===\x27Enter\x27) addTagFromInput()">
                    <button class="btn-add-tag" onclick="addTagFromInput()">新增</button>
                  </div>

                  <div class="modal-tags" id="modal-tags-container"></div>

                  <div class="modal-actions">
                    <button class="btn-modal-cancel" onclick="closeTagModal()">取消</button>
                    <button class="btn-modal-save" onclick="saveTagChanges()">完成並同步到 GitHub</button>
                  </div>
                </div>
              </div>

              <script>
                const projectsData = ${JSON.stringify(projects.map(p => ({
                  folder: p.folder,
                  title: p.title,
                  tags: p.tags || [],
                  date: p.date || "",
                  rawMeta: p.rawMeta || {}
                })))};

                let activeFolder = null;
                let tempTags = [];

                // 排序功能
                function applySorting() {
                  const sortValue = document.getElementById("sort-select").value;
                  const grid = document.getElementById("projects-grid");
                  const cards = Array.from(grid.querySelectorAll(".card"));

                  cards.sort((a, b) => {
                    const titleA = a.getAttribute("data-title") || "";
                    const titleB = b.getAttribute("data-title") || "";
                    const dateA = a.getAttribute("data-date") || "";
                    const dateB = b.getAttribute("data-date") || "";

                    if (sortValue === "date-desc") {
                      return dateB.localeCompare(dateA); // 新 -> 舊
                    } else if (sortValue === "date-asc") {
                      return dateA.localeCompare(dateB); // 舊 -> 新
                    } else if (sortValue === "name-asc") {
                      return titleA.localeCompare(titleB, "zh-Hant"); // A -> Z
                    } else if (sortValue === "name-desc") {
                      return titleB.localeCompare(titleA, "zh-Hant"); // Z -> A
                    }
                    return 0;
                  });

                  // 重新插入卡片順序
                  cards.forEach(card => grid.appendChild(card));
                }

                // 管理模式開關
                function toggleAdminMode() {
                  document.body.classList.toggle("admin-mode");
                  const isActive = document.body.classList.contains("admin-mode");
                  const btn = document.getElementById("admin-btn");
                  const text = document.getElementById("admin-btn-text");
                  if (isActive) {
                    btn.classList.add("active");
                    text.textContent = "退出管理";
                  } else {
                    btn.classList.remove("active");
                    text.textContent = "管理標籤";
                  }
                }

                // 開啟編輯 Modal
                function openTagModal(folder) {
                  activeFolder = folder;
                  const project = projectsData.find(p => p.folder === folder);
                  if (!project) return;

                  tempTags = [...project.tags];
                  document.getElementById("modal-project-title").textContent = "調整「" + project.title + "」的標籤";
                  renderModalTags();
                  document.getElementById("tag-modal").classList.add("active");
                }

                function closeTagModal() {
                  document.getElementById("tag-modal").classList.remove("active");
                }

                function renderModalTags() {
                  const container = document.getElementById("modal-tags-container");
                  container.innerHTML = tempTags.map((t, idx) => \`
                    <span class="modal-tag-chip">
                      \${t} <i class="fa-solid fa-xmark" onclick="removeTag(\${idx})"></i>
                    </span>
                  \`).join("");
                }

                function addTagFromInput() {
                  const input = document.getElementById("new-tag-input");
                  const val = input.value.trim();
                  if (val && !tempTags.includes(val)) {
                    tempTags.push(val);
                    renderModalTags();
                  }
                  input.value = "";
                }

                function removeTag(index) {
                  tempTags.splice(index, 1);
                  renderModalTags();
                }

                function saveTagChanges() {
                  const project = projectsData.find(p => p.folder === activeFolder);
                  if (!project) return;

                  project.tags = [...tempTags];

                  const card = document.querySelector(\`.card[data-folder="\${activeFolder}"]\`);
                  if (card) {
                    card.setAttribute("data-tags", tempTags.join(","));
                    const tagsContainer = document.getElementById("tags-" + activeFolder);
                    if (tagsContainer) {
                      tagsContainer.innerHTML = tempTags.map(t => \`<span class="tag">\${t}</span>\`).join("");
                    }
                  }

                  refreshFilterBar();

                  const updatedMeta = { ...project.rawMeta, tags: tempTags };
                  const jsonStr = JSON.stringify(updatedMeta, null, 2);

                  navigator.clipboard.writeText(jsonStr).then(() => {
                    closeTagModal();
                    
                    const host = window.location.hostname;
                    const path = window.location.pathname.split("/").filter(Boolean);
                    
                    if (host.includes("github.io") && path.length > 0) {
                      const user = host.split(".")[0];
                      const repo = path[0];
                      const githubEditUrl = \`https://github.com/\${user}/\${repo}/edit/main/\${activeFolder}/meta.json\`;
                      
                      const go = confirm(
                        "✅ 畫面已即時更新！\\n\\n新的 meta.json 內容已幫你【複製到剪貼簿】。\\n\\n是否立刻開啟 GitHub 頁面貼上並儲存？"
                      );
                      if (go) {
                        window.open(githubEditUrl, "_blank");
                      }
                    } else {
                      alert("✅ 畫面已即時更新！\\n\\n新的 meta.json 已複製到剪貼簿，請將它貼回 " + activeFolder + "/meta.json 中。");
                    }
                  });
                }

                function refreshFilterBar() {
                  const allTags = new Set();
                  projectsData.forEach(p => p.tags.forEach(t => allTags.add(t)));
                  const sortedTags = Array.from(allTags).sort();

                  const bar = document.getElementById("filter-bar");
                  bar.innerHTML = \`
                    <button class="filter-btn active" data-filter="all">
                      <i class="fa-solid fa-layer-group"></i> <span>全部作品</span>
                    </button>
                    \${sortedTags.map(t => \`
                      <button class="filter-btn" data-filter="\${t}">
                        <span>\${t}</span>
                      </button>
                    \`).join("")}
                  \`;
                  bindFilterEvents();
                }

                function bindFilterEvents() {
                  const filterBtns = document.querySelectorAll(".filter-btn");
                  const cards = document.querySelectorAll(".card");

                  filterBtns.forEach(btn => {
                    btn.addEventListener("click", () => {
                      filterBtns.forEach(b => b.classList.remove("active"));
                      btn.classList.add("active");

                      const filterValue = btn.getAttribute("data-filter");

                      cards.forEach(card => {
                        if (filterValue === "all") {
                          card.classList.remove("hidden");
                        } else {
                          const tags = (card.getAttribute("data-tags") || "").split(",");
                          if (tags.includes(filterValue)) {
                            card.classList.remove("hidden");
                          } else {
                            card.classList.add("hidden");
                          }
                        }
                      });
                    });
                  });
                }

                const i18n = {
                  "zh-TW": {
                    title: "我的單頁實驗室",
                    subtitle: "共收錄 ${projects.length} 個單頁式互動作品",
                    filterAll: "全部作品",
                    sortBy: "排序：",
                    viewProject: "進入體驗",
                    copied: "已複製信箱！",
                    footerText: "持續建造更多有趣的原型與互動 🚀",
                    sortOpts: ["📅 最新修改", "🕒 最早建立", "🔤 名稱 (A → Z)", "🔤 名稱 (Z → A)"]
                  },
                  "en": {
                    title: "My Single Page Lab",
                    subtitle: "A collection of ${projects.length} standalone web experiments",
                    filterAll: "All Projects",
                    sortBy: "Sort by:",
                    viewProject: "Explore",
                    copied: "Copied!",
                    footerText: "Building interactive web experiences continuously 🚀",
                    sortOpts: ["📅 Recently Updated", "🕒 Oldest First", "🔤 Name (A → Z)", "🔤 Name (Z → A)"]
                  }
                };

                let currentLang = "zh-TW";

                function toggleLanguage() {
                  currentLang = currentLang === "zh-TW" ? "en" : "zh-TW";
                  document.documentElement.lang = currentLang;
                  document.getElementById("lang-btn").innerHTML = currentLang === "zh-TW" 
                    ? \x27<i class="fa-solid fa-globe"></i> <span>EN</span>\x27 
                    : \x27<i class="fa-solid fa-globe"></i> <span>中文</span>\x27;

                  document.querySelectorAll("[data-i18n]").forEach(el => {
                    const key = el.getAttribute("data-i18n");
                    if (i18n[currentLang] && i18n[currentLang][key]) {
                      el.textContent = i18n[currentLang][key];
                    }
                  });

                  // 更新排序選單的文字
                  const select = document.getElementById("sort-select");
                  const opts = i18n[currentLang].sortOpts;
                  for (let i = 0; i < select.options.length; i++) {
                    select.options[i].text = opts[i];
                  }
                }

                function copyEmail() {
                  navigator.clipboard.writeText("leoleo168@gmail.com").then(() => {
                    const btn = document.getElementById("email-btn");
                    const originalHtml = btn.innerHTML;
                    const text = i18n[currentLang].copied;
                    btn.innerHTML = \`<i class="fa-solid fa-check"></i> <span>\${text}</span>\`;
                    setTimeout(() => { btn.innerHTML = originalHtml; }, 2000);
                  }).catch(err => { console.error("複製失敗", err); });
                }

                document.addEventListener("DOMContentLoaded", () => {
                  bindFilterEvents();
                  applySorting(); // 預設依最新修改排序
                });
              </script>
            </body>
            </html>`;

            fs.writeFileSync("index.html", fullHtml);
            console.log("首頁 index.html 生成成功！共掃描到 " + projects.length + " 個專案。");
          '

      # 設定 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 上傳全站靜態資源
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 正式部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
