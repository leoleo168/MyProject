<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STL 縫隙檢查器 | STL Gap Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ========== 基本樣式（想換顏色改這裡）========== */
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#334155; --text:#f1f5f9; --sub:#94a3b8;
  --accent:#38bdf8; --danger:#f87171; --warn:#fbbf24; --ok:#4ade80;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
/* 導覽列 */
nav{position:sticky;top:0;z-index:50;background:rgba(15,23,42,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--card)}
nav .wrap{display:flex;justify-content:space-between;align-items:center;height:60px}
.logo{font-weight:700;font-size:1.1rem}.logo i{color:var(--accent);margin-right:8px}
.btn{background:var(--card);color:var(--text);border:1px solid var(--card2);padding:8px 16px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:.9rem;transition:.2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:#0f172a;border-color:var(--accent);font-weight:700}
.btn.primary:hover{color:#0f172a;filter:brightness(1.1)}
/* Hero */
.hero{text-align:center;padding:50px 0 30px}
.hero h1{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:10px}
.hero h1 span{color:var(--accent)}
.hero p{color:var(--sub);max-width:680px;margin:0 auto}
/* 卡片 */
.card{background:var(--card);border-radius:16px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,.3);margin-bottom:20px}
.card h2{font-size:1.1rem;margin-bottom:14px}.card h2 i{color:var(--accent);margin-right:8px}
/* 上傳區 */
#drop{border:2px dashed var(--card2);border-radius:16px;padding:40px 20px;text-align:center;cursor:pointer;transition:.2s}
#drop:hover,#drop.over{border-color:var(--accent);background:rgba(56,189,248,.06)}
#drop i{font-size:2.5rem;color:var(--accent);margin-bottom:10px}
#drop small{color:var(--sub)}
/* 設定 */
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.settings label{display:block;font-size:.9rem;color:var(--sub);margin-bottom:4px}
.settings input{width:100%;background:var(--bg);border:1px solid var(--card2);color:var(--text);padding:8px 10px;border-radius:8px;font-family:inherit}
.settings input:focus{outline:none;border-color:var(--accent)}
.settings small{color:var(--sub);font-size:.78rem}
.row-btns{margin-top:16px;display:flex;gap:10px;flex-wrap:wrap}
/* 進度 */
#progress{display:none;margin-top:16px}
.bar{height:8px;background:var(--bg);border-radius:8px;overflow:hidden}
.bar div{height:100%;width:0;background:var(--accent);transition:width .15s}
#pText{font-size:.85rem;color:var(--sub);margin-top:6px}
/* 批次清單表格 */
#queueCard{display:none}
.qhead{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.qhead h2{margin:0}
.tblwrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:600px}
th{color:var(--sub);font-weight:500;text-align:left;padding:8px;border-bottom:1px solid var(--card2)}
td{padding:9px 8px;border-bottom:1px solid var(--card2)}
tr.qrow{cursor:pointer;transition:.15s}
tr.qrow:hover{background:#16213a}
tr.qrow.sel{background:rgba(56,189,248,.12)}
.fname{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;padding:1px 10px;border-radius:20px;font-size:.78rem}
.pill.bad{background:rgba(248,113,113,.15);color:var(--danger)}
.pill.warn{background:rgba(251,191,36,.15);color:var(--warn)}
.pill.ok{background:rgba(74,222,128,.15);color:var(--ok)}
.pill.wait{background:var(--card2);color:var(--sub)}
.pill.run{background:rgba(56,189,248,.15);color:var(--accent)}
.xbtn{background:none;border:none;color:var(--sub);cursor:pointer;font-size:1rem}
.xbtn:hover{color:var(--danger)}
/* 結果 */
#results{display:none}
#curName{color:var(--accent);font-size:1rem;margin-bottom:10px;word-break:break-all}
.verdict{display:flex;align-items:center;gap:14px;padding:18px;border-radius:14px;margin-bottom:16px;font-weight:700;font-size:1.1rem}
.verdict i{font-size:1.8rem}
.verdict.bad{background:rgba(248,113,113,.15);color:var(--danger);border:1px solid var(--danger)}
.verdict.warn{background:rgba(251,191,36,.12);color:var(--warn);border:1px solid var(--warn)}
.verdict.ok{background:rgba(74,222,128,.12);color:var(--ok);border:1px solid var(--ok)}
.verdict small{display:block;font-weight:400;color:var(--text);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--card);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.stat span{font-size:.8rem;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
@media(max-width:850px){.grid2{grid-template-columns:1fr}}
#viewer{width:100%;height:440px;border-radius:12px;background:#0b1222;overflow:hidden;position:relative}
#viewer canvas{display:block}
.legend{font-size:.82rem;color:var(--sub);margin-top:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px}
#list{max-height:440px;overflow:auto}
.item{background:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--danger);transition:.2s;font-size:.88rem}
.item:hover{transform:translateX(3px);background:#16213a}
.item.wall{border-left-color:var(--warn)}
.item b{display:block}
.item span{color:var(--sub);font-size:.8rem}
.tag{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:20px;background:var(--card2);margin-right:4px}
.shell{font-size:.85rem;padding:6px 0;border-bottom:1px solid var(--card2);color:var(--sub);cursor:pointer}
.shell:hover{color:var(--text)}
ul.tips{padding-left:20px;color:var(--sub);font-size:.9rem}
ul.tips li{margin-bottom:6px}
footer{text-align:center;color:var(--sub);font-size:.85rem;padding:30px 0}
</style>
</head>
<body>

<!-- ① 導覽列 -->
<nav><div class="wrap">
  <div class="logo"><i class="fa-solid fa-cube"></i><span data-i18n="logo"></span></div>
  <button class="btn" id="langBtn">EN</button>
</div></nav>

<div class="wrap">
  <!-- ② Hero -->
  <section class="hero">
    <h1><span data-i18n="h1a"></span><br><span style="color:var(--text)" data-i18n="h1b"></span></h1>
    <p data-i18n="sub"></p>
  </section>

  <!-- ③ 上傳區（可多選 / 多檔拖曳）-->
  <div class="card">
    <div id="drop">
      <i class="fa-solid fa-cloud-arrow-up"></i>
      <p><b data-i18n="drop"></b></p>
      <small data-i18n="dropSub"></small>
      <input type="file" id="file" accept=".stl" multiple hidden>
    </div>
  </div>

  <!-- ④ 檢查參數 -->
  <div class="card">
    <h2><i class="fa-solid fa-sliders"></i><span data-i18n="setTitle"></span></h2>
    <div class="settings">
      <div><label data-i18n="gapLabel"></label><input type="number" id="gapThr" value="0.3" step="0.05" min="0.01"><small data-i18n="gapHint"></small></div>
      <div><label data-i18n="wallLabel"></label><input type="number" id="wallThr" value="0.4" step="0.05" min="0.01"><small data-i18n="wallHint"></small></div>
      <div><label data-i18n="sampleLabel"></label><input type="number" id="maxRays" value="60000" step="10000" min="5000"><small data-i18n="sampleHint"></small></div>
    </div>
    <div class="row-btns"><button class="btn primary" id="rerun" disabled><i class="fa-solid fa-rotate"></i> <span data-i18n="rerun"></span></button></div>
    <div id="progress"><div class="bar"><div id="bar"></div></div><div id="pText"></div></div>
  </div>

  <!-- ⑤ 批次總表 -->
  <div class="card" id="queueCard">
    <div class="qhead">
      <h2><i class="fa-solid fa-table-list"></i><span data-i18n="queueTitle"></span></h2>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="csvBtn"><i class="fa-solid fa-file-csv"></i> <span data-i18n="csv"></span></button>
        <button class="btn" id="clearBtn"><i class="fa-solid fa-trash"></i> <span data-i18n="clear"></span></button>
      </div>
    </div>
    <div id="batchSum" style="font-size:.9rem;color:var(--sub);margin-bottom:10px"></div>
    <div class="tblwrap"><table>
      <thead><tr><th data-i18n="cName"></th><th data-i18n="cStatus"></th><th data-i18n="sGap"></th><th data-i18n="sWall"></th><th data-i18n="cBody"></th><th></th></tr></thead>
      <tbody id="qbody"></tbody>
    </table></div>
  </div>

  <!-- ⑥ 單檔詳細結果 -->
  <div id="results">
    <div id="curName"></div>
    <!-- 單一實體檢查（最重要，放最上面）-->
    <div id="bodyVerdict" class="verdict"></div>
    <div id="verdict" class="verdict"></div>
    <div class="stats" id="stats"></div>
    <div class="grid2">
      <div class="card">
        <h2><i class="fa-solid fa-eye"></i><span data-i18n="view"></span></h2>
        <div id="viewer"></div>
        <div class="legend"><span class="dot" style="background:#f87171"></span><span data-i18n="lgGap"></span><span class="dot" style="background:#fbbf24"></span><span data-i18n="lgWall"></span> ・ <span data-i18n="lgBody"></span></div>
      </div>
      <div class="card">
        <h2><i class="fa-solid fa-list"></i><span data-i18n="issues"></span></h2>
        <div id="list"></div>
      </div>
    </div>
    <div class="card"><h2><i class="fa-solid fa-layer-group"></i><span data-i18n="shells"></span></h2><div id="shellList"></div></div>
  </div>

  <!-- 使用提示 -->
  <div class="card">
    <h2><i class="fa-solid fa-lightbulb"></i><span data-i18n="tipTitle"></span></h2>
    <ul class="tips">
      <li data-i18n="tip1"></li><li data-i18n="tip2"></li><li data-i18n="tip3"></li><li data-i18n="tip4"></li><li data-i18n="tip5"></li>
    </ul>
  </div>
</div>

<!-- ⑦ 頁尾 -->
<footer><span data-i18n="foot"></span></footer>

<!-- 3D 檢視用（Three.js） -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

let lang='zh';
const t=(k,v)=>{let s=I18N[lang][k]||k; if(v)for(const a in v)s=s.replace('{'+a+'}',v[a]); return s;};
function applyLang(){
  document.documentElement.lang = lang==='zh'?'zh-Hant':'en';
  document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=t(e.dataset.i18n));
  document.getElementById('langBtn').textContent = lang==='zh'?'EN':'中文';
  renderQueue(); if(cur&&cur.result) renderResults(cur);
}
document.getElementById('langBtn').onclick=()=>{lang=lang==='zh'?'en':'zh';applyLang();};

/* ========== STL 解析 ========== */
function parseSTL(buf){
  if(buf.byteLength>=84){
    const dv=new DataView(buf), n=dv.getUint32(80,true);
    if(84+n*50===buf.byteLength){ // 二進位
      const pos=new Float32Array(n*9); let o=84;
      for(let i=0;i<n;i++){o+=12;for(let j=0;j<9;j++){pos[i*9+j]=dv.getFloat32(o,true);o+=4;}o+=2;}
      return pos;
    }
  }
  const txt=new TextDecoder().decode(buf), re=/vertex\s+(\S+)\s+(\S+)\s+(\S+)/g, a=[]; let m;
  while((m=re.exec(txt)))a.push(+m[1],+m[2],+m[3]);
  if(a.length<9||a.length%9) throw new Error('bad');
  return new Float32Array(a);
}

/* ========== 前處理：去除退化三角形、計算法線 ========== */
function prepare(raw){
  const N0=raw.length/9, pos=new Float32Array(raw.length), nor=new Float32Array(N0*3); let N=0;
  for(let i=0;i<N0;i++){
    const o=i*9, ax=raw[o+3]-raw[o], ay=raw[o+4]-raw[o+1], az=raw[o+5]-raw[o+2],
          bx=raw[o+6]-raw[o], by=raw[o+7]-raw[o+1], bz=raw[o+8]-raw[o+2];
    let nx=ay*bz-az*by, ny=az*bx-ax*bz, nz=ax*by-ay*bx; const l=Math.hypot(nx,ny,nz);
    if(l<1e-9) continue;
    for(let j=0;j<9;j++)pos[N*9+j]=raw[o+j];
    nor[N*3]=nx/l;nor[N*3+1]=ny/l;nor[N*3+2]=nz/l; N++;
  }
  return {pos:pos.slice(0,N*9),nor:nor.slice(0,N*3),N};
}

/* ========== 實體（Shell）分析 ==========
   嚴格判斷：三角形必須「共用邊（剛好 2 個三角形共邊）」才算真正相連。
   寬鬆判斷：只要共用頂點就算相連。
   - 嚴格 = 1            → 單一實體
   - 寬鬆 > 1            → 多個互不相連的實體
   - 寬鬆 = 1 但嚴格 > 1 → 只有點／線／面剛好接觸，沒有真正融合 */
function topology(pos,N){
  const map=new Map(), idx=new Uint32Array(N*3); let vc=0;
  for(let i=0;i<N*3;i++){
    const k=Math.round(pos[i*3]*1e4)+','+Math.round(pos[i*3+1]*1e4)+','+Math.round(pos[i*3+2]*1e4);
    let id=map.get(k); if(id===undefined){id=vc++;map.set(k,id);} idx[i]=id;
  }
  // 頂點並查集（寬鬆）
  const par=new Int32Array(vc).map((_,i)=>i);
  const find=x=>{while(par[x]!==x){par[x]=par[par[x]];x=par[x];}return x;};
  // 三角形並查集（嚴格）
  const tp=new Int32Array(N).map((_,i)=>i);
  const findT=x=>{while(tp[x]!==x){tp[x]=tp[tp[x]];x=tp[x];}return x;};
  const edges=new Map(); // 邊 -> [數量, 第一個三角形]
  for(let i=0;i<N;i++){
    const a=idx[i*3],b=idx[i*3+1],c=idx[i*3+2];
    par[find(a)]=find(b); par[find(b)]=find(c);
    for(const [p,q] of [[a,b],[b,c],[c,a]]){
      const k=p<q?p*vc+q:q*vc+p; const e=edges.get(k);
      if(!e)edges.set(k,[1,i]);
      else{e[0]++; if(e[0]===2){tp[findT(e[1])]=findT(i);}}
    }
  }
  let open=0; edges.forEach(v=>{if(v[0]!==2)open++;});
  const loose=new Set(); for(let i=0;i<N;i++)loose.add(find(idx[i*3]));
  // 依嚴格判斷整理每個實體
  const rootToId=new Map(), shells=[], triShell=new Int32Array(N);
  for(let i=0;i<N;i++){
    const r=findT(i); let sid=rootToId.get(r);
    if(sid===undefined){sid=shells.length;rootToId.set(r,sid);shells.push({tri:0,min:[1e9,1e9,1e9],max:[-1e9,-1e9,-1e9]});}
    const s=shells[sid]; s.tri++; triShell[i]=sid;
    for(let v=0;v<3;v++)for(let k=0;k<3;k++){const x=pos[i*9+v*3+k]; if(x<s.min[k])s.min[k]=x; if(x>s.max[k])s.max[k]=x;}
  }
  shells.sort((a,b)=>b.tri-a.tri); // 大的排前面
  // 排序後要重新對應編號
  const order=new Map(); shells.forEach((s,i)=>order.set(s,i));
  const remap=new Int32Array(rootToId.size); let n=0;
  // 重新計算 triShell（依三角形數量排序後的編號）
  const tmp=[...rootToId.keys()].map(r=>({r,tri:0})); 
  const cnt=new Map(); for(let i=0;i<N;i++){const r=findT(i);cnt.set(r,(cnt.get(r)||0)+1);}
  const sorted=[...cnt.entries()].sort((a,b)=>b[1]-a[1]); const finalId=new Map(); sorted.forEach((e,i)=>finalId.set(e[0],i));
  for(let i=0;i<N;i++)triShell[i]=finalId.get(findT(i));
  let type='single';
  if(shells.length>1) type = loose.size>1 ? 'multi' : 'touch';
  return {shells,open,triShell,type};
}

/* ========== BVH 加速結構（用來快速射線偵測）========== */
function buildBVH(pos,N){
  const cen=new Float32Array(N*3), bmin=new Float32Array(N*3), bmax=new Float32Array(N*3), idx=new Uint32Array(N).map((_,i)=>i);
  for(let i=0;i<N;i++)for(let k=0;k<3;k++){
    const a=pos[i*9+k],b=pos[i*9+3+k],c=pos[i*9+6+k];
    bmin[i*3+k]=Math.min(a,b,c);bmax[i*3+k]=Math.max(a,b,c);cen[i*3+k]=(a+b+c)/3;
  }
  function build(lo,hi){
    const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
    for(let j=lo;j<hi;j++){const i=idx[j];for(let k=0;k<3;k++){if(bmin[i*3+k]<mn[k])mn[k]=bmin[i*3+k];if(bmax[i*3+k]>mx[k])mx[k]=bmax[i*3+k];}}
    const node={mn,mx,lo,hi,l:null,r:null};
    if(hi-lo<=6)return node;
    let ax=0,ext=mx[0]-mn[0]; for(let k=1;k<3;k++)if(mx[k]-mn[k]>ext){ext=mx[k]-mn[k];ax=k;}
    idx.subarray(lo,hi).sort((a,b)=>cen[a*3+ax]-cen[b*3+ax]);
    const mid=(lo+hi)>>1; node.l=build(lo,mid); node.r=build(mid,hi); return node;
  }
  return {root:build(0,N),idx,pos};
}
function cast(B,o,d,maxT){
  const pos=B.pos,idx=B.idx; let best=maxT,bi=-1;
  const inv=[1/d[0],1/d[1],1/d[2]], st=[B.root];
  while(st.length){
    const n=st.pop(); let t0=0,t1=best;
    for(let k=0;k<3;k++){
      let a=(n.mn[k]-0.001-o[k])*inv[k], b=(n.mx[k]+0.001-o[k])*inv[k];
      if(a>b){const x=a;a=b;b=x;} if(a>t0)t0=a; if(b<t1)t1=b; if(t0>t1)break;
    }
    if(t0>t1)continue;
    if(!n.l){
      for(let j=n.lo;j<n.hi;j++){
        const i=idx[j],p=i*9;
        const e1x=pos[p+3]-pos[p],e1y=pos[p+4]-pos[p+1],e1z=pos[p+5]-pos[p+2];
        const e2x=pos[p+6]-pos[p],e2y=pos[p+7]-pos[p+1],e2z=pos[p+8]-pos[p+2];
        const px=d[1]*e2z-d[2]*e2y,py=d[2]*e2x-d[0]*e2z,pz=d[0]*e2y-d[1]*e2x;
        const det=e1x*px+e1y*py+e1z*pz; if(Math.abs(det)<1e-12)continue;
        const id=1/det,tx=o[0]-pos[p],ty=o[1]-pos[p+1],tz=o[2]-pos[p+2];
        const u=(tx*px+ty*py+tz*pz)*id; if(u<0||u>1)continue;
        const qx=ty*e1z-tz*e1y,qy=tz*e1x-tx*e1z,qz=tx*e1y-ty*e1x;
        const v=(d[0]*qx+d[1]*qy+d[2]*qz)*id; if(v<0||u+v>1)continue;
        const tt=(e2x*qx+e2y*qy+e2z*qz)*id;
        if(tt>0.001&&tt<best){best=tt;bi=i;}
      }
    } else {st.push(n.l,n.r);}
  }
  return bi<0?null:{t:best,i:bi};
}

/* ========== 批次狀態 ========== */
// items 每一項：{file, name, status:'wait|run|done|err', prep, topo, result}
const items=[]; let cur=null, running=false;
const frame=()=>new Promise(r=>setTimeout(r,0));
function setProg(p,text){document.getElementById('bar').style.width=p+'%';document.getElementById('pText').textContent=text;}

// 把相近的問題點合併成一處（每 2mm 一格）
function addIssue(map,type,o,dist,dir){
  const axis=Math.abs(dir[2])>0.7?'Z':'XY';
  const mid=[o[0]+dir[0]*dist/2,o[1]+dir[1]*dist/2,o[2]+dir[2]*dist/2];
  const key=type+axis+Math.round(mid[0]/2)+','+Math.round(mid[1]/2)+','+Math.round(mid[2]/2);
  const e=map.get(key);
  if(e){e.cnt++; if(dist<e.d)e.d=dist;}
  else map.set(key,{type,axis,d:dist,pos:mid,cnt:1});
}

/* ========== 單一檔案的完整分析 ========== */
async function processItem(it,prog){
  if(!it.prep){ // 第一次：讀檔 + 解析
    prog(0.02,'reading'); const buf=await it.file.arrayBuffer(); await frame();
    prog(0.08,'parsing'); const raw=parseSTL(buf); await frame();
    it.prep=prepare(raw);
    prog(0.15,'welding'); await frame();
    it.topo=topology(it.prep.pos,it.prep.N);
  }
  prog(0.22,'bvh'); await frame();
  const bvh=buildBVH(it.prep.pos,it.prep.N);
  const gapThr=+document.getElementById('gapThr').value||0.3, wallThr=+document.getElementById('wallThr').value||0.4;
  const maxRays=+document.getElementById('maxRays').value||60000;
  const {pos,nor,N}=it.prep;
  const perTri=4, stride=Math.max(1,Math.ceil(N*perTri/maxRays));
  const clusters=new Map(); let lastP=0;
  const o=[0,0,0], d=[0,0,0];
  for(let i=0;i<N;i+=stride){
    const p=i*9, c=[(pos[p]+pos[p+3]+pos[p+6])/3,(pos[p+1]+pos[p+4]+pos[p+7])/3,(pos[p+2]+pos[p+5]+pos[p+8])/3];
    const n=[nor[i*3],nor[i*3+1],nor[i*3+2]];
    for(let s=0;s<perTri;s++){
      for(let k=0;k<3;k++) o[k]= s===0? c[k] : pos[p+(s-1)*3+k]+(c[k]-pos[p+(s-1)*3+k])*0.3;
      // 往外射：偵測縫隙
      for(let k=0;k<3;k++)d[k]=n[k];
      let h=cast(bvh,o,d,gapThr);
      if(h){const q=h.i*3; if(nor[q]*d[0]+nor[q+1]*d[1]+nor[q+2]*d[2]<-0.9) addIssue(clusters,'gap',o,h.t,d);}
      // 往內射：偵測薄壁
      for(let k=0;k<3;k++)d[k]=-n[k];
      h=cast(bvh,o,d,wallThr);
      if(h){const q=h.i*3; if(nor[q]*d[0]+nor[q+1]*d[1]+nor[q+2]*d[2]>0.9) addIssue(clusters,'wall',o,h.t,d);}
    }
    if((i/stride)%500===0){const f=0.25+0.75*(i/N); if(f-lastP>0.02){lastP=f;prog(f,'ray');await frame();}}
  }
  const issues=[...clusters.values()].sort((a,b)=>(a.type===b.type?0:a.type==='gap'?-1:1)||a.d-b.d);
  const gaps=issues.filter(x=>x.type==='gap').length;
  it.result={issues,gaps,walls:issues.length-gaps};
}

/* ========== 佇列執行（一個一個依序處理）========== */
async function runQueue(){
  if(running)return; running=true;
  document.getElementById('progress').style.display='block';
  document.getElementById('rerun').disabled=true;
  const total=items.length;
  for(let idx=0;idx<items.length;idx++){
    const it=items[idx]; if(it.status!=='wait')continue;
    it.status='run'; renderQueue();
    const label=t('fileOf',{i:idx+1,n:total,name:it.name});
    try{
      await processItem(it,(f,key)=>setProg(((idx+f)/total)*100,label+' ・ '+t(key)));
      it.status='done';
    }catch(e){console.error(e); it.status='err'; it.result=null;}
    renderQueue();
    if(!cur&&it.status==='done')selectItem(it);
  }
  setProg(100,t('done'));
  running=false; document.getElementById('rerun').disabled=false;
  setTimeout(()=>{if(!running)document.getElementById('progress').style.display='none';},1500);
}

/* ========== 批次總表 ========== */
// 狀態優先順序：縫隙 > 多實體 > 過薄 > 正常
function verdictOf(it){
  if(it.status==='wait')return['wait','stWait'];
  if(it.status==='run')return['run','stRun'];
  if(it.status==='err')return['bad','stErr'];
  if(it.result.gaps)return['bad','stBad'];
  if(it.topo.shells.length>1)return['bad','stMulti'];
  if(it.result.walls)return['warn','stWarn'];
  return['ok','stOk'];
}
function renderQueue(){
  document.getElementById('queueCard').style.display=items.length?'block':'none';
  const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const body=document.getElementById('qbody'); body.innerHTML='';
  let ok=0,gap=0,multi=0,thin=0,err=0;
  items.forEach((it,i)=>{
    const [cls,key]=verdictOf(it);
    const done=it.status==='done';
    if(it.status==='err')err++;
    if(done){ if(cls==='ok')ok++; if(it.result.gaps)gap++; if(it.topo.shells.length>1)multi++; if(it.result.walls)thin++; }
    const n=done?it.topo.shells.length:0;
    const bodyCell=!done?'-':(n===1?'<span class="pill ok">1 ✓</span>':`<span class="pill bad">${n} ✗</span>`);
    const tr=document.createElement('tr'); tr.className='qrow'+(it===cur?' sel':'');
    tr.innerHTML=`<td class="fname" title="${esc(it.name)}"><i class="fa-solid fa-cube" style="color:var(--accent);margin-right:6px"></i>${esc(it.name)}</td>
      <td><span class="pill ${cls}">${t(key)}</span></td>
      <td>${done?it.result.gaps:'-'}</td><td>${done?it.result.walls:'-'}</td><td>${bodyCell}</td>
      <td><button class="xbtn" title="remove"><i class="fa-solid fa-xmark"></i></button></td>`;
    tr.onclick=()=>{if(done)selectItem(it);};
    tr.querySelector('.xbtn').onclick=e=>{e.stopPropagation();removeItem(i);};
    body.appendChild(tr);
  });
  const fin=items.some(x=>x.status==='done');
  document.getElementById('batchSum').textContent=fin||err?t('batchSum',{n:items.length,ok,gap,multi,thin,err:err?t('batchErr',{n:err}):''}):'';
}
function removeItem(i){
  if(items[i].status==='run')return;
  const it=items.splice(i,1)[0];
  if(it===cur){cur=null;document.getElementById('results').style.display='none';
    const next=items.find(x=>x.status==='done'); if(next)selectItem(next);}
  renderQueue();
}
document.getElementById('clearBtn').onclick=()=>{
  if(running)return; items.length=0; cur=null;
  document.getElementById('results').style.display='none'; document.getElementById('rerun').disabled=true; renderQueue();
};
// 匯出 CSV（加 BOM，Excel 開啟中文不會亂碼）
document.getElementById('csvBtn').onclick=()=>{
  const rows=[['file','status','single_body','bodies','gaps','thin_spots','open_edges','triangles','size_x','size_y','size_z']];
  items.forEach(it=>{
    if(it.status!=='done'){rows.push([it.name,it.status]);return;}
    const mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];

    rows.push([it.name,verdictOf(it)[1].slice(2).toLowerCase(),it.topo.shells.length===1?'yes':'NO',it.topo.shells.length,it.result.gaps,it.result.walls,it.topo.open,it.prep.N,f2(mx[0]-mn[0]),f2(mx[1]-mn[1]),f2(mx[2]-mn[2])]);
  });
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');

/* ========== 單檔結果顯示 ========== */

/* ========== 3D 檢視 ========== */
let scene,camera,renderer,controls,meshObj,markers,inited=false;
function init3D(){
  const el=document.getElementById('viewer');
  scene=new THREE.Scene(); scene.background=new THREE.Color(0x0b1222);
  camera=new THREE.PerspectiveCamera(45,el.clientWidth/el.clientHeight,0.1,10000); camera.up.set(0,0,1); // Z 軸朝上
  renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(devicePixelRatio);
  renderer.setSize(el.clientWidth,el.clientHeight); el.appendChild(renderer.domElement);
  controls=new THREE.OrbitControls(camera,renderer.domElement); controls.enableDamping=true;
  scene.add(new THREE.AmbientLight(0xffffff,.6));
  const dl=new THREE.DirectionalLight(0xffffff,.8); dl.position.set(1,-1,2); scene.add(dl);
  const dl2=new THREE.DirectionalLight(0xffffff,.4); dl2.position.set(-1,1,-1); scene.add(dl2);
  (function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera);})();
  new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;if(!w)return;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}).observe(el);
  inited=true;
}
function build3D(it){
  if(!inited)init3D();
  if(meshObj){scene.remove(meshObj);meshObj.geometry.dispose();}
  if(markers){scene.remove(markers);markers.geometry.dispose();}
  const N=it.prep.N, nb=it.topo.shells.length;
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(it.prep.pos,3)); g.computeVertexNormals();
  // 依實體上色（多實體時每個實體不同色）
  const col=new Float32Array(N*9), cc=PALETTE.map(h=>new THREE.Color(h));
  for(let i=0;i<N;i++){const c=cc[nb>1?it.topo.triShell[i]%cc.length:0];for(let v=0;v<3;v++){col[i*9+v*3]=c.r;col[i*9+v*3+1]=c.g;col[i*9+v*3+2]=c.b;}}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  meshObj=new THREE.Mesh(g,new THREE.MeshStandardMaterial({vertexColors:true,transparent:true,opacity:nb>1?.7:.5,side:THREE.DoubleSide,roughness:.6}));
  scene.add(meshObj);
  g.computeBoundingBox(); const bb=g.boundingBox, c=bb.getCenter(new THREE.Vector3()), size=bb.getSize(new THREE.Vector3()).length();
  // 標記點
  const iss=it.result.issues, pa=new Float32Array(iss.length*3), ca=new Float32Array(iss.length*3);
  iss.forEach((x,i)=>{pa.set(x.pos,i*3); ca.set(x.type==='gap'?[.97,.44,.44]:[.98,.75,.14],i*3);});
  const mg=new THREE.BufferGeometry(); mg.setAttribute('position',new THREE.BufferAttribute(pa,3)); mg.setAttribute('color',new THREE.BufferAttribute(ca,3));
  markers=new THREE.Points(mg,new THREE.PointsMaterial({size:12,sizeAttenuation:false,vertexColors:true,depthTest:false}));
  markers.renderOrder=10; scene.add(markers);
  // 平台格線
  if(window._grid)scene.remove(window._grid);
  const gr=new THREE.GridHelper(Math.max(size*1.5,50),20,0x38bdf8,0x334155); gr.rotation.x=Math.PI/2; gr.position.set(c.x,c.y,bb.min.z); scene.add(gr); window._grid=gr;
  controls.target.copy(c); camera.position.set(c.x+size*.9,c.y-size*.9,c.z+size*.7); camera.near=size/1000;camera.far=size*20;camera.updateProjectionMatrix();
}
function focusOn(p){
  const tgt=new THREE.Vector3(...p), dir=camera.position.clone().sub(controls.target).normalize();
  const dist=Math.max(8,meshObj.geometry.boundingBox.getSize(new THREE.Vector3()).length()*0.15);
  controls.target.copy(tgt); camera.position.copy(tgt.clone().add(dir.multiplyScalar(dist)));
  document.getElementById('viewer').scrollIntoView({behavior:'smooth',block:'center'});
}

/* ========== 檔案上傳（多檔）========== */
const drop=document.getElementById('drop'), fileIn=document.getElementById('file');
function addFiles(list){
  const arr=[...list].filter(f=>/\.stl$/i.test(f.name));
  if(!arr.length)return;
  arr.forEach(f=>items.push({file:f,name:f.name,status:'wait',prep:null,topo:null,result:null}));
  renderQueue(); runQueue();
}
drop.onclick=()=>fileIn.click();
fileIn.onchange=()=>{addFiles(fileIn.files);fileIn.value='';};
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over');}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over');}));
drop.addEventListener('drop',ev=>addFiles(ev.dataTransfer.files));
// 以新參數重新檢查全部（不用重新選檔）
document.getElementById('rerun').onclick=()=>{
  items.forEach(it=>{if(it.status!=='run'&&it.prep){it.status='wait';it.result=null;}});
  const keep=cur; renderQueue(); runQueue().then(()=>{if(keep&&keep.result)selectItem(keep);});
};
applyLang();
