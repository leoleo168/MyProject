<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="快速導航">
<title>快速導航</title>
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<style>
:root{--bg:#111827;--card:#1f2937;--text:#f9fafb;--sub:#9ca3af;--accent:#3b82f6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
header h1{font-size:22px;margin:0}
.hbtns{display:flex;gap:8px}
.chip{border:0;background:var(--card);color:var(--text);padding:10px 14px;border-radius:999px;font-size:15px;font-weight:600}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--accent)}
#modeBar{display:flex;gap:8px;margin:4px 16px 0;background:var(--card);padding:6px;border-radius:16px}
#modeBar button{flex:1;border:0;background:transparent;color:var(--sub);padding:10px 4px;border-radius:12px;font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
#modeBar button span{font-size:24px;line-height:1}
#modeBar button.on{background:var(--accent);color:#fff}
#install{display:none;margin:8px 16px 0;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#2563eb,#7c3aed);align-items:center;justify-content:space-between;font-size:15px;font-weight:600}
#install button{border:0;background:#fff;color:#1d4ed8;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px}
#grid{flex:1;overflow-y:auto;padding:12px 16px 24px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:170px;gap:14px;align-content:start}
.big{position:relative;border:0;border-radius:24px;height:170px;min-width:0;overflow:hidden;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.35);transition:transform .1s}
.big:active{transform:scale(.94);filter:brightness(.9)}
.big .ic{font-size:46px;line-height:1}
.big .nm{font-size:22px;font-weight:800;text-align:center;word-break:break-all;max-width:100%;line-height:1.2;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.big .ds{font-size:12px;opacity:.85;max-width:100%;line-height:1.3;height:2.6em;text-align:center;word-break:break-all;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.big .md{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:4px 8px;font-size:15px}
.big .edit{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);border-radius:999px;padding:6px 10px;font-size:13px;display:none}
.big .del{position:absolute;top:8px;left:8px;width:36px;height:36px;border-radius:50%;background:#dc2626;color:#fff;font-size:18px;font-weight:800;display:none;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.big .mv{position:absolute;left:10px;right:10px;bottom:10px;display:none;justify-content:space-between}
.big .mv b{width:48px;height:36px;border-radius:12px;background:rgba(0,0,0,.4);font-size:18px;display:flex;align-items:center;justify-content:center}
.big .mv b:active{background:rgba(0,0,0,.7)}
.big .mv b.off{opacity:.25;pointer-events:none}
.editing .big .edit{display:block}
.editing .big .del{display:flex}
.editing .big .mv{display:flex}
.editing .big .md{display:none}
.editing .big .ds{display:none}
.editing .big .ic{margin-top:-18px}
.editing .add .del,.editing .add .mv,.editing .add .edit{display:none}
.add{background:transparent;border:3px dashed #4b5563;color:var(--sub);box-shadow:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow-y:auto;user-select:text}
.sheet h2{margin:0 0 12px;font-size:20px}
label{display:block;font-size:13px;color:var(--sub);margin:12px 0 6px}
input,select{width:100%;padding:14px;border-radius:12px;border:1px solid #374151;background:#111827;color:var(--text);font-size:16px;-webkit-user-select:text;user-select:text}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.colors i{width:38px;height:38px;border-radius:50%;border:3px solid transparent}
.colors i.sel{border-color:#fff}
.icons{display:flex;gap:8px;flex-wrap:wrap}
.icons span{font-size:26px;padding:6px 8px;border-radius:12px;background:#111827;border:2px solid transparent}
.icons span.sel{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:14px;border:0;border-radius:14px;font-size:16px;font-weight:700;color:#fff}
.b-save{background:var(--accent)}.b-cancel{background:#4b5563}.b-del{background:#dc2626}
.b-map{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;background:#0f766e;color:#fff;font-size:16px;font-weight:700}
.hint{font-size:12px;color:var(--sub);margin-top:6px;line-height:1.5}

/* 地圖選點 */
#mMap{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#mMap.show{display:flex}
#mapTop{display:flex;gap:8px;padding:10px 12px;background:var(--card)}
#mapTop input{flex:1;padding:12px}
#mapTop button{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:0 16px;font-size:16px;font-weight:700}
#map{flex:1;min-height:0;background:#e5e7eb}
#mapBot{background:var(--card);padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
#mapAddr{font-size:15px;font-weight:600;margin-bottom:4px;min-height:22px;user-select:text}
#mapCoord{font-size:12px;color:var(--sub);margin-bottom:10px}
#mapBot .row{margin-top:0}
.b-loc{background:#0f766e}
</style>
</head>
<body>
<header>
  <h1>🧭 快速導航</h1>
  <div class="hbtns">
    <button class="chip" id="btnSet">⚙️</button>
    <button class="chip" id="btnEdit">編輯</button>
  </div>
</header>

<div id="modeBar"></div>
<div id="install"><span>📲 安裝為手機 App</span><button id="installBtn">安裝</button></div>
<main id="grid"></main>

<!-- 編輯按鈕視窗 -->
<div class="modal" id="mEdit"><div class="sheet">
  <h2 id="eTitle">新增按鈕</h2>
  <label>按鈕名稱</label><input id="fName" placeholder="例如：回家、公司" maxlength="12">
  <label>目的地（地址、地標名稱或座標）</label><input id="fDest" placeholder="例如：台北101 或 25.0330,121.5654">
  <button class="b-map" id="btnPick" type="button">🗺️ 從地圖選點</button>
  <div class="hint" id="fLabelHint"></div>
  <label>行進方式</label>
  <select id="fMode">
    <option value="default">跟隨上方設定</option>
    <option value="driving">🚗 汽車</option>
    <option value="scooter">🛵 機車</option>
    <option value="bicycling">🚲 腳踏車</option>
  </select>
  <label>圖示</label><div class="icons" id="fIcons"></div>
  <label>顏色</label><div class="colors" id="fColors"></div>
  <div class="row">
    <button class="b-del" id="eDel">刪除</button>
    <button class="b-cancel" id="eCancel">取消</button>
    <button class="b-save" id="eSave">儲存</button>
  </div>
</div></div>

<!-- 設定視窗 -->
<div class="modal" id="mSet"><div class="sheet">
  <h2>設定</h2>
  <label>汽車導航 App</label>
  <select id="sApp">
    <option value="google">Google 地圖</option>
    <option value="apple">Apple 地圖（iPhone）</option>
    <option value="waze">Waze</option>
  </select>
  <div class="hint">機車與腳踏車一律使用 Google 地圖，因為 Apple 地圖與 Waze 的網址不支援這兩種模式。</div>
  <label>點擊後</label>
  <select id="sConfirm">
    <option value="0">立即開始導航</option>
    <option value="1">先跳出確認再導航</option>
  </select>
  <div class="row"><button class="b-save" id="sClose">完成</button></div>
</div></div>

<!-- 地圖選點 -->
<div id="mMap">
  <div id="mapTop">
    <input id="mapQ" placeholder="搜尋地名或地址" enterkeyhint="search">
    <button id="mapSearch">搜尋</button>
  </div>
  <div id="map"></div>
  <div id="mapBot">
    <div id="mapAddr">點一下地圖選擇目的地</div>
    <div id="mapCoord"></div>
    <div class="row">
      <button class="b-loc" id="mapLoc">📍 我的位置</button>
      <button class="b-cancel" id="mapCancel">取消</button>
      <button class="b-save" id="mapOk">確定</button>
    </div>
  </div>
</div>

<script>
/* ===== PWA：Manifest（Data URL） ===== */
const iconSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='110' fill='#2563eb'/><text x='256' y='345' font-size='280' text-anchor='middle'>🧭</text></svg>`;
const iconUrl = 'data:image/svg+xml,' + encodeURIComponent(iconSvg);
const manifest = {
  name:'快速導航', short_name:'快速導航', display:'standalone',
  background_color:'#111827', theme_color:'#111827', start_url:'.',
  icons:[{src:iconUrl,sizes:'any',type:'image/svg+xml',purpose:'any maskable'}]
};
document.getElementById('manifestLink').href = 'data:application/manifest+json,' + encodeURIComponent(JSON.stringify(manifest));
document.getElementById('appleIcon').href = iconUrl;

/* ===== PWA：Service Worker（Blob URL，只快取同網域檔案） ===== */
if ('serviceWorker' in navigator) {
  try {
    const swCode = `
      const C='quicknav-v5';
      self.addEventListener('install',e=>{self.skipWaiting();e.waitUntil(caches.open(C).then(c=>c.add(self.registration.scope).catch(()=>{})))});
      self.addEventListener('activate',e=>e.waitUntil(clients.claim()));
      self.addEventListener('fetch',e=>{
        if(e.request.method!=='GET')return;
        if(new URL(e.request.url).origin!==self.location.origin)return;
        e.respondWith(fetch(e.request).then(r=>{const cp=r.clone();caches.open(C).then(c=>c.put(e.request,cp));return r}).catch(()=>caches.match(e.request).then(m=>m||caches.match(self.registration.scope))));
      });`;
    const swUrl = URL.createObjectURL(new Blob([swCode], {type:'text/javascript'}));
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  } catch(e){}
}

/* ===== 安裝提示 ===== */
let deferredPrompt = null;
const installBar = document.getElementById('install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; installBar.style.display='flex'; });
document.getElementById('installBtn').onclick = async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt(); await deferredPrompt.userChoice;
  deferredPrompt = null; installBar.style.display='none';
};
window.addEventListener('appinstalled', () => installBar.style.display='none');
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
if (isIOS && !standalone) {
  installBar.style.display='flex';
  installBar.innerHTML = '<span>📲 點 Safari 下方「分享」→「加入主畫面」即可安裝</span>';
}

/* ===== 資料 ===== */
const KEY='quicknav_items_v1', SKEY='quicknav_settings_v1';
const COLORS=['#2563eb','#16a34a','#ea580c','#dc2626','#7c3aed','#0891b2','#db2777','#475569'];
const ICONS=['🏠','🏢','🏫','🛒','⛽','🏥','🍜','☕','🅿️','🏖️','✈️','🚉','💪','🎓','❤️','📍'];
const MODES={
  driving:  {icon:'🚗', name:'汽車',   gmode:'driving'},
  scooter:  {icon:'🛵', name:'機車',   gmode:'two-wheeler'},
  bicycling:{icon:'🚲', name:'腳踏車', gmode:'bicycling'}
};
let items = JSON.parse(localStorage.getItem(KEY) || 'null') || [
  {id:1,name:'回家',dest:'',icon:'🏠',color:COLORS[0],mode:'default'},
  {id:2,name:'公司',dest:'',icon:'🏢',color:COLORS[1],mode:'default'}
];
let settings = Object.assign({app: isIOS?'apple':'google', confirm:'0', mode:'driving'}, JSON.parse(localStorage.getItem(SKEY)||'{}'));
if(!MODES[settings.mode]) settings.mode='driving';
const save = () => localStorage.setItem(KEY, JSON.stringify(items));
const saveS = () => localStorage.setItem(SKEY, JSON.stringify(settings));

let editMode=false, editingId=null, selIcon=ICONS[0], selColor=COLORS[0], curLabel='';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const modeOf = it => (it.mode && MODES[it.mode]) ? it.mode : settings.mode;

/* ===== 導航 ===== */
function navUrl(dest, mode){
  const q = encodeURIComponent(dest);
  if (mode==='driving') {
    if (settings.app==='waze') return `https://waze.com/ul?q=${q}&navigate=yes`;
    if (settings.app==='apple') return `https://maps.apple.com/?daddr=${q}&dirflg=d`;
  }
  return `https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=${MODES[mode].gmode}&dir_action=navigate`;
}
function go(it){
  if (!it.dest) { alert('「'+it.name+'」尚未設定目的地，請按右上角「編輯」設定。'); return; }
  const m = modeOf(it);
  if (settings.confirm==='1' && !confirm(MODES[m].icon+' '+MODES[m].name+' 導航到「'+it.name+'」？\n'+(it.label||it.dest))) return;
  location.href = navUrl(it.dest, m);
}

/* ===== 畫面 ===== */
function renderModeBar(){
  $('modeBar').innerHTML = Object.entries(MODES).map(([k,v])=>
    `<button data-m="${k}" class="${k===settings.mode?'on':''}"><span>${v.icon}</span>${v.name}</button>`).join('');
  $('modeBar').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    settings.mode=b.dataset.m; saveS(); renderModeBar(); render();
  });
}
function render(){
  const g=$('grid'); g.className = editMode?'editing':'';
  const last = items.length-1;
  let h = items.map((it,i)=>`
    <button class="big" style="background:${it.color}" data-id="${it.id}">
      <span class="md">${MODES[modeOf(it)].icon}</span>
      <span class="del" data-act="del">✕</span>
      <span class="edit" data-act="edit">✏️ 編輯</span>
      <span class="ic">${it.icon}</span>
      <span class="nm">${esc(it.name)}</span>
      <span class="ds">${it.dest?esc(it.label||it.dest):'尚未設定目的地'}</span>
      <span class="mv">
        <b data-act="left" class="${i===0?'off':''}">◀</b>
        <b data-act="right" class="${i===last?'off':''}">▶</b>
      </span>
    </button>`).join('');
  h += `<button class="big add" id="addBtn"><span class="ic">＋</span><span class="nm">新增</span></button>`;
  g.innerHTML = h;
  g.querySelectorAll('.big[data-id]').forEach(b=>{
    b.onclick=(e)=>{
      const id = Number(b.dataset.id);
      const idx = items.findIndex(x=>x.id===id);
      if(idx<0) return;
      const it = items[idx];
      const act = e.target.closest('[data-act]');
      const a = act ? act.dataset.act : '';
      if(editMode){
        if(a==='del'){ quickDelete(idx); return; }
        if(a==='left'){ move(idx,-1); return; }
        if(a==='right'){ move(idx,1); return; }
        openEdit(it); return;
      }
      go(it);
    };
  });
  $('addBtn').onclick=()=>openEdit(null);
  $('btnEdit').classList.toggle('on',editMode);
  $('btnEdit').textContent = editMode?'完成':'編輯';
}

function quickDelete(idx){
  const it = items[idx];
  if(confirm('刪除「'+it.name+'」？')){
    items.splice(idx,1); save(); render();
  }
}
function move(idx,dir){
  const j = idx+dir;
  if(j<0 || j>=items.length) return;
  const keep = $('grid').scrollTop;
  [items[idx],items[j]] = [items[j],items[idx]];
  save(); render();
  $('grid').scrollTop = keep;
}

function buildPickers(){
  $('fIcons').innerHTML = ICONS.map(i=>`<span data-i="${i}" class="${i===selIcon?'sel':''}">${i}</span>`).join('');
  $('fColors').innerHTML = COLORS.map(c=>`<i data-c="${c}" style="background:${c}" class="${c===selColor?'sel':''}"></i>`).join('');
  $('fIcons').querySelectorAll('span').forEach(s=>s.onclick=()=>{selIcon=s.dataset.i;buildPickers()});
  $('fColors').querySelectorAll('i').forEach(s=>s.onclick=()=>{selColor=s.dataset.c;buildPickers()});
}
function setLabel(t){ curLabel=t||''; $('fLabelHint').textContent = curLabel ? '📍 已選：'+curLabel : ''; }
function openEdit(it){
  editingId = it?it.id:null;
  $('eTitle').textContent = it?'編輯按鈕':'新增按鈕';
  $('fName').value = it?it.name:'';
  $('fDest').value = it?it.dest:'';
  setLabel(it?it.label:'');
  $('fMode').value = it?(it.mode||'default'):'default';
  selIcon = it?it.icon:ICONS[0];
  selColor = it?it.color:COLORS[items.length%COLORS.length];
  $('eDel').style.display = it?'block':'none';
  buildPickers();
  $('mEdit').classList.add('show');
}
$('fDest').addEventListener('input',()=>setLabel(''));
$('eCancel').onclick=()=>$('mEdit').classList.remove('show');
$('eSave').onclick=()=>{
  const name=$('fName').value.trim(), dest=$('fDest').value.trim(), mode=$('fMode').value, label=curLabel;
  if(!name){alert('請輸入按鈕名稱');return}
  if(editingId){
    const it=items.find(x=>x.id===editingId); Object.assign(it,{name,dest,label,mode,icon:selIcon,color:selColor});
  } else items.push({id:Date.now(),name,dest,label,mode,icon:selIcon,color:selColor});
  save(); $('mEdit').classList.remove('show'); render();
};
$('eDel').onclick=()=>{
  if(confirm('確定刪除這個按鈕？')){ items=items.filter(x=>x.id!==editingId); save(); $('mEdit').classList.remove('show'); render(); }
};
$('btnEdit').onclick=()=>{editMode=!editMode;render()};
$('btnSet').onclick=()=>{ $('sApp').value=settings.app; $('sConfirm').value=settings.confirm; $('mSet').classList.add('show') };
$('sClose').onclick=()=>{ settings.app=$('sApp').value; settings.confirm=$('sConfirm').value; saveS(); $('mSet').classList.remove('show') };
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) m.classList.remove('show') }));

/* ===== 地圖選點（Leaflet + OpenStreetMap） ===== */
let map=null, marker=null, picked=null, leafletReady=null;
function loadLeaflet(){
  if (window.L) return Promise.resolve();
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((res,rej)=>{
    const css=document.createElement('link');
    css.rel='stylesheet'; css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const s=document.createElement('script');
    s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    s.onload=res; s.onerror=()=>{leafletReady=null;rej()};
    document.head.appendChild(s);
  });
  return leafletReady;
}
function parseCoord(t){
  const m=/^\s*(-?\d+(\.\d+)?)\s*[,，\s]\s*(-?\d+(\.\d+)?)\s*$/.exec(t||'');
  return m?[parseFloat(m[1]),parseFloat(m[3])]:null;
}
function setPick(lat,lng,label){
  picked={lat,lng,label:label||''};
  if(!marker){
    marker=L.marker([lat,lng],{draggable:true}).addTo(map);
    marker.on('dragend',()=>{const p=marker.getLatLng();setPick(p.lat,p.lng)});
  } else marker.setLatLng([lat,lng]);
  $('mapCoord').textContent = lat.toFixed(6)+', '+lng.toFixed(6);
  if(label){ $('mapAddr').textContent=label; return; }
  $('mapAddr').textContent='查詢地址中…';
  const key=lat+','+lng;
  fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&accept-language=zh-TW&lat=${lat}&lon=${lng}`)
    .then(r=>r.json()).then(d=>{
      if(!picked||picked.lat+','+picked.lng!==key) return;
      picked.label = d.name && d.display_name ? d.name+'（'+d.display_name.split(',').slice(1,3).join(' ').trim()+'）' : (d.display_name||'');
      if(d.display_name && d.name===undefined) picked.label=d.display_name;
      $('mapAddr').textContent = picked.label || '已選擇位置';
    }).catch(()=>{ if(picked) $('mapAddr').textContent='已選擇位置（無法取得地址）'; });
}
async function openMap(){
  try { await loadLeaflet(); }
  catch(e){ alert('地圖載入失敗，請確認網路連線後再試。'); return; }
  $('mMap').classList.add('show');
  const exist = parseCoord($('fDest').value);
  if(!map){
    map=L.map('map',{zoomControl:true}).setView(exist||[25.033,121.5654],exist?16:13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
    map.on('click',e=>setPick(e.latlng.lat,e.latlng.lng));
  }
  setTimeout(()=>map.invalidateSize(),50);
  picked=null; $('mapAddr').textContent='點一下地圖選擇目的地'; $('mapCoord').textContent='';
  if(marker){map.removeLayer(marker);marker=null}
  if(exist){ map.setView(exist,16); setPick(exist[0],exist[1],curLabel); }
  else if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(p=>map.setView([p.coords.latitude,p.coords.longitude],15),()=>{},{timeout:6000});
  }
}
$('btnPick').onclick=openMap;
$('mapCancel').onclick=()=>$('mMap').classList.remove('show');
$('mapOk').onclick=()=>{
  if(!picked){alert('請先在地圖上點選目的地');return}
  $('fDest').value = picked.lat.toFixed(6)+','+picked.lng.toFixed(6);
  setLabel(picked.label||'');
  if(!$('fName').value.trim() && picked.label) $('fName').value = picked.label.split('（')[0].slice(0,12);
  $('mMap').classList.remove('show');
};
$('mapLoc').onclick=()=>{
  if(!navigator.geolocation){alert('此裝置不支援定位');return}
  navigator.geolocation.getCurrentPosition(p=>{
    map.setView([p.coords.latitude,p.coords.longitude],17);
    setPick(p.coords.latitude,p.coords.longitude);
  },()=>alert('無法取得位置，請確認已允許定位權限。'),{enableHighAccuracy:true,timeout:10000});
};
async function doSearch(){
  const q=$('mapQ').value.trim(); if(!q) return;
  $('mapAddr').textContent='搜尋中…';
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=zh-TW&q=${encodeURIComponent(q)}`);
    const d=await r.json();
    if(!d.length){ $('mapAddr').textContent='找不到結果，請換個關鍵字'; return; }
    const lat=parseFloat(d[0].lat), lng=parseFloat(d[0].lon);
    map.setView([lat,lng],17);
    setPick(lat,lng,d[0].display_name);
  }catch(e){ $('mapAddr').textContent='搜尋失敗，請確認網路連線'; }
}
$('mapSearch').onclick=doSearch;
$('mapQ').addEventListener('keydown',e=>{ if(e.key==='Enter') doSearch(); });

renderModeBar();
render();
</script>
</body>
</html>
